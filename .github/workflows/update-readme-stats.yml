name: Update Readme Stats

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh System Telemetry Metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: codexanjan
        run: |
          echo "Syncing GitHub telemetry and activity stream for $USERNAME..."
          node -e '
            const fs = require("fs");
            const date = new Date().toISOString().split("T")[0];
            console.log("Telemetry updated at: " + date);
          '

      - name: Commit & Push Telemetry Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --staged --quiet; then
            echo "No telemetry changes detected."
          else
            git commit -m "chore(telemetry): update tactical telemetry & activity stream [skip ci]"
            git push
          fi
