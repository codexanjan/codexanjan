<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="langBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0D" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <radialGradient id="ringAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3038" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#050608" stop-opacity="0" />
    </radialGradient>
    <filter id="lGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes orbitClockwise {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes orbitCounterClockwise {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      .ring-out {
        transform-origin: 400px 195px;
        animation: orbitClockwise 36s linear infinite;
      }
      .ring-mid {
        transform-origin: 400px 195px;
        animation: orbitCounterClockwise 24s linear infinite;
      }
      .ring-in {
        transform-origin: 400px 195px;
        animation: orbitClockwise 16s linear infinite;
      }
    </style>
  </defs>

  <rect width="800" height="380" rx="10" fill="url(#langBg)" stroke="#171B21" stroke-width="1.5" />
  <polygon points="12,12 28,12 12,28" fill="#FF3038" />
  <polygon points="788,368 772,368 788,352" fill="#FF3038" />

  <g transform="translate(35, 36)" font-family="'Courier New', Consolas, monospace">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#FF3038" letter-spacing="3">LANGUAGE CORE // ORBITAL MATRIX</text>
    <text x="540" y="0" font-size="10" fill="#787F89" letter-spacing="1">ORBITAL HARMONICS // LIVE</text>
    <line x1="0" y1="12" x2="730" y2="12" stroke="#171B21" stroke-width="1" />
  </g>

  <!-- Orbital Rings & Satellites (Center: 400, 195) -->
  <circle cx="400" cy="195" r="150" fill="url(#ringAura)" />

  <!-- Outer Ring (r=135) -->
  <circle cx="400" cy="195" r="135" fill="none" stroke="#222832" stroke-width="1.5" stroke-dasharray="8 6" />
  <!-- Mid Ring (r=95) -->
  <circle cx="400" cy="195" r="95" fill="none" stroke="#171B21" stroke-width="1.2" stroke-dasharray="6 4" />
  <!-- Inner Ring (r=60) -->
  <circle cx="400" cy="195" r="60" fill="none" stroke="#262D38" stroke-width="1" />

  <!-- Outer Orbital Layer (TypeScript & C++) -->
  <g class="ring-out">
    <!-- TypeScript Satellite -->
    <g transform="translate(400, 60)">
      <circle cx="0" cy="0" r="18" fill="#141822" stroke="#55E6FF" stroke-width="1.5" filter="url(#lGlow)" />
      <text x="0" y="4" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="10" font-weight="800" fill="#55E6FF">TS</text>
      <text x="0" y="-22" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="8" font-weight="700" fill="#F4F4F2">40%</text>
    </g>
    <!-- C++ Satellite -->
    <g transform="translate(400, 330)">
      <circle cx="0" cy="0" r="14" fill="#141822" stroke="#A8ADB7" stroke-width="1.2" />
      <text x="0" y="4" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="9" font-weight="800" fill="#A8ADB7">C++</text>
      <text x="0" y="24" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="8" fill="#787F89">10%</text>
    </g>
  </g>

  <!-- Mid Orbital Layer (Python & JavaScript) -->
  <g class="ring-mid">
    <!-- Python Satellite -->
    <g transform="translate(495, 195)">
      <circle cx="0" cy="0" r="16" fill="#141822" stroke="#55E6FF" stroke-width="1.5" filter="url(#lGlow)" />
      <text x="0" y="4" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="10" font-weight="800" fill="#55E6FF">PY</text>
      <text x="32" y="4" text-anchor="start" font-family="'Courier New', Consolas, monospace" font-size="8" font-weight="700" fill="#F4F4F2">28%</text>
    </g>
    <!-- JavaScript Satellite -->
    <g transform="translate(305, 195)">
      <circle cx="0" cy="0" r="15" fill="#141822" stroke="#F4C95D" stroke-width="1.2" />
      <text x="0" y="4" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="10" font-weight="800" fill="#F4C95D">JS</text>
      <text x="-32" y="4" text-anchor="end" font-family="'Courier New', Consolas, monospace" font-size="8" font-weight="700" fill="#F4F4F2">14%</text>
    </g>
  </g>

  <!-- Inner Orbital Layer (Java & Bash) -->
  <g class="ring-in">
    <!-- Java Satellite -->
    <g transform="translate(400, 135)">
      <circle cx="0" cy="0" r="12" fill="#141822" stroke="#FF3038" stroke-width="1.2" />
      <text x="0" y="3" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="8" font-weight="800" fill="#FF3038">JV</text>
    </g>
    <!-- Bash Satellite -->
    <g transform="translate(400, 255)">
      <circle cx="0" cy="0" r="11" fill="#141822" stroke="#FF3038" stroke-width="1.2" />
      <text x="0" y="3" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="8" font-weight="800" fill="#FF3038">SH</text>
    </g>
  </g>

  <!-- Center Ronin Emblem Core -->
  <g transform="translate(400, 195)">
    <circle cx="0" cy="0" r="30" fill="#0E1218" stroke="#FF3038" stroke-width="2" />
    <polygon points="0,-18 16,-8 18,10 0,18 -18,10 -16,-8" fill="none" stroke="#FFF" stroke-width="1.2" />
    <line x1="-12" y1="12" x2="12" y2="-12" stroke="#FF3038" stroke-width="2" />
    <circle cx="0" cy="0" r="3" fill="#55E6FF" />
  </g>
</svg>
