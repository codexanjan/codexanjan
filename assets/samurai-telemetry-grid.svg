<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="tgCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0E" />
      <stop offset="50%" stop-color="#050608" />
      <stop offset="100%" stop-color="#0E1118" />
    </linearGradient>
    <linearGradient id="tgRedGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3038" />
      <stop offset="100%" stop-color="#FF5E65" />
    </linearGradient>
    <linearGradient id="tgLaserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3038" stop-opacity="0" />
      <stop offset="50%" stop-color="#FF3038" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFF" stop-opacity="1" />
    </linearGradient>

    <filter id="tgRedGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes flamePulseFixed {
        0%, 100% { filter: drop-shadow(0 0 3px #FF3038); }
        50% { filter: drop-shadow(0 0 14px #FF3038); }
      }
      @keyframes rankDashSpin {
        0% { stroke-dashoffset: 220; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes ledBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      @keyframes edgeLaserTravel {
        0% { stroke-dashoffset: 1200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes outerLaserTravel {
        0% { stroke-dashoffset: 2700; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes donutPulseGold {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(255,214,0,0.3)); }
        50% { filter: drop-shadow(0 0 9px rgba(255,214,0,0.85)); }
      }
      @keyframes donutPulseCyan {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(85,230,255,0.3)); }
        50% { filter: drop-shadow(0 0 9px rgba(85,230,255,0.85)); }
      }

      .flame-glow-pulse {
        animation: flamePulseFixed 2.6s ease-in-out infinite;
      }
      .rank-ring-dash {
        animation: rankDashSpin 8s linear infinite;
      }
      .telemetry-led {
        animation: ledBlink 1.8s ease-in-out infinite;
      }
      .card-edge-laser {
        stroke-dasharray: 140 1060;
        animation: edgeLaserTravel 4.5s linear infinite;
      }
      .outer-edge-laser {
        stroke-dasharray: 200 2500;
        animation: outerLaserTravel 6s linear infinite;
      }
      .donut-gold {
        animation: donutPulseGold 3.6s ease-in-out infinite;
      }
      .donut-cyan {
        animation: donutPulseCyan 3.6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="900" height="440" rx="8" fill="url(#tgCardBg)" stroke="#171C25" stroke-width="1.5" />
  <!-- Animated Edge Laser on Outer Border -->
  <rect width="900" height="440" rx="8" fill="none" stroke="#FF3038" stroke-width="1.8" class="outer-edge-laser" opacity="0.75" />

  <!-- Corner Brackets -->
  <polygon points="12,12 36,12 12,36" fill="#FF3038" />
  <polygon points="888,12 864,12 888,36" fill="#FF3038" />
  <polygon points="12,428 36,428 12,404" fill="#FF3038" />
  <polygon points="888,428 864,428 888,404" fill="#FF3038" />

  <!-- ======================================================== -->
  <!-- CARD 1: TOP LEFT - RONIN METRICS (STATS & RANK)           -->
  <!-- ======================================================== -->
  <g transform="translate(30, 30)">
    <rect width="405" height="180" rx="6" fill="#0A0D12" stroke="#222834" stroke-width="1" />
    <rect width="405" height="180" rx="6" fill="none" stroke="#FF3038" stroke-width="1.5" class="card-edge-laser" />

    <circle cx="20" cy="22" r="3.5" fill="#42FF9E" class="telemetry-led" />
    <text x="32" y="26" font-family="'Orbitron', sans-serif" font-size="11" font-weight="800" fill="#FF3038" letter-spacing="1">RONIN METRICS</text>

    <!-- Stats List -->
    <g transform="translate(20, 52)" font-family="'Courier New', Consolas, monospace" font-size="11">
      <g transform="translate(0, 0)">
        <text x="0" y="0" fill="#FFD700">★</text>
        <text x="18" y="0" fill="#A8ADB7">Total Stars Earned:</text>
        <text x="210" y="0" font-weight="900" fill="#FFD700">210</text>
      </g>
      <g transform="translate(0, 24)">
        <text x="0" y="0" fill="#55E6FF">⏱</text>
        <text x="18" y="0" fill="#A8ADB7">Total Commits (2026):</text>
        <text x="210" y="0" font-weight="900" fill="#F4F4F2">194</text>
      </g>
      <g transform="translate(0, 48)">
        <text x="0" y="0" fill="#42FF9E">⑂</text>
        <text x="18" y="0" fill="#A8ADB7">Total PRs:</text>
        <text x="210" y="0" font-weight="900" fill="#F4F4F2">0</text>
      </g>
      <g transform="translate(0, 72)">
        <text x="0" y="0" fill="#FF3038">☉</text>
        <text x="18" y="0" fill="#A8ADB7">Total Issues:</text>
        <text x="210" y="0" font-weight="900" fill="#F4F4F2">0</text>
      </g>
      <g transform="translate(0, 96)">
        <text x="0" y="0" fill="#FFB703">▱</text>
        <text x="18" y="0" fill="#A8ADB7">Contributed to (yr):</text>
        <text x="210" y="0" font-weight="900" fill="#F4F4F2">16</text>
      </g>
    </g>

    <!-- Rank Circle Badge S+ (Exact coordinate lock) -->
    <g transform="translate(325, 95)">
      <circle cx="0" cy="0" r="42" fill="#10141D" stroke="#222834" stroke-width="2" />
      <circle cx="0" cy="0" r="36" fill="none" stroke="#FFD700" stroke-width="3.5" stroke-dasharray="190 30" stroke-linecap="round" filter="url(#tgRedGlow)" class="rank-ring-dash" />
      <text x="0" y="8" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="22" font-weight="900" fill="#FFD700">S+</text>
      <text x="0" y="24" text-anchor="middle" font-family="'Courier New', monospace" font-size="8.5" fill="#A8ADB7" letter-spacing="1">RANK</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- CARD 2: TOP RIGHT - STREAK STATS                          -->
  <!-- ======================================================== -->
  <g transform="translate(465, 30)">
    <rect width="405" height="180" rx="6" fill="#0A0D12" stroke="#222834" stroke-width="1" />
    <rect width="405" height="180" rx="6" fill="none" stroke="#FF3038" stroke-width="1.5" class="card-edge-laser" />
    
    <circle cx="20" cy="22" r="3.5" fill="#FF474E" class="telemetry-led" />
    <text x="32" y="26" font-family="'Orbitron', sans-serif" font-size="11" font-weight="800" fill="#FF3038" letter-spacing="1">STREAK TELEMETRY</text>

    <!-- Total Contributions -->
    <g transform="translate(70, 95)" text-anchor="middle">
      <text x="0" y="0" font-family="'Orbitron', sans-serif" font-size="28" font-weight="900" fill="#F4F4F2">185</text>
      <text x="0" y="20" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#A8ADB7">Total Contributions</text>
      <text x="0" y="36" font-family="'Courier New', monospace" font-size="8.5" fill="#6A7280">Apr 20 - Present</text>
    </g>

    <!-- Center Glowing Flame Current Streak (Locked Center at 202, 95) -->
    <g transform="translate(202, 95)" text-anchor="middle">
      <circle cx="0" cy="0" r="42" fill="#121620" stroke="#FF3038" stroke-width="2.5" class="flame-glow-pulse" />
      <path d="M 0 -22 C -6 -12 -12 -6 -12 4 C -12 11 -6 16 0 16 C 6 16 12 11 12 4 C 12 -6 6 -12 0 -22 Z" fill="#FF5722" opacity="0.35" />
      <text x="0" y="6" font-family="'Orbitron', sans-serif" font-size="24" font-weight="900" fill="#FFF">🔥</text>
      <text x="0" y="24" font-family="'Courier New', monospace" font-size="8.5" font-weight="800" fill="#FF3038" letter-spacing="1">CURRENT STREAK</text>
      <text x="0" y="38" font-family="'Courier New', monospace" font-size="8" fill="#42FF9E">ACTIVE</text>
    </g>

    <!-- Longest Streak -->
    <g transform="translate(334, 95)" text-anchor="middle">
      <text x="0" y="0" font-family="'Orbitron', sans-serif" font-size="28" font-weight="900" fill="#F4F4F2">9</text>
      <text x="0" y="20" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#A8ADB7">Longest Streak</text>
      <text x="0" y="36" font-family="'Courier New', monospace" font-size="8.5" fill="#6A7280">Sep 4 - Sep 12</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- CARD 3: BOTTOM LEFT - TOP LANGUAGES (BY REPO)             -->
  <!-- ======================================================== -->
  <g transform="translate(30, 230)">
    <rect width="405" height="180" rx="6" fill="#0A0D12" stroke="#222834" stroke-width="1" />
    <rect width="405" height="180" rx="6" fill="none" stroke="#FFB703" stroke-width="1.5" class="card-edge-laser" />
    
    <circle cx="20" cy="22" r="3.5" fill="#FFB703" class="telemetry-led" />
    <text x="32" y="26" font-family="'Orbitron', sans-serif" font-size="11" font-weight="800" fill="#FF3038" letter-spacing="1">TOP LANGUAGES (BY REPO)</text>

    <!-- Lang Bars -->
    <g transform="translate(20, 52)" font-family="'Courier New', Consolas, monospace" font-size="10.5">
      <!-- TypeScript 55% -->
      <g transform="translate(0, 0)">
        <rect x="0" y="-8" width="8" height="8" rx="1.5" fill="#3178C6" />
        <text x="14" y="0" fill="#C5CAD4">TypeScript</text>
        <rect x="95" y="-7" width="90" height="6" rx="3" fill="#1C222E" />
        <rect x="95" y="-7" width="50" height="6" rx="3" fill="#3178C6" />
        <text x="195" y="0" font-weight="700" fill="#3178C6">55%</text>
      </g>
      <!-- JavaScript 30% -->
      <g transform="translate(0, 24)">
        <rect x="0" y="-8" width="8" height="8" rx="1.5" fill="#FFD600" />
        <text x="14" y="0" fill="#C5CAD4">JavaScript</text>
        <rect x="95" y="-7" width="90" height="6" rx="3" fill="#1C222E" />
        <rect x="95" y="-7" width="27" height="6" rx="3" fill="#FFD600" />
        <text x="195" y="0" font-weight="700" fill="#FFD600">30%</text>
      </g>
      <!-- Python 10% -->
      <g transform="translate(0, 48)">
        <rect x="0" y="-8" width="8" height="8" rx="1.5" fill="#3776AB" />
        <text x="14" y="0" fill="#C5CAD4">Python</text>
        <rect x="95" y="-7" width="90" height="6" rx="3" fill="#1C222E" />
        <rect x="95" y="-7" width="9" height="6" rx="3" fill="#3776AB" />
        <text x="195" y="0" font-weight="700" fill="#3776AB">10%</text>
      </g>
      <!-- HTML / CSS 5% -->
      <g transform="translate(0, 72)">
        <rect x="0" y="-8" width="8" height="8" rx="1.5" fill="#E34F26" />
        <text x="14" y="0" fill="#C5CAD4">HTML / CSS</text>
        <rect x="95" y="-7" width="90" height="6" rx="3" fill="#1C222E" />
        <rect x="95" y="-7" width="5" height="6" rx="3" fill="#E34F26" />
        <text x="195" y="0" font-weight="700" fill="#E34F26">5%</text>
      </g>
    </g>

    <!-- Donut Meter Right -->
    <g transform="translate(325, 100)" class="donut-gold">
      <circle cx="0" cy="0" r="42" fill="none" stroke="#3178C6" stroke-width="12" stroke-dasharray="145 119" />
      <circle cx="0" cy="0" r="42" fill="none" stroke="#FFD600" stroke-width="12" stroke-dasharray="79 185" stroke-dashoffset="-145" />
      <circle cx="0" cy="0" r="42" fill="none" stroke="#3776AB" stroke-width="12" stroke-dasharray="26 238" stroke-dashoffset="-224" />
      <circle cx="0" cy="0" r="42" fill="none" stroke="#E34F26" stroke-width="12" stroke-dasharray="14 250" stroke-dashoffset="-250" />
      <circle cx="0" cy="0" r="28" fill="#0A0D12" />
      <!-- Samurai Crest Symbol in Middle -->
      <polygon points="0,-10 6,-3 0,6 -6,-3" fill="#FF3038" />
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- CARD 4: BOTTOM RIGHT - TOP LANGUAGES (BY COMMIT)          -->
  <!-- ======================================================== -->
  <g transform="translate(465, 230)">
    <rect width="405" height="180" rx="6" fill="#0A0D12" stroke="#222834" stroke-width="1" />
    <rect width="405" height="180" rx="6" fill="none" stroke="#55E6FF" stroke-width="1.5" class="card-edge-laser" />

    <circle cx="20" cy="22" r="3.5" fill="#55E6FF" class="telemetry-led" />
    <text x="32" y="26" font-family="'Orbitron', sans-serif" font-size="11" font-weight="800" fill="#55E6FF" letter-spacing="1">TOP LANGUAGES (BY COMMIT)</text>

    <!-- Lang Bars -->
    <g transform="translate(20, 52)" font-family="'Courier New', Consolas, monospace" font-size="10.5">
      <!-- TypeScript 52% -->
      <g transform="translate(0, 0)">
        <rect x="0" y="-8" width="8" height="8" rx="1.5" fill="#3178C6" />
        <text x="14" y="0" fill="#C5CAD4">TypeScript</text>
        <rect x="95" y="-7" width="90" height="6" rx="3" fill="#1C222E" />
        <rect x="95" y="-7" width="47" height="6" rx="3" fill="#3178C6" />
        <text x="195" y="0" font-weight="700" fill="#3178C6">52%</text>
      </g>
      <!-- JavaScript 28% -->
      <g transform="translate(0, 24)">
        <rect x="0" y="-8" width="8" height="8" rx="1.5" fill="#FFD600" />
        <text x="14" y="0" fill="#C5CAD4">JavaScript</text>
        <rect x="95" y="-7" width="90" height="6" rx="3" fill="#1C222E" />
        <rect x="95" y="-7" width="25" height="6" rx="3" fill="#FFD600" />
        <text x="195" y="0" font-weight="700" fill="#FFD600">28%</text>
      </g>
      <!-- Python 15% -->
      <g transform="translate(0, 48)">
        <rect x="0" y="-8" width="8" height="8" rx="1.5" fill="#3776AB" />
        <text x="14" y="0" fill="#C5CAD4">Python</text>
        <rect x="95" y="-7" width="90" height="6" rx="3" fill="#1C222E" />
        <rect x="95" y="-7" width="14" height="6" rx="3" fill="#3776AB" />
        <text x="195" y="0" font-weight="700" fill="#3776AB">15%</text>
      </g>
      <!-- HTML 5% -->
      <g transform="translate(0, 72)">
        <rect x="0" y="-8" width="8" height="8" rx="1.5" fill="#E34F26" />
        <text x="14" y="0" fill="#C5CAD4">HTML</text>
        <rect x="95" y="-7" width="90" height="6" rx="3" fill="#1C222E" />
        <rect x="95" y="-7" width="5" height="6" rx="3" fill="#E34F26" />
        <text x="195" y="0" font-weight="700" fill="#E34F26">5%</text>
      </g>
    </g>

    <!-- Donut Meter Right -->
    <g transform="translate(325, 100)" class="donut-cyan">
      <circle cx="0" cy="0" r="42" fill="none" stroke="#3178C6" stroke-width="12" stroke-dasharray="137 127" />
      <circle cx="0" cy="0" r="42" fill="none" stroke="#FFD600" stroke-width="12" stroke-dasharray="74 190" stroke-dashoffset="-137" />
      <circle cx="0" cy="0" r="42" fill="none" stroke="#3776AB" stroke-width="12" stroke-dasharray="40 224" stroke-dashoffset="-211" />
      <circle cx="0" cy="0" r="42" fill="none" stroke="#E34F26" stroke-width="12" stroke-dasharray="13 251" stroke-dashoffset="-251" />
      <circle cx="0" cy="0" r="28" fill="#0A0D12" />
      <polygon points="0,-10 6,-3 0,6 -6,-3" fill="#55E6FF" />
    </g>
  </g>
</svg>
