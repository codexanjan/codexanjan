<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="100%" height="190" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes pulseGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
