        <line x1="-60" y1="0" x2="60" y2="0" stroke="rgba(0, 245, 255, 0.08)" stroke-width="1"/>
        <line x1="0" y1="-60" x2="0" y2="60" stroke="rgba(0, 245, 255, 0.08)" stroke-width="1"/>
        <circle cx="28" cy="-22" r="3" fill="#39FF88"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" repeatCount="indefinite"/></circle>
        <text x="35" y="-18" fill="#39FF88" font-size="8" font-weight="700">NODE</text>
