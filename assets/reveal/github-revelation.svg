        <g transform="translate(25, 28)">
          <text x="0" y="0" fill="#7894A6" font-size="10">QUERY TARGET:</text><text x="140" y="0" fill="#00F5FF" font-size="12" font-weight="700">github://codexanjan</text>
          <text x="0" y="24" fill="#7894A6" font-size="10">NODE IDENTITY:</text><text x="140" y="24" fill="#EAFBFF" font-size="12" font-weight="700">ANJAN SHETTY</text>
          <text x="0" y="48" fill="#7894A6" font-size="10">SYSTEM CLASS:</text><text x="140" y="48" fill="#39FF88" font-size="12" font-weight="700">DEVELOPER // FULL-STACK &amp; AI-ML</text>
          <text x="0" y="72" fill="#7894A6" font-size="10">NETWORK STATUS:</text><text x="140" y="72" fill="#39FF88" font-size="12" font-weight="700">CONNECTED ● [PROFILE REVELATION COMPLETE]</text>
        </g>
        
    <path d="M 4 14 L 4 4 L 14 4" fill="none" stroke="#00F5FF" stroke-width="1" />
