<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" height="200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes pulseGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
      @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes waveScroll { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
      @keyframes lineFade { 0%, 20% { opacity: 0; } 35%, 100% { opacity: 1; } }
      text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace; -webkit-font-smoothing: antialiased; }
      
    </style>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 245, 255, 0.08)" stroke-width="0.8"/>
      <circle cx="30" cy="0" r="0.8" fill="#00F5FF" opacity="0.3"/>
    </pattern>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>
    <linearGradient id="hud-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0.9"/>
    </linearGradient>
    
  </defs>
  <rect width="1200" height="200" fill="#04070D" />
  <rect width="1200" height="200" fill="url(#grid-pattern)" />
  
      <rect x="0" y="0" width="1200" height="200" fill="#060A13" />
      <text x="40" y="32" fill="#00F5FF" font-size="11" font-weight="700" letter-spacing="2">NEURAL_DECRYPTION_PROTOCOL // IDENTITY_HASH_SOLVER</text>
      <line x1="40" y1="42" x2="1160" y2="42" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1" />
      <g transform="translate(40, 60)">
        <rect x="0" y="0" width="160" height="34" fill="#080D18" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1" />
        <text x="10" y="16" fill="#7894A6" font-size="8">IDENTITY_HASH</text><text x="10" y="28" fill="#00F5FF" font-size="9" font-weight="700">0x7F_CODEX_A01</text>
        <rect x="180" y="0" width="160" height="34" fill="#080D18" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1" />
        <text x="10" y="16" fill="#7894A6" font-size="8">CLEARANCE_LEVEL</text><text x="10" y="28" fill="#39FF88" font-size="9" font-weight="700">LVL_9: ROOT_DEV</text>
        <rect x="360" y="0" width="160" height="34" fill="#080D18" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1" />
        <text x="10" y="16" fill="#7894A6" font-size="8">NODE_SCAN</text><text x="10" y="28" fill="#00F5FF" font-size="9" font-weight="700">TARGET: ACQUIRED</text>
        <rect x="540" y="0" width="160" height="34" fill="#080D18" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1" />
        <text x="10" y="16" fill="#7894A6" font-size="8">MATCH_SCORE</text><text x="10" y="28" fill="#39FF88" font-size="9" font-weight="700">99.98% VERIFIED</text>
      </g>
      <g transform="translate(600, 150)" text-anchor="middle">
        <text x="0" y="0" fill="#EAFBFF" font-size="28" font-weight="900" letter-spacing="10" filter="url(#glow-cyan)">
          ANJAN SHETTY // IDENTITY REVEALED
        </text>
      </g>
      
    <path d="M 10 22 L 10 10 L 22 10" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 1178 10 L 1190 10 L 1190 22" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 10 178 L 10 190 L 22 190" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 1178 190 L 1190 190 L 1190 178" fill="none" stroke="#00F5FF" stroke-width="1" />
  
    
</svg>
