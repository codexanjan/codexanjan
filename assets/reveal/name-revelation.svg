<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="400" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes pulseGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
      @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes waveScroll { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
      @keyframes lineFade { 0%, 20% { opacity: 0; } 35%, 100% { opacity: 1; } }
      text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace; -webkit-font-smoothing: antialiased; }
      
      @keyframes drawFrame { 0% { stroke-dashoffset: 2500; } 100% { stroke-dashoffset: 0; } }
      @keyframes scanHorizontal { 0% { transform: translateX(-1200px); } 100% { transform: translateX(1200px); } }
    
    </style>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 245, 255, 0.08)" stroke-width="0.8"/>
      <circle cx="30" cy="0" r="0.8" fill="#00F5FF" opacity="0.3"/>
    </pattern>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>
    <linearGradient id="hud-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0.9"/>
    </linearGradient>
    
  </defs>
  <rect width="1200" height="400" fill="#04070D" />
  <rect width="1200" height="400" fill="url(#grid-pattern)" />
  
      <polygon points="40,20 1160,20 1180,40 1180,360 1160,380 40,380 20,360 20,40"
               fill="#080D18" stroke="#00F5FF" stroke-width="1.8" stroke-dasharray="2500"
               style="animation: drawFrame 3s ease-out forwards;" />
      <line x1="0" y1="200" x2="1200" y2="200" stroke="#00F5FF" stroke-width="1.2" opacity="0.3"
            style="animation: scanHorizontal 6s ease-in-out infinite;" />
      <text x="60" y="55" fill="#7894A6" font-size="10" font-weight="700" letter-spacing="2">MODULE://SIGNATURE_IDENTITY_LOCK</text>
      <text x="600" y="55" fill="#00F5FF" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="3">CODEX://ANJAN // REVELATION MATRIX</text>
      <text x="1140" y="55" fill="#39FF88" font-size="10" font-weight="700" text-anchor="end" letter-spacing="2">IDENTITY://VERIFIED ●</text>
      <line x1="60" y1="65" x2="1140" y2="65" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1" />

      <g transform="translate(600, 185)" text-anchor="middle">
        <text x="0" y="0" fill="#00F5FF" font-size="64" font-weight="900" letter-spacing="14" filter="url(#glow-cyan)" opacity="0.8">ANJAN SHETTY</text>
        <text x="0" y="0" fill="#FFFFFF" font-size="64" font-weight="900" letter-spacing="14">ANJAN SHETTY</text>
      </g>

      <g transform="translate(600, 245)" text-anchor="middle">
        <rect x="-320" y="-22" width="640" height="34" fill="#020408" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1" rx="2" />
        <text x="0" y="0" fill="#00F5FF" font-size="14" font-weight="800" letter-spacing="4">
          FULL-STACK DEVELOPER <tspan fill="#FF2BD6">//</tspan> AI-ML ENGINEER
        </text>
      </g>

      <g transform="translate(600, 295)" text-anchor="middle">
        <text x="0" y="0" fill="#7894A6" font-size="13" font-weight="600" letter-spacing="3">
          GITHUB NODE: <tspan fill="#39FF88" font-weight="800">@CODEXANJAN</tspan>
        </text>
      </g>

      <g transform="translate(600, 345)" text-anchor="middle">
        <rect x="-180" y="-18" width="360" height="28" fill="#060A13" stroke="#39FF88" stroke-width="1.2" rx="3" />
        <circle cx="-150" cy="-4" r="4" fill="#39FF88"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/></circle>
        <text x="0" y="0" fill="#EAFBFF" font-size="11" font-weight="700" letter-spacing="3">SECURE IDENTITY LOCK: COMPLETE</text>
      </g>
      
    <path d="M 45 41 L 45 25 L 61 25" fill="none" stroke="#00F5FF" stroke-width="1.5" />
    <path d="M 1139 25 L 1155 25 L 1155 41" fill="none" stroke="#00F5FF" stroke-width="1.5" />
    <path d="M 45 359 L 45 375 L 61 375" fill="none" stroke="#00F5FF" stroke-width="1.5" />
    <path d="M 1139 375 L 1155 375 L 1155 359" fill="none" stroke="#00F5FF" stroke-width="1.5" />
  
    
</svg>
