<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" width="100%" height="100%">
  <defs>
    <linearGradient id="pg-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1B2D"/>
      <stop offset="30%" stop-color="#E62429"/>
      <stop offset="50%" stop-color="#F5F7FA"/>
      <stop offset="70%" stop-color="#00A8FF"/>
      <stop offset="100%" stop-color="#21D4FD"/>
    </linearGradient>

    <pattern id="pg-mesh" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#8B93A7" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <filter id="pg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pulse-dot {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 6px #21D4FD); }
      }
      .pg-node { transform-origin: center; animation: pulse-dot 3s ease-in-out infinite; }
      .pg-mono { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, 'Fira Code', monospace; }
    </style>
  </defs>

  <!-- Background Base & Grid -->
  <rect width="1200" height="90" fill="#020204" rx="4"/>
  <rect width="1200" height="90" fill="url(#pg-mesh)"/>

  <!-- Main Horizontal Continuous Web Spine -->
  <line x1="40" y1="45" x2="1160" y2="45" stroke="url(#pg-grad)" stroke-width="2" filter="url(#pg-glow)"/>

  <!-- Secondary Parallel Guidance Rails -->
  <line x1="60" y1="25" x2="1140" y2="25" stroke="#8B93A7" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="8 6"/>
  <line x1="60" y1="65" x2="1140" y2="65" stroke="#8B93A7" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="8 6"/>

  <!-- Subtle Spider-Leg Angular Brackets Connecting Spine to Rails -->
  <!-- Node Group 1 (Hero - About Me) -->
  <path d="M 160 25 L 180 45 L 200 65" fill="none" stroke="#FF1B2D" stroke-width="1.5"/>
  <path d="M 200 25 L 180 45 L 160 65" fill="none" stroke="#FF1B2D" stroke-width="1.5"/>
  <circle cx="180" cy="45" r="4.5" fill="#FF1B2D" class="pg-node"/>
  <text x="180" y="80" text-anchor="middle" fill="#8B93A7" font-size="8" class="pg-mono">CORE_HERO</text>

  <!-- Node Group 2 (Spider Network) -->
  <path d="M 380 25 L 400 45 L 420 65" fill="none" stroke="#FF1B2D" stroke-width="1.5"/>
  <path d="M 420 25 L 400 45 L 380 65" fill="none" stroke="#FF1B2D" stroke-width="1.5"/>
  <circle cx="400" cy="45" r="4.5" fill="#FF1B2D" class="pg-node"/>
  <text x="400" y="80" text-anchor="middle" fill="#8B93A7" font-size="8" class="pg-mono">NETWORK</text>

  <!-- Central Nexus (Tech Arsenal / Missions) -->
  <g transform="translate(600, 45)">
    <!-- Octagonal Central Router -->
    <polygon points="0,-16 12,-12 16,0 12,12 0,16 -12,12 -16,0 -12,-12" fill="#09090F" stroke="#F5F7FA" stroke-width="1.8" filter="url(#pg-glow)"/>
    <circle cx="0" cy="0" r="4" fill="#21D4FD"/>
    <text x="0" y="35" text-anchor="middle" fill="#21D4FD" font-size="8.5" font-weight="700" class="pg-mono">NEXUS // CODEX</text>
  </g>

  <!-- Node Group 4 (Achievements & Credentials) -->
  <path d="M 780 25 L 800 45 L 820 65" fill="none" stroke="#00A8FF" stroke-width="1.5"/>
  <path d="M 820 25 L 800 45 L 780 65" fill="none" stroke="#00A8FF" stroke-width="1.5"/>
  <circle cx="800" cy="45" r="4.5" fill="#00A8FF" class="pg-node"/>
  <text x="800" y="80" text-anchor="middle" fill="#8B93A7" font-size="8" class="pg-mono">ARCHIVES</text>

  <!-- Node Group 5 (Command Center & Signals) -->
  <path d="M 980 25 L 1000 45 L 1020 65" fill="none" stroke="#21D4FD" stroke-width="1.5"/>
  <path d="M 1020 25 L 1000 45 L 980 65" fill="none" stroke="#21D4FD" stroke-width="1.5"/>
  <circle cx="1000" cy="45" r="4.5" fill="#21D4FD" class="pg-node"/>
  <text x="1000" y="80" text-anchor="middle" fill="#8B93A7" font-size="8" class="pg-mono">TELEMETRY</text>

  <!-- Terminal Endpoints -->
  <circle cx="40" cy="45" r="3" fill="#FF1B2D"/>
  <circle cx="1160" cy="45" r="3" fill="#21D4FD"/>
</svg>
