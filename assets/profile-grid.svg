<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="100%" height="100%">
  <defs>
    <linearGradient id="pg-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1B2D"/>
      <stop offset="30%" stop-color="#E62429"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#00A8FF"/>
      <stop offset="100%" stop-color="#21D4FD"/>
    </linearGradient>

    <pattern id="pg-mesh" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#8B93A7" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <filter id="pg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pulse-node {
        0%, 100% { transform: scale(1); opacity: 0.8; filter: drop-shadow(0 0 3px #FF1B2D); }
        50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 10px #21D4FD) drop-shadow(0 0 6px #FF1B2D); }
      }
      @keyframes data-flow-right {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes data-flow-left {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 240; }
      }
      @keyframes packet-move-1 {
        0% { transform: translateX(40px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(1160px); opacity: 0; }
      }
      @keyframes packet-move-2 {
        0% { transform: translateX(1160px); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(40px); opacity: 0; }
      }
      .pg-node { transform-origin: center; animation: pulse-node 2.5s ease-in-out infinite; }
      .pg-beam-r { stroke-dasharray: 20 40; animation: data-flow-right 3s linear infinite; }
      .pg-beam-l { stroke-dasharray: 20 40; animation: data-flow-left 3s linear infinite; }
      .pg-packet-1 { animation: packet-move-1 5s linear infinite; }
      .pg-packet-2 { animation: packet-move-2 6s linear infinite; }
      .pg-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 900; }
      .pg-mono { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
    </style>
  </defs>

  <!-- Background Base & Grid -->
  <rect width="1200" height="110" fill="#050509" rx="6" stroke="#8B93A7" stroke-opacity="0.2" stroke-width="1"/>
  <rect width="1200" height="110" fill="url(#pg-mesh)"/>

  <!-- Secondary Parallel Guidance Rails with Animated Flow -->
  <line x1="60" y1="26" x2="1140" y2="26" stroke="#8B93A7" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="8 6"/>
  <line x1="60" y1="26" x2="1140" y2="26" stroke="#00A8FF" stroke-width="1.5" class="pg-beam-r" opacity="0.6"/>
  <line x1="60" y1="74" x2="1140" y2="74" stroke="#8B93A7" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="8 6"/>
  <line x1="60" y1="74" x2="1140" y2="74" stroke="#FF1B2D" stroke-width="1.5" class="pg-beam-l" opacity="0.6"/>

  <!-- Main Horizontal Continuous Web Spine -->
  <line x1="40" y1="50" x2="1160" y2="50" stroke="url(#pg-grad)" stroke-width="2.5" filter="url(#pg-glow)"/>

  <!-- Animated Flying Data Packets -->
  <circle cx="0" cy="50" r="3" fill="#FFFFFF" class="pg-packet-1" filter="url(#pg-glow)"/>
  <circle cx="0" cy="50" r="2.5" fill="#00E5FF" class="pg-packet-2" filter="url(#pg-glow)"/>

  <!-- Node Group 1 (Hero - About Me) -->
  <g transform="translate(180, 50)">
    <path d="M -20 -24 L 0 0 L 20 24" fill="none" stroke="#FF1B2D" stroke-width="1.8"/>
    <path d="M 20 -24 L 0 0 L -20 24" fill="none" stroke="#FF1B2D" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="5" fill="#FF1B2D" class="pg-node"/>
    <rect x="-75" y="32" width="150" height="22" rx="3" fill="#09090F" stroke="#FF1B2D" stroke-width="1"/>
    <text x="0" y="47" text-anchor="middle" fill="#FFFFFF" font-size="11.5" class="pg-mono" letter-spacing="1.5">EARTH-CODEX-01</text>
  </g>

  <!-- Node Group 2 (Spider Network) -->
  <g transform="translate(400, 50)">
    <path d="M -20 -24 L 0 0 L 20 24" fill="none" stroke="#FF1B2D" stroke-width="1.8"/>
    <path d="M 20 -24 L 0 0 L -20 24" fill="none" stroke="#FF1B2D" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="5" fill="#FF1B2D" class="pg-node"/>
    <rect x="-70" y="32" width="140" height="22" rx="3" fill="#09090F" stroke="#FF1B2D" stroke-width="1"/>
    <text x="0" y="47" text-anchor="middle" fill="#FFFFFF" font-size="11.5" class="pg-mono" letter-spacing="1.5">SPIDER-NET</text>
  </g>

  <!-- Central Nexus (Tech Arsenal / Missions) -->
  <g transform="translate(600, 50)">
    <polygon points="0,-18 14,-14 18,0 14,14 0,18 -14,14 -18,0 -14,-14" fill="#09090F" stroke="#FFFFFF" stroke-width="2" filter="url(#pg-glow)"/>
    <circle cx="0" cy="0" r="5" fill="#00E5FF" class="pg-node"/>
    <rect x="-105" y="30" width="210" height="25" rx="4" fill="#09090F" stroke="#00E5FF" stroke-width="1.4"/>
    <text x="0" y="47" text-anchor="middle" fill="#00E5FF" font-size="12.5" class="pg-title" letter-spacing="2">SPIDER-VERSE // NEXUS</text>
  </g>

  <!-- Node Group 4 (Achievements & Credentials) -->
  <g transform="translate(800, 50)">
    <path d="M -20 -24 L 0 0 L 20 24" fill="none" stroke="#00A8FF" stroke-width="1.8"/>
    <path d="M 20 -24 L 0 0 L -20 24" fill="none" stroke="#00A8FF" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="5" fill="#00A8FF" class="pg-node"/>
    <rect x="-75" y="32" width="150" height="22" rx="3" fill="#09090F" stroke="#00A8FF" stroke-width="1"/>
    <text x="0" y="47" text-anchor="middle" fill="#FFFFFF" font-size="11.5" class="pg-mono" letter-spacing="1.5">CANON ARCHIVES</text>
  </g>

  <!-- Node Group 5 (Command Center & Signals) -->
  <g transform="translate(1000, 50)">
    <path d="M -20 -24 L 0 0 L 20 24" fill="none" stroke="#21D4FD" stroke-width="1.8"/>
    <path d="M 20 -24 L 0 0 L -20 24" fill="none" stroke="#21D4FD" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="5" fill="#21D4FD" class="pg-node"/>
    <rect x="-75" y="32" width="150" height="22" rx="3" fill="#09090F" stroke="#21D4FD" stroke-width="1"/>
    <text x="0" y="47" text-anchor="middle" fill="#FFFFFF" font-size="11.5" class="pg-mono" letter-spacing="1.5">RADAR TELEMETRY</text>
  </g>

  <!-- Terminal Endpoints -->
  <circle cx="40" cy="50" r="4" fill="#FF1B2D" class="pg-node"/>
  <circle cx="1160" cy="50" r="4" fill="#21D4FD" class="pg-node"/>
</svg>
