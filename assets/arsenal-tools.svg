<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 32" fill="none">
  <defs>
    <linearGradient id="pillGradRedTl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3038" />
      <stop offset="100%" stop-color="#FF474E" />
    </linearGradient>
  </defs>

  <g font-family="system-ui, -apple-system, 'SF Mono', 'Courier New', monospace" font-size="11" font-weight="900" letter-spacing="0.8">
    <!-- 01: GIT -->
    <g transform="translate(0, 1)">
      <rect x="0" y="0" width="30" height="30" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <!-- Git Branching Diamond -->
      <g transform="translate(6, 6) scale(0.72)">
        <polygon points="12,1 23,12 12,23 1,12" fill="#F05032"/>
        <circle cx="9" cy="9" r="2" fill="#FFF"/>
        <circle cx="15" cy="15" r="2" fill="#FFF"/>
        <circle cx="9" cy="15" r="2" fill="#FFF"/>
        <line x1="9" y1="9" x2="9" y2="15" stroke="#FFF" stroke-width="1.6"/>
        <path d="M9 12C11 12 15 12 15 15" stroke="#FFF" stroke-width="1.6" fill="none"/>
      </g>
      <rect x="33" y="0" width="50" height="30" rx="3" fill="url(#pillGradRedTl)" />
      <text x="58" y="19" text-anchor="middle" fill="#050608">GIT</text>
    </g>

    <!-- 02: GITHUB -->
    <g transform="translate(97, 1)">
      <rect x="0" y="0" width="30" height="30" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <!-- GitHub Octocat -->
      <g transform="translate(7, 7) scale(0.68)">
        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" fill="#FFF"/>
      </g>
      <rect x="33" y="0" width="76" height="30" rx="3" fill="url(#pillGradRedTl)" />
      <text x="71" y="19" text-anchor="middle" fill="#050608">GITHUB</text>
    </g>

    <!-- 03: LINUX -->
    <g transform="translate(220, 1)">
      <rect x="0" y="0" width="30" height="30" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <!-- Linux Tux Penguin -->
      <g transform="translate(7, 6) scale(0.68)">
        <!-- Body -->
        <ellipse cx="12" cy="14" rx="7" ry="9" fill="#000" stroke="#444" stroke-width="0.8"/>
        <!-- Belly -->
        <ellipse cx="12" cy="15" rx="5" ry="6.5" fill="#FFF"/>
        <!-- Head -->
        <circle cx="12" cy="6" r="4.5" fill="#000"/>
        <!-- Eyes -->
        <circle cx="10" cy="5.5" r="1.2" fill="#FFF"/>
        <circle cx="10" cy="5.5" r="0.6" fill="#000"/>
        <circle cx="14" cy="5.5" r="1.2" fill="#FFF"/>
        <circle cx="14" cy="5.5" r="0.6" fill="#000"/>
        <!-- Beak -->
        <polygon points="10,7 14,7 12,9.5" fill="#FFA500"/>
        <!-- Feet -->
        <ellipse cx="9" cy="22" rx="3.5" ry="1.2" fill="#FFA500"/>
        <ellipse cx="15" cy="22" rx="3.5" ry="1.2" fill="#FFA500"/>
      </g>
      <rect x="33" y="0" width="66" height="30" rx="3" fill="url(#pillGradRedTl)" />
      <text x="66" y="19" text-anchor="middle" fill="#050608">LINUX</text>
    </g>

    <!-- 04: POSTMAN -->
    <g transform="translate(333, 1)">
      <rect x="0" y="0" width="30" height="30" rx="3" fill="#0C0E14" stroke="#222834" stroke-width="1" />
      <!-- Postman Runner -->
      <g transform="translate(7, 6) scale(0.68)">
        <circle cx="12" cy="12" r="10" fill="#FF6C37"/>
        <polygon points="12,5 18,17 12,14 6,17" fill="#FFF"/>
      </g>
      <rect x="33" y="0" width="86" height="30" rx="3" fill="url(#pillGradRedTl)" />
      <text x="76" y="19" text-anchor="middle" fill="#050608">POSTMAN</text>
    </g>
  </g>
</svg>
