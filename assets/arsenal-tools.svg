<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 190" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="arsBg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090C10" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <style>
      @keyframes arsSweep6 {
        0% { transform: translateX(-200px); }
        100% { transform: translateX(850px); }
      }
      .ars-scanner6 { animation: arsSweep6 4s linear infinite; }
    </style>
  </defs>

  <rect width="800" height="190" rx="8" fill="url(#arsBg6)" stroke="#171B21" stroke-width="1.5" />
  <polygon points="8,8 24,8 8,24" fill="#FF3038" />
  <polygon points="792,182 776,182 792,166" fill="#FF3038" />

  <g clip-path="url(#arsClip6)">
    <clipPath id="arsClip6">
      <rect x="2" y="2" width="796" height="186" rx="6" />
    </clipPath>
    <line x1="0" y1="0" x2="0" y2="190" stroke="#FF3038" stroke-width="1.5" opacity="0.6" class="ars-scanner6" />
  </g>

  <g transform="translate(30, 32)" font-family="'Courier New', Consolas, monospace">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#FF3038" letter-spacing="3">WEAPON RACK 06 // WORKBENCH &amp; UTILITIES</text>
    <text x="560" y="0" font-size="10" fill="#787F89" letter-spacing="1">TACTICAL GEAR</text>
    <line x1="0" y1="12" x2="740" y2="12" stroke="#171B21" stroke-width="1" />
  </g>

  <!-- 3 Tools Items: GitHub, Postman, VS Code -->
  <g transform="translate(30, 70)" font-family="'Courier New', Consolas, monospace">
    <!-- GitHub -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="235" height="85" rx="5" fill="#10141C" stroke="#171B21" stroke-width="1.2" />
      <polygon points="0,0 12,0 0,12" fill="#F4F4F2" />
      <text x="117" y="32" text-anchor="middle" font-size="18" font-weight="900" fill="#F4F4F2">GITHUB</text>
      <text x="117" y="55" text-anchor="middle" font-size="11" font-weight="700" fill="#A8ADB7">COLLABORATION // VCS</text>
      <text x="117" y="72" text-anchor="middle" font-size="9" fill="#787F89">CODE REPOSITORIES</text>
    </g>

    <!-- Postman -->
    <g transform="translate(252, 0)">
      <rect x="0" y="0" width="235" height="85" rx="5" fill="#10141C" stroke="#FF3038" stroke-width="1.2" />
      <polygon points="0,0 12,0 0,12" fill="#FF3038" />
      <text x="117" y="32" text-anchor="middle" font-size="18" font-weight="900" fill="#FF3038">POSTMAN</text>
      <text x="117" y="55" text-anchor="middle" font-size="11" font-weight="700" fill="#F4F4F2">API TESTING &amp; DESIGN</text>
      <text x="117" y="72" text-anchor="middle" font-size="9" fill="#FF4B4B">PAYLOAD SIMULATION</text>
    </g>

    <!-- VS Code -->
    <g transform="translate(504, 0)">
      <rect x="0" y="0" width="236" height="85" rx="5" fill="#10141C" stroke="#55E6FF" stroke-width="1.2" />
      <polygon points="0,0 12,0 0,12" fill="#55E6FF" />
      <text x="118" y="32" text-anchor="middle" font-size="18" font-weight="900" fill="#55E6FF">VS CODE</text>
      <text x="118" y="55" text-anchor="middle" font-size="11" font-weight="700" fill="#F4F4F2">DEVELOPMENT CORE</text>
      <text x="118" y="72" text-anchor="middle" font-size="9" fill="#55E6FF">OPTIMIZED ENVIRONMENT</text>
    </g>
  </g>
</svg>
