        <text x="60" y="24" fill="#00F5FF" font-size="10" font-weight="800">MISSION 001</text><text x="180" y="24" fill="#EAFBFF" font-size="12" font-weight="800">FULL-STACK SUITE DEPLOYMENT</text><text x="60" y="44" fill="#7894A6" font-size="9.5">Engineered &amp; shipped 18 public codebases spanning modern web and algorithms.</text>
