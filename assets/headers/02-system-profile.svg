<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="100%" height="110" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes pulseGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
      @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes waveScroll { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
      @keyframes lineFade { 0%, 20% { opacity: 0; } 35%, 100% { opacity: 1; } }
      text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace; -webkit-font-smoothing: antialiased; }
      
    </style>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 245, 255, 0.08)" stroke-width="0.8"/>
      <circle cx="30" cy="0" r="0.8" fill="#00F5FF" opacity="0.3"/>
    </pattern>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>
    <linearGradient id="hud-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0.9"/>
    </linearGradient>
    
  </defs>
  <rect width="1200" height="110" fill="#04070D" />
  <rect width="1200" height="110" fill="url(#grid-pattern)" />
  
        <text x="35" y="24" fill="#7894A6" font-size="9" letter-spacing="2">SYS.MOD.02 // CODEX://ANJAN // CORE_PIPELINE</text>
        <g transform="translate(30, 32)">
          <polygon points="10,0 1140,0 1140,48 1130,58 0,58 0,10" fill="#080D18" stroke="#3A86FF" stroke-width="1.2" />
          <rect x="0" y="0" width="60" height="58" fill="#020408" />
          <text x="30" y="38" fill="#3A86FF" font-size="20" font-weight="900" text-anchor="middle">02</text>
          <line x1="60" y1="0" x2="60" y2="58" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1" />
          <text x="80" y="38" fill="#EAFBFF" font-size="20" font-weight="900" letter-spacing="4">// SYSTEM_PROFILE</text>
          <g transform="translate(1120, 34)" text-anchor="end">
            <text x="-20" y="0" fill="#7894A6" font-size="9" letter-spacing="1">MODULE STATUS:</text>
            <text x="0" y="0" fill="#3A86FF" font-size="11" font-weight="800" letter-spacing="1.5">ONLINE</text>
            <circle cx="10" cy="-4" r="3.5" fill="#3A86FF"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/></circle>
          </g>
        </g>
        <line x1="30" y1="96" x2="1170" y2="96" stroke="rgba(0, 245, 255, 0.08)" stroke-width="1" />
        
    <path d="M 15 20 L 15 12 L 23 12" fill="none" stroke="#3A86FF" stroke-width="1" />
    <path d="M 1177 12 L 1185 12 L 1185 20" fill="none" stroke="#3A86FF" stroke-width="1" />
    <path d="M 15 92 L 15 100 L 23 100" fill="none" stroke="#3A86FF" stroke-width="1" />
    <path d="M 1177 100 L 1185 100 L 1185 92" fill="none" stroke="#3A86FF" stroke-width="1" />
  
      
</svg>
