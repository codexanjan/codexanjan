<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="120" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes pulseGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
      @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes waveScroll { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
      @keyframes lineFade { 0%, 20% { opacity: 0; } 35%, 100% { opacity: 1; } }
      text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace; -webkit-font-smoothing: antialiased; }
      
    </style>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 245, 255, 0.08)" stroke-width="0.8"/>
      <circle cx="30" cy="0" r="0.8" fill="#00F5FF" opacity="0.3"/>
    </pattern>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>
    <linearGradient id="hud-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0.9"/>
    </linearGradient>
    
  </defs>
  <rect width="500" height="120" fill="#04070D" />
  <rect width="500" height="120" fill="url(#grid-pattern)" />
  
      <rect width="500" height="120" fill="#04070D" />
      <g transform="translate(250, 45)" text-anchor="middle">
        <text x="0" y="0" fill="#00F5FF" font-size="18" font-weight="900" letter-spacing="4">CODEX://ANJAN</text>
        <text x="0" y="24" fill="#EAFBFF" font-size="14" font-weight="700" letter-spacing="2">ANJAN SHETTY</text>
        <text x="0" y="44" fill="#7894A6" font-size="9" letter-spacing="1.5">BUILDING INTELLIGENT DIGITAL SYSTEMS</text>
      </g>
      <line x1="80" y1="100" x2="420" y2="100" stroke="#00F5FF" stroke-width="1.2" />
      
    <path d="M 6 14 L 6 6 L 14 6" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 486 6 L 494 6 L 494 14" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 6 106 L 6 114 L 14 114" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 486 114 L 494 114 L 494 106" fill="none" stroke="#00F5FF" stroke-width="1" />
  
    
</svg>
