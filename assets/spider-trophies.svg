<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020205"/>
      <stop offset="50%" stop-color="#070914"/>
      <stop offset="100%" stop-color="#040508"/>
    </linearGradient>

    <linearGradient id="laser-scan-tr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF1B2D" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="tr-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .tr-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
        fill: #FFFFFF;
        filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.7)) drop-shadow(0 0 20px rgba(255, 27, 45, 0.5));
      }
      .tr-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
      }
      .tr-mono {
        font-family: 'Fira Code', 'Consolas', 'Courier New', monospace;
        font-weight: 800;
      }

      @keyframes laser-run-tr {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: -1000; }
      }
      @keyframes scan-vert-tr {
        0% { transform: translateY(10px); opacity: 0; }
        50% { opacity: 0.65; }
        100% { transform: translateY(228px); opacity: 0; }
      }
      @keyframes beacon-ping-tr {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.3); filter: drop-shadow(0 0 6px #00E5FF); }
      }
      @keyframes float-cup-1 {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes float-cup-2 {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }

      .tr-laser { stroke-dasharray: 140 400; animation: laser-run-tr 6.5s linear infinite; }
      .tr-scan { animation: scan-vert-tr 5.2s linear infinite; }
      .tr-beacon { transform-origin: center; animation: beacon-ping-tr 2s ease-in-out infinite; }
      .tr-float-1 { animation: float-cup-1 3s ease-in-out infinite; }
      .tr-float-2 { animation: float-cup-2 3.8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Dark Base Chassis -->
  <rect x="8" y="8" width="984" height="224" rx="10" fill="url(#tr-bg)" stroke="#8B93A7" stroke-opacity="0.2" stroke-width="1.2"/>

  <!-- Left & Right Spider Web Corner Accents -->
  <g stroke="#00E5FF" stroke-width="1" stroke-opacity="0.3" fill="none">
    <line x1="8" y1="8" x2="120" y2="60"/>
    <line x1="8" y1="8" x2="60" y2="120"/>
    <path d="M 35 20 Q 60 40 20 70"/>
    <path d="M 70 40 Q 110 75 40 110"/>
  </g>
  <g stroke="#FF1B2D" stroke-width="1" stroke-opacity="0.3" fill="none">
    <line x1="992" y1="8" x2="880" y2="60"/>
    <line x1="992" y1="8" x2="940" y2="120"/>
    <path d="M 965 20 Q 940 40 980 70"/>
    <path d="M 930 40 Q 890 75 960 110"/>
  </g>

  <!-- Outer Angular Shield Frame -->
  <path d="M 30 10 L 970 10 L 990 30 L 990 210 L 970 230 L 30 230 L 10 210 L 10 30 Z" fill="none" stroke="#00E5FF" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Running Neon Laser Beam -->
  <path d="M 30 10 L 970 10 L 990 30 L 990 210 L 970 230 L 30 230 L 10 210 L 10 30 Z" fill="none" stroke="#00E5FF" stroke-width="2.5" class="tr-laser" filter="url(#tr-glow)"/>

  <!-- Animated Scanline Sweep -->
  <line x1="16" y1="0" x2="984" y2="0" stroke="url(#laser-scan-tr)" stroke-width="1.5" class="tr-scan"/>

  <!-- ========================================================================= -->
  <!-- HEADER ROW: SPIDER TROPHY ROOM // MULTIVERSE ACCOLADES                    -->
  <!-- ========================================================================= -->
  <g transform="translate(35, 24)">
    <!-- Spider Mask Icon -->
    <polygon points="0,-8 7,-2 0,6 -7,-2" fill="#FF1B2D"/>
    <polygon points="0,2 4,6 0,10 -4,6" fill="#FFD700"/>
    <text x="22" y="3" dominant-baseline="central" fill="#FFFFFF" font-size="15" class="tr-title" letter-spacing="2.5">
      SPIDER TROPHY ROOM // MULTIVERSE ACCOLADES
    </text>
  </g>

  <g transform="translate(965, 24)" text-anchor="end">
    <circle cx="-145" cy="0" r="3.5" fill="#00E5FF" class="tr-beacon"/>
    <text x="0" y="3" dominant-baseline="central" fill="#8B93A7" font-size="10.5" class="tr-mono" letter-spacing="1.5">
      STATUS: LEVEL 24 RANKED
    </text>
  </g>

  <!-- Header Underline -->
  <line x1="35" y1="46" x2="965" y2="46" stroke="#1E293B" stroke-width="1"/>

  <!-- ========================================================================= -->
  <!-- 8 TROPHIES ROW (Pitch: 114px, X start: 80)                                 -->
  <!-- ========================================================================= -->

  <!-- TROPHY 1: Stars (Super Star A) -->
  <g transform="translate(80, 80)" text-anchor="middle">
    <g class="tr-float-1">
      <text x="0" y="0" fill="#8B93A7" font-size="9" class="tr-mono">Stars</text>
      <!-- Laurel Wreath & Cup -->
      <path d="M -23 34 Q -30 20 -17 10 M 23 34 Q 30 20 17 10" fill="none" stroke="#22D3EE" stroke-width="1.8"/>
      <path d="M -13 10 L 13 10 L 9 28 C 9 34 -9 34 -9 28 Z" fill="#0E2238" stroke="#22D3EE" stroke-width="1.5"/>
      <path d="M -13 15 C -19 15 -19 24 -12 24 M 13 15 C 19 15 19 24 12 24" fill="none" stroke="#22D3EE" stroke-width="1.5"/>
      <rect x="-5" y="32" width="10" height="7" fill="#22D3EE"/>
      <rect x="-11" y="39" width="22" height="4" rx="1" fill="#22D3EE"/>
      <text x="0" y="24" fill="#FFFFFF" font-size="11" font-weight="900" class="tr-mono">A</text>
      <text x="0" y="58" fill="#FFFFFF" font-size="9" class="tr-mono">Super Star</text>
      <text x="0" y="72" fill="#8B93A7" font-size="8" class="tr-mono">161pt</text>
      <rect x="-20" y="78" width="40" height="2.5" rx="1" fill="#FF1B2D"/>
    </g>
  </g>

  <!-- TROPHY 2: Commits (High Committer A) -->
  <g transform="translate(195, 80)" text-anchor="middle">
    <g class="tr-float-2">
      <text x="0" y="0" fill="#8B93A7" font-size="9" class="tr-mono">Commits</text>
      <path d="M -23 34 Q -30 20 -17 10 M 23 34 Q 30 20 17 10" fill="none" stroke="#38BDF8" stroke-width="1.8"/>
      <path d="M -13 10 L 13 10 L 9 28 C 9 34 -9 34 -9 28 Z" fill="#0E2238" stroke="#38BDF8" stroke-width="1.5"/>
      <path d="M -13 15 C -19 15 -19 24 -12 24 M 13 15 C 19 15 19 24 12 24" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
      <rect x="-5" y="32" width="10" height="7" fill="#38BDF8"/>
      <rect x="-11" y="39" width="22" height="4" rx="1" fill="#38BDF8"/>
      <text x="0" y="24" fill="#FFFFFF" font-size="11" font-weight="900" class="tr-mono">A</text>
      <text x="0" y="58" fill="#FFFFFF" font-size="9" class="tr-mono">High Committer</text>
      <text x="0" y="72" fill="#8B93A7" font-size="8" class="tr-mono">105pt</text>
      <rect x="-20" y="78" width="40" height="2.5" rx="1" fill="#FF1B2D"/>
    </g>
  </g>

  <!-- TROPHY 3: Followers (Many Friends B) -->
  <g transform="translate(310, 80)" text-anchor="middle">
    <g class="tr-float-1">
      <text x="0" y="0" fill="#8B93A7" font-size="9" class="tr-mono">Followers</text>
      <path d="M -13 10 L 13 10 L 9 28 C 9 34 -9 34 -9 28 Z" fill="#2A141A" stroke="#F43F5E" stroke-width="1.5"/>
      <path d="M -13 15 C -19 15 -19 24 -12 24 M 13 15 C 19 15 19 24 12 24" fill="none" stroke="#F43F5E" stroke-width="1.5"/>
      <rect x="-5" y="32" width="10" height="7" fill="#F43F5E"/>
      <rect x="-11" y="39" width="22" height="4" rx="1" fill="#F43F5E"/>
      <text x="0" y="24" fill="#FFFFFF" font-size="11" font-weight="900" class="tr-mono">B</text>
      <text x="0" y="58" fill="#FFFFFF" font-size="9" class="tr-mono">Many Friends</text>
      <text x="0" y="72" fill="#8B93A7" font-size="8" class="tr-mono">17pt</text>
      <rect x="-20" y="78" width="40" height="2.5" rx="1" fill="#FF1B2D"/>
    </g>
  </g>

  <!-- TROPHY 4: Repositories (Middle Repo Creator B) -->
  <g transform="translate(425, 80)" text-anchor="middle">
    <g class="tr-float-2">
      <text x="0" y="0" fill="#8B93A7" font-size="9" class="tr-mono">Repositories</text>
      <path d="M -13 10 L 13 10 L 9 28 C 9 34 -9 34 -9 28 Z" fill="#2A141A" stroke="#F43F5E" stroke-width="1.5"/>
      <path d="M -13 15 C -19 15 -19 24 -12 24 M 13 15 C 19 15 19 24 12 24" fill="none" stroke="#F43F5E" stroke-width="1.5"/>
      <rect x="-5" y="32" width="10" height="7" fill="#F43F5E"/>
      <rect x="-11" y="39" width="22" height="4" rx="1" fill="#F43F5E"/>
      <text x="0" y="24" fill="#FFFFFF" font-size="11" font-weight="900" class="tr-mono">B</text>
      <text x="0" y="58" fill="#FFFFFF" font-size="9" class="tr-mono">Repo Creator</text>
      <text x="0" y="72" fill="#8B93A7" font-size="8" class="tr-mono">15pt</text>
      <rect x="-20" y="78" width="40" height="2.5" rx="1" fill="#FF1B2D"/>
    </g>
  </g>

  <!-- TROPHY 5: Issues (Locked ?) -->
  <g transform="translate(540, 80)" text-anchor="middle">
    <g class="tr-float-1">
      <text x="0" y="0" fill="#8B93A7" font-size="9" class="tr-mono">Issues</text>
      <path d="M -13 10 L 13 10 L 9 28 C 9 34 -9 34 -9 28 Z" fill="#141C2A" stroke="#60A5FA" stroke-width="1.5"/>
      <path d="M -13 15 C -19 15 -19 24 -12 24 M 13 15 C 19 15 19 24 12 24" fill="none" stroke="#60A5FA" stroke-width="1.5"/>
      <rect x="-5" y="32" width="10" height="7" fill="#60A5FA"/>
      <rect x="-11" y="39" width="22" height="4" rx="1" fill="#60A5FA"/>
      <text x="0" y="24" fill="#93C5FD" font-size="11" font-weight="900" class="tr-mono">?</text>
      <text x="0" y="58" fill="#8B93A7" font-size="9" class="tr-mono">Unknown</text>
      <text x="0" y="72" fill="#8B93A7" font-size="8" class="tr-mono">0pt</text>
      <rect x="-20" y="78" width="40" height="2.5" rx="1" fill="#334155"/>
    </g>
  </g>

  <!-- TROPHY 6: PullRequest (Locked ?) -->
  <g transform="translate(655, 80)" text-anchor="middle">
    <g class="tr-float-2">
      <text x="0" y="0" fill="#8B93A7" font-size="9" class="tr-mono">PullRequest</text>
      <path d="M -13 10 L 13 10 L 9 28 C 9 34 -9 34 -9 28 Z" fill="#141C2A" stroke="#60A5FA" stroke-width="1.5"/>
      <path d="M -13 15 C -19 15 -19 24 -12 24 M 13 15 C 19 15 19 24 12 24" fill="none" stroke="#60A5FA" stroke-width="1.5"/>
      <rect x="-5" y="32" width="10" height="7" fill="#60A5FA"/>
      <rect x="-11" y="39" width="22" height="4" rx="1" fill="#60A5FA"/>
      <text x="0" y="24" fill="#93C5FD" font-size="11" font-weight="900" class="tr-mono">?</text>
      <text x="0" y="58" fill="#8B93A7" font-size="9" class="tr-mono">Unknown</text>
      <text x="0" y="72" fill="#8B93A7" font-size="8" class="tr-mono">0pt</text>
      <rect x="-20" y="78" width="40" height="2.5" rx="1" fill="#334155"/>
    </g>
  </g>

  <!-- TROPHY 7: Reviews (Locked ?) -->
  <g transform="translate(770, 80)" text-anchor="middle">
    <g class="tr-float-1">
      <text x="0" y="0" fill="#8B93A7" font-size="9" class="tr-mono">Reviews</text>
      <path d="M -13 10 L 13 10 L 9 28 C 9 34 -9 34 -9 28 Z" fill="#141C2A" stroke="#60A5FA" stroke-width="1.5"/>
      <path d="M -13 15 C -19 15 -19 24 -12 24 M 13 15 C 19 15 19 24 12 24" fill="none" stroke="#60A5FA" stroke-width="1.5"/>
      <rect x="-5" y="32" width="10" height="7" fill="#60A5FA"/>
      <rect x="-11" y="39" width="22" height="4" rx="1" fill="#60A5FA"/>
      <text x="0" y="24" fill="#93C5FD" font-size="11" font-weight="900" class="tr-mono">?</text>
      <text x="0" y="58" fill="#8B93A7" font-size="9" class="tr-mono">Unknown</text>
      <text x="0" y="72" fill="#8B93A7" font-size="8" class="tr-mono">0pt</text>
      <rect x="-20" y="78" width="40" height="2.5" rx="1" fill="#334155"/>
    </g>
  </g>

  <!-- TROPHY 8: Experience (Locked ?) -->
  <g transform="translate(885, 80)" text-anchor="middle">
    <g class="tr-float-2">
      <text x="0" y="0" fill="#8B93A7" font-size="9" class="tr-mono">Experience</text>
      <path d="M -13 10 L 13 10 L 9 28 C 9 34 -9 34 -9 28 Z" fill="#141C2A" stroke="#60A5FA" stroke-width="1.5"/>
      <path d="M -13 15 C -19 15 -19 24 -12 24 M 13 15 C 19 15 19 24 12 24" fill="none" stroke="#60A5FA" stroke-width="1.5"/>
      <rect x="-5" y="32" width="10" height="7" fill="#60A5FA"/>
      <rect x="-11" y="39" width="22" height="4" rx="1" fill="#60A5FA"/>
      <text x="0" y="24" fill="#93C5FD" font-size="11" font-weight="900" class="tr-mono">?</text>
      <text x="0" y="58" fill="#8B93A7" font-size="9" class="tr-mono">Unknown</text>
      <text x="0" y="72" fill="#8B93A7" font-size="8" class="tr-mono">1pt</text>
      <rect x="-20" y="78" width="40" height="2.5" rx="1" fill="#334155"/>
    </g>
  </g>

  <!-- Red & Blue Glowing Edge Tracks (Spider-Verse HUD) -->
  <line x1="80" y1="12" x2="350" y2="12" stroke="#FF1B2D" stroke-width="3" filter="url(#tr-glow)"/>
  <line x1="650" y1="12" x2="920" y2="12" stroke="#21D4FD" stroke-width="3" filter="url(#tr-glow)"/>
  <line x1="80" y1="228" x2="350" y2="228" stroke="#FF1B2D" stroke-width="3" filter="url(#tr-glow)"/>
  <line x1="650" y1="228" x2="920" y2="228" stroke="#21D4FD" stroke-width="3" filter="url(#tr-glow)"/>

  <!-- Corner Brackets (Red Left, Blue Right) -->
  <path d="M 6 45 L 6 6 L 45 6" fill="none" stroke="#FF1B2D" stroke-width="2.8"/>
  <path d="M 994 45 L 994 6 L 955 6" fill="none" stroke="#21D4FD" stroke-width="2.8"/>
  <path d="M 6 195 L 6 234 L 45 234" fill="none" stroke="#FF1B2D" stroke-width="2.8"/>
  <path d="M 994 195 L 994 234 L 955 234" fill="none" stroke="#21D4FD" stroke-width="2.8"/>
</svg>
