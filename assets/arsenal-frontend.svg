<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 190" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="arsBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090C10" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <style>
      @keyframes arsSweep2 {
        0% { transform: translateX(-200px); }
        100% { transform: translateX(850px); }
      }
      .ars-scanner2 { animation: arsSweep2 4.2s linear infinite; }
    </style>
  </defs>

  <rect width="800" height="190" rx="8" fill="url(#arsBg2)" stroke="#171B21" stroke-width="1.5" />
  <polygon points="8,8 24,8 8,24" fill="#FF3038" />
  <polygon points="792,182 776,182 792,166" fill="#FF3038" />

  <g clip-path="url(#arsClip2)">
    <clipPath id="arsClip2">
      <rect x="2" y="2" width="796" height="186" rx="6" />
    </clipPath>
    <line x1="0" y1="0" x2="0" y2="190" stroke="#55E6FF" stroke-width="1.5" opacity="0.6" class="ars-scanner2" />
  </g>

  <g transform="translate(30, 32)" font-family="'Courier New', Consolas, monospace">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#55E6FF" letter-spacing="3">WEAPON RACK 02 // FRONTEND BLADES</text>
    <text x="560" y="0" font-size="10" fill="#787F89" letter-spacing="1">UI / INTERFACES</text>
    <line x1="0" y1="12" x2="740" y2="12" stroke="#171B21" stroke-width="1" />
  </g>

  <!-- 6 Frontend Items: React, Next.js, HTML5, CSS3, Tailwind CSS, Vite -->
  <g transform="translate(30, 70)" font-family="'Courier New', Consolas, monospace">
    <!-- React -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="115" height="85" rx="5" fill="#10141C" stroke="#55E6FF" stroke-width="1.2" />
      <polygon points="0,0 12,0 0,12" fill="#55E6FF" />
      <text x="57" y="32" text-anchor="middle" font-size="16" font-weight="900" fill="#55E6FF">REACT</text>
      <text x="57" y="55" text-anchor="middle" font-size="10" font-weight="700" fill="#F4F4F2">REACT 18/19</text>
      <text x="57" y="72" text-anchor="middle" font-size="8" fill="#787F89">COMPONENT CORE</text>
    </g>

    <!-- Next.js -->
    <g transform="translate(125, 0)">
      <rect x="0" y="0" width="115" height="85" rx="5" fill="#10141C" stroke="#171B21" stroke-width="1.2" />
      <polygon points="0,0 12,0 0,12" fill="#FFF" />
      <text x="57" y="32" text-anchor="middle" font-size="16" font-weight="900" fill="#FFF">NEXT.JS</text>
      <text x="57" y="55" text-anchor="middle" font-size="10" font-weight="700" fill="#F4F4F2">FULL-STACK SSR</text>
      <text x="57" y="72" text-anchor="middle" font-size="8" fill="#787F89">APP ROUTER</text>
    </g>

    <!-- HTML5 -->
    <g transform="translate(250, 0)">
      <rect x="0" y="0" width="115" height="85" rx="5" fill="#10141C" stroke="#171B21" stroke-width="1.2" />
      <polygon points="0,0 12,0 0,12" fill="#FF3038" />
      <text x="57" y="32" text-anchor="middle" font-size="16" font-weight="900" fill="#FF3038">HTML5</text>
      <text x="57" y="55" text-anchor="middle" font-size="10" font-weight="700" fill="#F4F4F2">SEMANTICS</text>
      <text x="57" y="72" text-anchor="middle" font-size="8" fill="#787F89">A11Y &amp; DOM</text>
    </g>

    <!-- CSS3 -->
    <g transform="translate(375, 0)">
      <rect x="0" y="0" width="115" height="85" rx="5" fill="#10141C" stroke="#171B21" stroke-width="1.2" />
      <polygon points="0,0 12,0 0,12" fill="#55E6FF" />
      <text x="57" y="32" text-anchor="middle" font-size="16" font-weight="900" fill="#55E6FF">CSS3</text>
      <text x="57" y="55" text-anchor="middle" font-size="10" font-weight="700" fill="#F4F4F2">ANIMATIONS</text>
      <text x="57" y="72" text-anchor="middle" font-size="8" fill="#787F89">GRID &amp; FLEX</text>
    </g>

    <!-- Tailwind CSS -->
    <g transform="translate(500, 0)">
      <rect x="0" y="0" width="115" height="85" rx="5" fill="#10141C" stroke="#171B21" stroke-width="1.2" />
      <polygon points="0,0 12,0 0,12" fill="#55E6FF" />
      <text x="57" y="32" text-anchor="middle" font-size="15" font-weight="900" fill="#55E6FF">TAILWIND</text>
      <text x="57" y="55" text-anchor="middle" font-size="10" font-weight="700" fill="#F4F4F2">TAILWIND CSS</text>
      <text x="57" y="72" text-anchor="middle" font-size="8" fill="#787F89">RAPID DESIGN</text>
    </g>

    <!-- Vite -->
    <g transform="translate(625, 0)">
      <rect x="0" y="0" width="115" height="85" rx="5" fill="#10141C" stroke="#FF3038" stroke-width="1.2" />
      <polygon points="0,0 12,0 0,12" fill="#F4C95D" />
      <text x="57" y="32" text-anchor="middle" font-size="16" font-weight="900" fill="#F4C95D">VITE</text>
      <text x="57" y="55" text-anchor="middle" font-size="10" font-weight="700" fill="#F4F4F2">BUNDLER</text>
      <text x="57" y="72" text-anchor="middle" font-size="8" fill="#787F89">LIGHTNING HMR</text>
    </g>
  </g>
</svg>
