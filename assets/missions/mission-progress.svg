<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="100%" height="140" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes pulseGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
      @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes waveScroll { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
      @keyframes lineFade { 0%, 20% { opacity: 0; } 35%, 100% { opacity: 1; } }
      text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace; -webkit-font-smoothing: antialiased; }
      
    </style>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 245, 255, 0.08)" stroke-width="0.8"/>
      <circle cx="30" cy="0" r="0.8" fill="#00F5FF" opacity="0.3"/>
    </pattern>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>
    <linearGradient id="hud-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0.9"/>
    </linearGradient>
    
  </defs>
  <rect width="1200" height="140" fill="#04070D" />
  <rect width="1200" height="140" fill="url(#grid-pattern)" />
  
      <rect width="1200" height="140" fill="#04070D" />
      <text x="40" y="28" fill="#00F5FF" font-size="10" font-weight="800" letter-spacing="2">MISSION_PIPELINE // STATE_BASED_EXECUTION</text>
      <g transform="translate(40, 60)">
        <rect width="145" height="42" fill="#080D18" stroke="rgba(0, 245, 255, 0.25)" rx="2"/><text x="12" y="24" fill="#EAFBFF" font-size="9" font-weight="800">1. QUEUED</text>
        <rect x="160" width="145" height="42" fill="#080D18" stroke="rgba(0, 245, 255, 0.25)" rx="2"/><text x="172" y="24" fill="#EAFBFF" font-size="9" font-weight="800">2. RESEARCHING</text>
        <rect x="320" width="145" height="42" fill="#080D18" stroke="rgba(0, 245, 255, 0.25)" rx="2"/><text x="332" y="24" fill="#EAFBFF" font-size="9" font-weight="800">3. PROTOTYPING</text>
        <rect x="480" width="145" height="42" fill="#080D18" stroke="rgba(0, 245, 255, 0.25)" rx="2"/><text x="492" y="24" fill="#EAFBFF" font-size="9" font-weight="800">4. BUILDING</text>
        <rect x="640" width="145" height="42" fill="#080D18" stroke="rgba(0, 245, 255, 0.25)" rx="2"/><text x="652" y="24" fill="#EAFBFF" font-size="9" font-weight="800">5. TESTING</text>
        <rect x="800" width="145" height="42" fill="#080D18" stroke="rgba(0, 245, 255, 0.25)" rx="2"/><text x="812" y="24" fill="#EAFBFF" font-size="9" font-weight="800">6. DEPLOYING</text>
        <rect x="960" width="150" height="42" fill="#080D18" stroke="#39FF88" rx="2"/><text x="972" y="24" fill="#39FF88" font-size="9" font-weight="800">7. LIVE ●</text>
      </g>
      
    <path d="M 10 16 L 10 8 L 18 8" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 1182 8 L 1190 8 L 1190 16" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 10 124 L 10 132 L 18 132" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 1182 132 L 1190 132 L 1190 124" fill="none" stroke="#00F5FF" stroke-width="1" />
  
    
</svg>
