<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020204"/>
      <stop offset="50%" stop-color="#050509"/>
      <stop offset="100%" stop-color="#020204"/>
    </linearGradient>

    <filter id="sh-glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="sh-glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="sh-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8B93A7" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <style>
      .sh-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 900; }
      .sh-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
      @keyframes sh-eye-pulse {
        0%, 100% { filter: drop-shadow(0 0 4px #00E5FF); opacity: 0.95; }
        50% { filter: drop-shadow(0 0 12px #21D4FD); opacity: 1; }
      }
      @keyframes sh-scan {
        0% { transform: translateY(-50px); opacity: 0; }
        50% { opacity: 0.7; }
        100% { transform: translateY(420px); opacity: 0; }
      }
      .sh-eye-anim { animation: sh-eye-pulse 3s ease-in-out infinite; }
      .sh-scan-anim { animation: sh-scan 6s linear infinite; }
    </style>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1200" height="400" fill="url(#sh-bg)"/>
  <rect width="1200" height="400" fill="url(#sh-grid)"/>

  <!-- Multiverse Ambient Lighting -->
  <circle cx="80" cy="200" r="280" fill="#FF1B2D" opacity="0.15" filter="blur(60px)"/>
  <circle cx="1120" cy="200" r="280" fill="#00A8FF" opacity="0.15" filter="blur(60px)"/>

  <!-- Left Web Strands -->
  <g stroke="#FF1B2D" stroke-opacity="0.3" stroke-width="1.2" fill="none">
    <polygon points="0,50 90,90 140,200 90,310 0,350"/>
    <polygon points="0,90 160,120 230,200 160,280 0,310"/>
    <line x1="0" y1="200" x2="330" y2="200" stroke-dasharray="4 2"/>
    <line x1="0" y1="0" x2="250" y2="170"/>
    <line x1="0" y1="400" x2="250" y2="230"/>
  </g>

  <!-- Right Web Strands -->
  <g stroke="#00A8FF" stroke-opacity="0.3" stroke-width="1.2" fill="none">
    <polygon points="1200,50 1110,90 1060,200 1110,310 1200,350"/>
    <polygon points="1200,90 1040,120 970,200 1040,280 1200,310"/>
    <line x1="1200" y1="200" x2="870" y2="200" stroke-dasharray="4 2"/>
    <line x1="1200" y1="0" x2="950" y2="170"/>
    <line x1="1200" y1="400" x2="950" y2="230"/>
  </g>

  <!-- Borders & HUD Tracks -->
  <rect x="20" y="16" width="1160" height="368" fill="none" stroke="#8B93A7" stroke-opacity="0.18" stroke-width="1"/>
  <line x1="100" y1="16" x2="360" y2="16" stroke="#FF1B2D" stroke-width="2.5" filter="url(#sh-glow-red)"/>
  <line x1="840" y1="16" x2="1100" y2="16" stroke="#00A8FF" stroke-width="2.5" filter="url(#sh-glow-blue)"/>
  <line x1="100" y1="384" x2="360" y2="384" stroke="#FF1B2D" stroke-width="2.5" filter="url(#sh-glow-red)"/>
  <line x1="840" y1="384" x2="1100" y2="384" stroke="#00A8FF" stroke-width="2.5" filter="url(#sh-glow-blue)"/>

  <!-- Left HUD Telemetry Box (High Contrast) -->
  <g transform="translate(45, 55)">
    <rect x="0" y="0" width="180" height="26" fill="#09090F" rx="3" stroke="#FF1B2D" stroke-width="1.2"/>
    <circle cx="14" cy="13" r="4" fill="#FF1B2D"/>
    <text x="28" y="18" fill="#FFFFFF" font-size="12" class="sh-sub" letter-spacing="1">EARTH-CODEX-01</text>
    
    <text x="4" y="52" fill="#FF1744" font-size="12" class="sh-sub">NODE // BANGALORE_IN</text>
    <text x="4" y="74" fill="#FFFFFF" font-size="11.5" class="sh-sub">SYSTEM // SPIDER-OS v2.6</text>
    <text x="4" y="96" fill="#00E5FF" font-size="11.5" class="sh-sub">SPIDER-SENSE // ACTIVE</text>
  </g>

  <!-- Right HUD Telemetry Box (High Contrast) -->
  <g transform="translate(975, 55)">
    <rect x="0" y="0" width="180" height="26" fill="#09090F" rx="3" stroke="#00A8FF" stroke-width="1.2"/>
    <circle cx="14" cy="13" r="4" fill="#00E5FF"/>
    <text x="28" y="18" fill="#00E5FF" font-size="12" class="sh-sub" letter-spacing="1">DEV_AGENT // ONLINE</text>
    
    <text x="4" y="52" fill="#FFFFFF" font-size="12" class="sh-sub">KERNEL // FULL-STACK-AI</text>
    <text x="4" y="74" fill="#00E5FF" font-size="11.5" class="sh-sub">STACK // MERN + LLM</text>
    <text x="4" y="96" fill="#FF1744" font-size="11.5" class="sh-sub">STATUS // SHIPPING CODE</text>
  </g>

  <!-- Center Mask Graphic -->
  <g transform="translate(600, 100)">
    <path d="M 0 -48 C 36 -48 58 -18 52 22 C 48 58 24 74 0 80 C -24 74 -48 58 -52 22 C -58 -18 -36 -48 0 -48 Z" fill="#09090F" stroke="#FF1B2D" stroke-width="2"/>
    <g class="sh-eye-anim">
      <polygon points="-6,4 -34,-2 -38,18 -18,22 -8,16" fill="#FFFFFF" stroke="#FF1B2D" stroke-width="1.5"/>
      <polygon points="6,4 34,-2 38,18 18,22 8,16" fill="#FFFFFF" stroke="#00A8FF" stroke-width="1.5"/>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- MAIN HIGH-CONTRAST TYPOGRAPHY & DEVELOPER BRANDING       -->
  <!-- ======================================================== -->

  <!-- Top Multiverse Node Status Tag -->
  <g transform="translate(600, 205)" text-anchor="middle">
    <rect x="-180" y="-16" width="360" height="26" fill="#09090F" rx="13" stroke="#00E5FF" stroke-width="1.2"/>
    <text x="0" y="2" fill="#00E5FF" font-size="12" class="sh-sub" letter-spacing="2.5">
      THE CODEX SPIDER-VERSE // COMMAND CENTER
    </text>
  </g>

  <!-- Main Developer Name (Single Razor-Sharp Layer with Dual Neon Glow) -->
  <g transform="translate(600, 260)" text-anchor="middle">
    <text x="0" y="0" fill="#FFFFFF" font-size="56" class="sh-title" letter-spacing="8" style="filter: drop-shadow(0 0 16px rgba(255, 27, 45, 0.8)) drop-shadow(0 0 28px rgba(0, 229, 255, 0.6));">
      ANJAN SHETTY
    </text>
  </g>

  <!-- Subheading / Identity & Focus -->
  <g transform="translate(600, 300)" text-anchor="middle">
    <text x="0" y="0" fill="#FFFFFF" font-size="16" class="sh-sub" letter-spacing="3">
      <tspan fill="#FF1744">CODEXANJAN</tspan>
      <tspan fill="#8B93A7"> // </tspan>
      <tspan fill="#FFFFFF">FRIENDLY NEIGHBORHOOD ARCHITECT</tspan>
    </text>
  </g>

  <!-- Tech Focus Capsules Bar -->
  <g transform="translate(600, 332)" text-anchor="middle">
    <text x="0" y="0" fill="#00E5FF" font-size="14" class="sh-sub" letter-spacing="2">
      FULL STACK <tspan fill="#FFFFFF">•</tspan> AI / ML <tspan fill="#FF1744">•</tspan> AGENTIC SYSTEMS <tspan fill="#FFFFFF">•</tspan> DEV TOOLS <tspan fill="#00E5FF">•</tspan> SPIDER PIPELINES
    </text>
  </g>

  <!-- Bottom Core Philosophy Banner -->
  <g transform="translate(600, 362)" text-anchor="middle">
    <text x="0" y="0" fill="#FFFFFF" font-size="13" class="sh-sub" letter-spacing="3">
      [ WITH GREAT POWER COMES GREAT CODE ]
    </text>
  </g>

  <!-- Cyber Scanline Effect -->
  <line x1="50" y1="0" x2="1150" y2="0" stroke="#00E5FF" stroke-width="2" class="sh-scan-anim" filter="url(#sh-glow-blue)"/>
</svg>
