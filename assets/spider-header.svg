<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="50%" stop-color="#080b14"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>

    <linearGradient id="red-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1744" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff1744" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="blue-glow" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00a8ff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="text-split" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="35%" stop-color="#ff5252"/>
      <stop offset="50%" stop-color="#f5f7fa"/>
      <stop offset="65%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00a8ff"/>
    </linearGradient>

    <linearGradient id="eye-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0f7fa"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <linearGradient id="spider-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#00a8ff"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="neon-glow-red" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="neon-glow-blue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glitch-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="0" stdDeviation="2" flood-color="#ff1744" flood-opacity="0.7"/>
      <feDropShadow dx="2" dy="0" stdDeviation="2" flood-color="#00e5ff" flood-opacity="0.7"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>

    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#00e5ff" fill-opacity="0.08"/>
    </pattern>

    <!-- Styles and Animations -->
    <style>
      @keyframes pulse-eye {
        0%, 100% { filter: drop-shadow(0 0 4px #00e5ff) drop-shadow(0 0 12px #00a8ff); opacity: 0.95; }
        50% { filter: drop-shadow(0 0 8px #00e5ff) drop-shadow(0 0 20px #00e5ff); opacity: 1; }
      }
      @keyframes scan-line {
        0% { transform: translateY(-100px); opacity: 0; }
        50% { opacity: 0.6; }
        100% { transform: translateY(400px); opacity: 0; }
      }
      @keyframes glitch-flicker {
        0%, 100% { opacity: 1; transform: translate(0, 0); }
        92% { opacity: 1; transform: translate(0, 0); }
        93% { opacity: 0.8; transform: translate(-2px, 1px); }
        94% { opacity: 1; transform: translate(2px, -1px); }
        95% { opacity: 0.9; transform: translate(0, 0); }
      }
      @keyframes web-pulse {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.45; }
      }
      .eye-anim { animation: pulse-eye 3s ease-in-out infinite; }
      .scan-anim { animation: scan-line 6s linear infinite; }
      .glitch-anim { animation: glitch-flicker 5s infinite; }
      .web-anim { animation: web-pulse 4s ease-in-out infinite; }
      .hud-text { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, 'Fira Code', monospace; letter-spacing: 2px; }
      .code-font { font-family: 'Fira Code', 'Courier New', monospace; }
    </style>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1200" height="380" fill="url(#bg-grad)"/>

  <!-- Cyber Grid Overlay -->
  <rect width="1200" height="380" fill="url(#cyber-grid)"/>
  <rect width="1200" height="380" fill="url(#dot-grid)"/>

  <!-- Ambient Multiverse Lighting (Left Red, Right Blue) -->
  <circle cx="80" cy="190" r="280" fill="#ff1744" opacity="0.12" filter="blur(50px)"/>
  <circle cx="1120" cy="190" r="280" fill="#00e5ff" opacity="0.12" filter="blur(50px)"/>
  <circle cx="600" cy="190" r="220" fill="#8b5cf6" opacity="0.08" filter="blur(60px)"/>

  <!-- Geometric Spider-Web Geometry (Left Web - Red) -->
  <g stroke="#ff1744" stroke-opacity="0.25" stroke-width="1.2" fill="none" class="web-anim">
    <!-- Concentric Web Rings -->
    <polygon points="0,50 90,90 140,190 90,290 0,330"/>
    <polygon points="0,90 160,120 230,190 160,260 0,290"/>
    <polygon points="0,130 230,150 310,190 230,230 0,250"/>
    <!-- Web Radial Strands -->
    <line x1="0" y1="190" x2="330" y2="190" stroke-dasharray="4 2"/>
    <line x1="0" y1="0" x2="250" y2="160"/>
    <line x1="0" y1="380" x2="250" y2="220"/>
    <line x1="0" y1="90" x2="200" y2="175"/>
    <line x1="0" y1="290" x2="200" y2="205"/>
  </g>

  <!-- Geometric Spider-Web Geometry (Right Web - Blue) -->
  <g stroke="#00e5ff" stroke-opacity="0.25" stroke-width="1.2" fill="none" class="web-anim">
    <!-- Concentric Web Rings -->
    <polygon points="1200,50 1110,90 1060,190 1110,290 1200,330"/>
    <polygon points="1200,90 1040,120 970,190 1040,260 1200,290"/>
    <polygon points="1200,130 970,150 890,190 970,230 1200,250"/>
    <!-- Web Radial Strands -->
    <line x1="1200" y1="190" x2="870" y2="190" stroke-dasharray="4 2"/>
    <line x1="1200" y1="0" x2="950" y2="160"/>
    <line x1="1200" y1="380" x2="950" y2="220"/>
    <line x1="1200" y1="90" x2="1000" y2="175"/>
    <line x1="1200" y1="290" x2="1000" y2="205"/>
  </g>

  <!-- Top & Bottom Neon Border Tracks -->
  <line x1="30" y1="18" x2="1170" y2="18" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="120" y1="18" x2="350" y2="18" stroke="#ff1744" stroke-width="2" filter="url(#neon-glow-red)"/>
  <line x1="850" y1="18" x2="1080" y2="18" stroke="#00e5ff" stroke-width="2" filter="url(#neon-glow-blue)"/>
  
  <line x1="30" y1="362" x2="1170" y2="362" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="120" y1="362" x2="350" y2="362" stroke="#ff1744" stroke-width="2" filter="url(#neon-glow-red)"/>
  <line x1="850" y1="362" x2="1080" y2="362" stroke="#00e5ff" stroke-width="2" filter="url(#neon-glow-blue)"/>

  <!-- Corner HUD Angle Brackets -->
  <path d="M 25 45 L 25 25 L 45 25" stroke="#ff1744" stroke-width="2" fill="none"/>
  <path d="M 1175 45 L 1175 25 L 1155 25" stroke="#00e5ff" stroke-width="2" fill="none"/>
  <path d="M 25 335 L 25 355 L 45 355" stroke="#ff1744" stroke-width="2" fill="none"/>
  <path d="M 1175 335 L 1175 355 L 1155 355" stroke="#00e5ff" stroke-width="2" fill="none"/>

  <!-- Left HUD Telemetry Box -->
  <g transform="translate(45, 55)" opacity="0.85">
    <rect x="0" y="0" width="160" height="24" fill="#ff1744" fill-opacity="0.1" rx="2" stroke="#ff1744" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#ff1744"/>
    <text x="24" y="16" fill="#f5f7fa" font-size="10" font-weight="700" class="code-font" letter-spacing="1">EARTH-CODEX-01</text>
    
    <text x="0" y="48" fill="#ff5252" font-size="9" font-weight="600" class="code-font">NODE // BANGALORE_IN</text>
    <text x="0" y="64" fill="#a0aab8" font-size="9" class="code-font">LAT: 12.9716° N // 77.5946° E</text>
    <text x="0" y="80" fill="#a0aab8" font-size="9" class="code-font">SYSTEM: SPIDER-OS v2.6</text>
    <text x="0" y="96" fill="#ff1744" font-size="9" font-weight="600" class="code-font">SPIDER-SENSE: ACTIVE [100%]</text>

    <!-- Mini Audio / Waveform Visualizer -->
    <g transform="translate(0, 110)">
      <rect x="0" y="10" width="3" height="15" fill="#ff1744" opacity="0.6"/>
      <rect x="6" y="4" width="3" height="21" fill="#ff1744" opacity="0.8"/>
      <rect x="12" y="8" width="3" height="17" fill="#ff1744" opacity="0.5"/>
      <rect x="18" y="2" width="3" height="23" fill="#ff1744"/>
      <rect x="24" y="12" width="3" height="13" fill="#ff1744" opacity="0.4"/>
      <rect x="30" y="6" width="3" height="19" fill="#ff1744" opacity="0.9"/>
      <rect x="36" y="14" width="3" height="11" fill="#ff1744" opacity="0.6"/>
      <text x="50" y="20" fill="#ff5252" font-size="9" class="code-font">NEURAL_FREQ: 98.4 Hz</text>
    </g>
  </g>

  <!-- Right HUD Telemetry Box -->
  <g transform="translate(985, 55)" opacity="0.85">
    <rect x="0" y="0" width="170" height="24" fill="#00e5ff" fill-opacity="0.1" rx="2" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="12" cy="12" r="4" fill="#00e5ff"/>
    <text x="24" y="16" fill="#f5f7fa" font-size="10" font-weight="700" class="code-font" letter-spacing="1">DEV_AGENT // ONLINE</text>
    
    <text x="0" y="48" fill="#00e5ff" font-size="9" font-weight="600" class="code-font">KERNEL // FULL-STACK-AI</text>
    <text x="0" y="64" fill="#a0aab8" font-size="9" class="code-font">STACK // MERN + LLM + CLOUD</text>
    <text x="0" y="80" fill="#a0aab8" font-size="9" class="code-font">AGENTIC PIPELINE: READY</text>
    <text x="0" y="96" fill="#00e5ff" font-size="9" font-weight="600" class="code-font">STATUS // SHIPPING CODE</text>

    <!-- Mini Circular HUD Target -->
    <g transform="translate(130, 110)">
      <circle cx="15" cy="15" r="14" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.4" fill="none" stroke-dasharray="3 3"/>
      <circle cx="15" cy="15" r="8" stroke="#00e5ff" stroke-width="1" fill="none"/>
      <circle cx="15" cy="15" r="2" fill="#00e5ff"/>
      <line x1="15" y1="0" x2="15" y2="30" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.5"/>
      <line x1="0" y1="15" x2="30" y2="15" stroke="#00e5ff" stroke-width="1" stroke-opacity="0.5"/>
    </g>
    <text x="0" y="130" fill="#00a8ff" font-size="9" class="code-font">TARGET // SHIP EXCELLENCE</text>
  </g>

  <!-- ======================================================== -->
  <!-- CENTER CHARACTER: THE SPIDER-VERSE TECH MASKED HERO       -->
  <!-- ======================================================== -->
  <g transform="translate(600, 105)" class="glitch-anim">
    <!-- Subtle Background Aura -->
    <circle cx="0" cy="10" r="75" fill="#000000" opacity="0.6"/>
    <circle cx="0" cy="10" r="72" stroke="url(#spider-badge)" stroke-width="2" fill="none" opacity="0.6"/>

    <!-- Tech Spider Web Mask Silhouette -->
    <!-- Head Base -->
    <path d="M 0 -58 C 42 -58 68 -22 62 26 C 56 68 28 88 0 94 C -28 88 -56 68 -62 26 C -68 -22 -42 -58 0 -58 Z" 
          fill="#0c0e17" stroke="#1f263b" stroke-width="2"/>

    <!-- Mask Crimson Edge Accents -->
    <path d="M 0 -58 C 22 -58 52 -20 48 24 C 44 56 22 76 0 86" 
          fill="none" stroke="#ff1744" stroke-width="1.8" stroke-opacity="0.75"/>
    <path d="M 0 -58 C -22 -58 -52 -20 -48 24 C -44 56 -22 76 0 86" 
          fill="none" stroke="#00e5ff" stroke-width="1.8" stroke-opacity="0.75"/>

    <!-- Internal Tech Web Strands on Mask Face -->
    <path d="M 0 -58 L 0 86" stroke="#2a334d" stroke-width="1"/>
    <path d="M 0 10 L 58 -8" stroke="#2a334d" stroke-width="1"/>
    <path d="M 0 10 L -58 -8" stroke="#2a334d" stroke-width="1"/>
    <path d="M 0 10 L 45 55" stroke="#2a334d" stroke-width="1"/>
    <path d="M 0 10 L -45 55" stroke="#2a334d" stroke-width="1"/>
    <path d="M 0 -24 C 18 -24 38 -12 44 2" fill="none" stroke="#2a334d" stroke-width="1"/>
    <path d="M 0 -24 C -18 -24 -38 -12 -44 2" fill="none" stroke="#2a334d" stroke-width="1"/>
    <path d="M 0 35 C 16 35 32 44 38 60" fill="none" stroke="#2a334d" stroke-width="1"/>
    <path d="M 0 35 C -16 35 -32 44 -38 60" fill="none" stroke="#2a334d" stroke-width="1"/>

    <!-- ========================================== -->
    <!-- ICONIC SPIDER-VERSE TECH MASK EYES (GLOW)  -->
    <!-- ========================================== -->
    <!-- Left Eye (Crimson Border, Brilliant White/Cyan Lens) -->
    <g class="eye-anim">
      <!-- Black Outer Eye Bezel -->
      <polygon points="-8,-6 -46,-12 -52,14 -24,20 -10,14" fill="#040608" stroke="#ff1744" stroke-width="2"/>
      <!-- Inner Glowing White Lens -->
      <polygon points="-12,-3 -42,-8 -46,12 -25,16 -13,11" fill="url(#eye-glow)"/>
      <!-- Cyan Edge Glitch -->
      <line x1="-12" y1="-3" x2="-42" y2="-8" stroke="#00e5ff" stroke-width="1.5" opacity="0.8"/>
    </g>

    <!-- Right Eye (Cyan Border, Brilliant White/Cyan Lens) -->
    <g class="eye-anim">
      <!-- Black Outer Eye Bezel -->
      <polygon points="8,-6 46,-12 52,14 24,20 10,14" fill="#040608" stroke="#00e5ff" stroke-width="2"/>
      <!-- Inner Glowing White Lens -->
      <polygon points="12,-3 42,-8 46,12 25,16 13,11" fill="url(#eye-glow)"/>
      <!-- Red Edge Glitch -->
      <line x1="12" y1="-3" x2="42" y2="-8" stroke="#ff1744" stroke-width="1.5" opacity="0.8"/>
    </g>

    <!-- Center Forehead Abstract Cyber Spider Glyph -->
    <g transform="translate(0, -32) scale(0.65)">
      <!-- Spider Body Diamond -->
      <polygon points="0,-10 6,-3 0,8 -6,-3" fill="#ff1744"/>
      <polygon points="0,5 5,12 0,18 -5,12" fill="#00e5ff"/>
      <!-- Top Spider Legs -->
      <path d="M -4 -6 L -16 -16 L -24 -12" fill="none" stroke="#ff1744" stroke-width="1.5"/>
      <path d="M 4 -6 L 16 -16 L 24 -12" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
      <path d="M -5 -2 L -20 -6 L -28 0" fill="none" stroke="#ff1744" stroke-width="1.5"/>
      <path d="M 5 -2 L 20 -6 L 28 0" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
      <!-- Bottom Spider Legs -->
      <path d="M -4 4 L -18 10 L -24 22" fill="none" stroke="#ff1744" stroke-width="1.5"/>
      <path d="M 4 4 L 18 10 L 24 22" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
      <path d="M -3 10 L -14 18 L -18 30" fill="none" stroke="#ff1744" stroke-width="1.5"/>
      <path d="M 3 10 L 14 18 L 18 30" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
    </g>

    <!-- Collar / Hoodie Cyber Brackets -->
    <path d="M -54 74 L -30 92 L 0 98 L 30 92 L 54 74" fill="none" stroke="#334155" stroke-width="2"/>
    <circle cx="0" cy="98" r="3" fill="#00e5ff"/>
  </g>

  <!-- ======================================================== -->
  <!-- MAIN TYPOGRAPHY & DEVELOPER BRANDING                      -->
  <!-- ======================================================== -->

  <!-- Top Multiverse Node Status Tag -->
  <g transform="translate(600, 230)" text-anchor="middle">
    <rect x="-140" y="-18" width="280" height="22" fill="#080b14" rx="11" stroke="#334155" stroke-width="1"/>
    <text x="0" y="-3" fill="#00e5ff" font-size="11" font-weight="700" class="code-font" letter-spacing="2">
      ⚡ THE CODEX SPIDER-VERSE ⚡
    </text>
  </g>

  <!-- Main Developer Name (Glitch Filter + Split Gradient) -->
  <g transform="translate(600, 280)" text-anchor="middle" class="hud-text">
    <!-- Red Glitch Underlay -->
    <text x="-2" y="0" fill="#ff1744" font-size="44" font-weight="900" letter-spacing="8" opacity="0.75">
      ANJAN SHETTY
    </text>
    <!-- Cyan Glitch Underlay -->
    <text x="2" y="0" fill="#00e5ff" font-size="44" font-weight="900" letter-spacing="8" opacity="0.75">
      ANJAN SHETTY
    </text>
    <!-- Crisp Foreground Text -->
    <text x="0" y="0" fill="url(#text-split)" font-size="44" font-weight="900" letter-spacing="8">
      ANJAN SHETTY
    </text>
  </g>

  <!-- Subheading / Identity & Focus -->
  <g transform="translate(600, 312)" text-anchor="middle">
    <text x="0" y="0" fill="#f5f7fa" font-size="13" font-weight="700" class="code-font" letter-spacing="3">
      <tspan fill="#ff1744">CODEXANJAN</tspan>
      <tspan fill="#475569"> // </tspan>
      <tspan fill="#f5f7fa">FRIENDLY NEIGHBORHOOD DEVELOPER</tspan>
    </text>
  </g>

  <!-- Tech Focus Capsules Bar -->
  <g transform="translate(600, 338)" text-anchor="middle">
    <text x="0" y="0" fill="#94a3b8" font-size="11" font-weight="600" class="code-font" letter-spacing="2">
      FULL STACK <tspan fill="#00e5ff">•</tspan> AI / ML <tspan fill="#ff1744">•</tspan> AGENTIC AI <tspan fill="#8b5cf6">•</tspan> DEV TOOLS <tspan fill="#00e5ff">•</tspan> SYSTEM DESIGN
    </text>
  </g>

  <!-- Bottom Core Philosophy Banner -->
  <g transform="translate(600, 356)" text-anchor="middle">
    <text x="0" y="0" fill="#475569" font-size="9.5" font-weight="700" class="code-font" letter-spacing="3">
      [ BUILD  //  LEARN  //  SHIP  //  REPEAT ]
    </text>
  </g>

  <!-- Cyber Scanline Effect -->
  <line x1="50" y1="0" x2="1150" y2="0" stroke="#00e5ff" stroke-width="1.5" opacity="0.3" class="scan-anim" filter="url(#neon-glow-blue)"/>
</svg>
