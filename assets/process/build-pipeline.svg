<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes pulseGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
      @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes waveScroll { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
      @keyframes lineFade { 0%, 20% { opacity: 0; } 35%, 100% { opacity: 1; } }
      text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace; -webkit-font-smoothing: antialiased; }
      
    </style>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 245, 255, 0.08)" stroke-width="0.8"/>
      <circle cx="30" cy="0" r="0.8" fill="#00F5FF" opacity="0.3"/>
    </pattern>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>
    <linearGradient id="hud-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0.9"/>
    </linearGradient>
    
  </defs>
  <rect width="600" height="200" fill="#04070D" />
  <rect width="600" height="200" fill="url(#grid-pattern)" />
  
      <rect width="600" height="200" fill="#04070D" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1" />
      <text x="25" y="28" fill="#00F5FF" font-size="11" font-weight="800" letter-spacing="2">CI_CD_TELEMETRY // AUTOMATION_PIPELINE</text>
      <g transform="translate(35, 60)">
        <rect x="0" y="0" width="110" height="50" fill="#080D18" stroke="#00F5FF" rx="1"/><text x="12" y="22" fill="#00F5FF" font-size="9" font-weight="700">LINT &amp; TYPE</text><text x="12" y="38" fill="#39FF88" font-size="8">PASS</text>
        <rect x="140" y="0" width="110" height="50" fill="#080D18" stroke="#00F5FF" rx="1"/><text x="152" y="22" fill="#00F5FF" font-size="9" font-weight="700">UNIT TESTS</text><text x="152" y="38" fill="#39FF88" font-size="8">100% OK</text>
        <rect x="280" y="0" width="110" height="50" fill="#080D18" stroke="#00F5FF" rx="1"/><text x="292" y="22" fill="#00F5FF" font-size="9" font-weight="700">CONTAINER</text><text x="292" y="38" fill="#39FF88" font-size="8">BUILT</text>
        <rect x="420" y="0" width="110" height="50" fill="#080D18" stroke="#39FF88" rx="1"/><text x="432" y="22" fill="#39FF88" font-size="9" font-weight="700">DEPLOY</text><text x="432" y="38" fill="#39FF88" font-size="8">LIVE ●</text>
      </g>
      
    <path d="M 6 16 L 6 6 L 16 6" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 584 6 L 594 6 L 594 16" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 6 184 L 6 194 L 16 194" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 584 194 L 594 194 L 594 184" fill="none" stroke="#00F5FF" stroke-width="1" />
  
    
</svg>
