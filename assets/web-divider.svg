<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 36" width="100%" height="100%">
  <defs>
    <linearGradient id="strand-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1B2D" stop-opacity="0"/>
      <stop offset="15%" stop-color="#FF1B2D" stop-opacity="0.8"/>
      <stop offset="48%" stop-color="#21D4FD" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F5F7FA"/>
      <stop offset="52%" stop-color="#21D4FD" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#00A8FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00A8FF" stop-opacity="0"/>
    </linearGradient>

    <filter id="center-node-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes travel-light {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: -240; }
      }
      @keyframes core-pulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #FF1B2D); }
        50% { transform: scale(1.1); filter: drop-shadow(0 0 10px #21D4FD); }
      }
      .laser-travel { stroke-dasharray: 60 180; animation: travel-light 4s linear infinite; }
      .pulse-node { transform-origin: 600px 18px; animation: core-pulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Web Track (Dim Baseline) -->
  <line x1="80" y1="18" x2="1120" y2="18" stroke="#8B93A7" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Left Main Web Strand -->
  <line x1="120" y1="18" x2="540" y2="18" stroke="url(#strand-grad)" stroke-width="1.8"/>
  <line x1="120" y1="18" x2="540" y2="18" stroke="#FF1B2D" stroke-width="2" class="laser-travel" opacity="0.9"/>

  <!-- Right Main Web Strand -->
  <line x1="660" y1="18" x2="1080" y2="18" stroke="url(#strand-grad)" stroke-width="1.8"/>
  <line x1="660" y1="18" x2="1080" y2="18" stroke="#00A8FF" stroke-width="2" class="laser-travel" opacity="0.9"/>

  <!-- Subtle Radiating Corner Web Geometry (Left Flank) -->
  <path d="M 520 18 L 540 10 M 500 18 L 525 26 M 470 18 L 490 10" stroke="#FF1B2D" stroke-opacity="0.35" stroke-width="1"/>
  <circle cx="540" cy="10" r="1.5" fill="#FF1B2D"/>
  <circle cx="525" cy="26" r="1.5" fill="#FF1B2D"/>
  <circle cx="490" cy="10" r="1.5" fill="#FF1B2D"/>

  <!-- Subtle Radiating Corner Web Geometry (Right Flank) -->
  <path d="M 680 18 L 660 10 M 700 18 L 675 26 M 730 18 L 710 10" stroke="#00A8FF" stroke-opacity="0.35" stroke-width="1"/>
  <circle cx="660" cy="10" r="1.5" fill="#00A8FF"/>
  <circle cx="675" cy="26" r="1.5" fill="#00A8FF"/>
  <circle cx="710" cy="10" r="1.5" fill="#00A8FF"/>

  <!-- Center Web / Spider Nexus Node -->
  <g class="pulse-node">
    <!-- Outer Diamond Reticle -->
    <polygon points="600,4 624,18 600,32 576,18" fill="#050509" stroke="#00A8FF" stroke-width="1.5" filter="url(#center-node-glow)"/>
    <polygon points="600,8 616,18 600,28 584,18" fill="#09090F" stroke="#FF1B2D" stroke-width="1"/>

    <!-- Central Spider Core Glyph -->
    <polygon points="600,12 604,16 600,20 596,16" fill="#FF1B2D"/>
    <polygon points="600,19 603,23 600,25 597,23" fill="#21D4FD"/>

    <!-- Micro Spider Bracket Legs -->
    <path d="M 596 15 L 590 12 M 604 15 L 610 12" stroke="#FF1B2D" stroke-width="1.2" fill="none"/>
    <path d="M 595 18 L 588 18 M 605 18 L 612 18" stroke="#F5F7FA" stroke-width="1.2" fill="none"/>
    <path d="M 596 21 L 590 24 M 604 21 L 610 24" stroke="#00A8FF" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Wing Brackets -->
  <path d="M 562 12 L 554 18 L 562 24" fill="none" stroke="#FF1B2D" stroke-width="1.5"/>
  <path d="M 638 12 L 646 18 L 638 24" fill="none" stroke="#00A8FF" stroke-width="1.5"/>
</svg>
