<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="mBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050608" />
      <stop offset="50%" stop-color="#080A0D" />
      <stop offset="100%" stop-color="#101318" />
    </linearGradient>
    <linearGradient id="mTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A8ADB7" />
    </linearGradient>
    <radialGradient id="mRedGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3038" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF3038" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="mCyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#55E6FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#55E6FF" stop-opacity="0" />
    </radialGradient>
    <filter id="mGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="mGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#171B21" stroke-width="0.75" />
      <line x1="0" y1="0" x2="0" y2="30" stroke="#171B21" stroke-width="0.75" />
    </pattern>

    <style>
      @keyframes mVisorPulse {
        0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 4px #FF3038); }
        50% { opacity: 1; filter: drop-shadow(0 0 14px #FF4B4B); }
      }
      @keyframes mBladeSurge {
        0%, 100% { stroke-dashoffset: 400; }
        50% { stroke-dashoffset: 0; }
      }
      @keyframes mBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .m-visor { animation: mVisorPulse 3s ease-in-out infinite; }
      .m-blade { stroke-dasharray: 200; animation: mBladeSurge 4s ease-in-out infinite; }
      .m-cursor { animation: mBlink 1.2s infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="900" fill="url(#mBgDark)" />
  <rect width="900" height="900" fill="url(#mGrid)" opacity="0.5" />

  <!-- Ambient Glows -->
  <circle cx="450" cy="300" r="280" fill="url(#mRedGlow)" />
  <circle cx="450" cy="700" r="220" fill="url(#mCyanGlow)" />

  <!-- Outer HUD Frame & Corner Accents -->
  <rect x="20" y="20" width="860" height="860" rx="16" fill="none" stroke="#171B21" stroke-width="2" />
  <path d="M 20 80 L 20 20 L 80 20" fill="none" stroke="#FF3038" stroke-width="4" />
  <path d="M 820 20 L 880 20 L 880 80" fill="none" stroke="#FF3038" stroke-width="4" />
  <path d="M 20 820 L 20 880 L 80 880" fill="none" stroke="#FF3038" stroke-width="4" />
  <path d="M 820 880 L 880 880 L 880 820" fill="none" stroke="#FF3038" stroke-width="4" />

  <!-- Top System Telemetry -->
  <g font-family="'Courier New', Consolas, monospace" font-size="13" fill="#787F89" letter-spacing="2">
    <text x="60" y="55">RONIN COMMAND // MOBILE</text>
    <circle cx="780" cy="50" r="4" fill="#42FF9E" />
    <text x="795" y="55" fill="#42FF9E" font-weight="700">ONLINE</text>
  </g>

  <!-- ======================================================== -->
  <!-- CENTER TOP: SAMURAI HELMET & BLADE SYMBOL                -->
  <!-- ======================================================== -->
  <g transform="translate(450, 240)">
    <!-- Katana Behind Helmet -->
    <line x1="-240" y1="120" x2="240" y2="-120" stroke="#101318" stroke-width="8" stroke-linecap="round" />
    <line x1="-240" y1="120" x2="240" y2="-120" stroke="#FF3038" stroke-width="3" stroke-linecap="round" class="m-blade" filter="url(#mGlow)" />

    <!-- Helmet Crown Dome & Horns -->
    <path d="M 0 -130 L 40 -180 L 20 -120 Z" fill="#FF3038" filter="url(#mGlow)" />
    <path d="M 0 -130 L -40 -180 L -20 -120 Z" fill="#FF3038" filter="url(#mGlow)" />
    <polygon points="0,-140 14,-115 0,-120 -14,-115" fill="#F4F4F2" />

    <path d="M -75 -65 C -75 -135 75 -135 75 -65 L 65 -45 L -65 -45 Z" fill="#14181F" stroke="#2D3440" stroke-width="2" />
    <path d="M -85 -50 L 0 -65 L 85 -50 L 80 -35 L -80 -35 Z" fill="#1C222B" stroke="#FF3038" stroke-width="1.5" />

    <!-- Visor Glow -->
    <path d="M -60 -28 L 0 -36 L 60 -28 L 50 -14 L -50 -14 Z" fill="#FF3038" filter="url(#mGlow)" class="m-visor" />
    <line x1="-50" y1="-21" x2="50" y2="-21" stroke="#FFF" stroke-width="2" />

    <!-- Menpo Mask -->
    <path d="M -50 -10 L 0 10 L 50 -10 L 40 40 L 0 70 L -40 40 Z" fill="#0C0E12" stroke="#222832" stroke-width="2" />
    <line x1="-15" y1="30" x2="15" y2="30" stroke="#FF3038" stroke-width="2" />
    <line x1="-10" y1="42" x2="10" y2="42" stroke="#55E6FF" stroke-width="2" />

    <!-- Shoulder Armor Plates -->
    <path d="M -110 -25 L -85 45 L -60 45 L -85 -25 Z" fill="#171B21" stroke="#FF3038" stroke-width="1" />
    <path d="M 110 -25 L 85 45 L 60 45 L 85 -25 Z" fill="#171B21" stroke="#FF3038" stroke-width="1" />
  </g>

  <!-- ======================================================== -->
  <!-- CENTER LOWER: NAME, ROLE, CREST BADGE, STATUS            -->
  <!-- ======================================================== -->
  <g transform="translate(450, 480)" text-anchor="middle">
    <!-- Tag -->
    <rect x="-90" y="-30" width="180" height="26" rx="4" fill="#101318" stroke="#FF3038" stroke-width="1" />
    <text x="0" y="-13" font-family="'Courier New', Consolas, monospace" font-size="12" font-weight="700" fill="#FF3038" letter-spacing="3">DIGITAL RONIN</text>

    <!-- Full Name -->
    <text x="0" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="url(#mTextGrad)" letter-spacing="4">ANJAN SHETTY</text>

    <!-- Katana Line Under Name -->
    <line x1="-280" y1="80" x2="280" y2="80" stroke="#222832" stroke-width="2" />
    <line x1="-180" y1="80" x2="180" y2="80" stroke="#FF3038" stroke-width="3" filter="url(#mGlow)" />

    <!-- Roles -->
    <text x="0" y="125" font-family="'Courier New', Consolas, monospace" font-size="22" font-weight="800" fill="#F4F4F2" letter-spacing="3">FULL-STACK DEVELOPER</text>
    <text x="0" y="160" font-family="'Courier New', Consolas, monospace" font-size="19" font-weight="700" fill="#55E6FF" letter-spacing="3">AI / ML ENGINEER</text>

    <!-- Status Card -->
    <g transform="translate(-320, 200)" text-anchor="start" font-family="'Courier New', Consolas, monospace" font-size="14" fill="#787F89">
      <rect x="0" y="0" width="640" height="110" rx="6" fill="#0C0E14" stroke="#171B21" stroke-width="1.5" />
      <path d="M 0 0 L 12 0 L 0 12 Z" fill="#FF3038" />
      <path d="M 640 110 L 628 110 L 640 98 Z" fill="#FF3038" />

      <text x="30" y="38" letter-spacing="2">CODENAME: <tspan fill="#F4F4F2" font-weight="700">CODEXANJAN</tspan></text>
      <text x="380" y="38" letter-spacing="2">SYSTEM: <tspan fill="#42FF9E" font-weight="700">ONLINE</tspan></text>

      <line x1="30" y1="56" x2="610" y2="56" stroke="#171B21" stroke-width="1" />

      <text x="30" y="85" letter-spacing="2">MODE: <tspan fill="#FF3038" font-weight="700">BUILD</tspan></text>
      <text x="210" y="85" letter-spacing="2">PROTOCOL: <tspan fill="#A8ADB7">CREATE / SHIP / EVOLVE</tspan></text>
      <rect x="585" y="72" width="12" height="14" fill="#FF3038" class="m-cursor" />
    </g>

    <!-- Philosophy Signature -->
    <text x="0" y="355" font-family="'Courier New', Consolas, monospace" font-size="12" font-weight="700" fill="#A8ADB7" letter-spacing="3">DISCIPLINE IN DESIGN. PRECISION IN CODE.</text>
  </g>
</svg>
