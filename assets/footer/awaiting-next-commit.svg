<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 70" width="100%" height="70" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes pulseGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
      @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes waveScroll { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
      @keyframes lineFade { 0%, 20% { opacity: 0; } 35%, 100% { opacity: 1; } }
      text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace; -webkit-font-smoothing: antialiased; }
      @keyframes cursorFlash2 { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    </style>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 245, 255, 0.08)" stroke-width="0.8"/>
      <circle cx="30" cy="0" r="0.8" fill="#00F5FF" opacity="0.3"/>
    </pattern>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>
    <linearGradient id="hud-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0.9"/>
    </linearGradient>
    
  </defs>
  <rect width="1200" height="70" fill="#04070D" />
  <rect width="1200" height="70" fill="url(#grid-pattern)" />
  
      <rect width="1200" height="70" fill="#080D18" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1.2" />
      <g transform="translate(40, 42)">
        <circle cx="10" cy="-4" r="4" fill="#39FF88"><animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/></circle>
        <text x="25" y="0" fill="#EAFBFF" font-size="11" font-weight="800" letter-spacing="2">SYSTEM ONLINE &nbsp;//&nbsp; NODE: CODEXANJAN</text>
        <text x="800" y="0" fill="#00F5FF" font-size="12" font-weight="700" letter-spacing="2">&gt; awaiting_next_commit</text>
        <rect x="1025" y="-12" width="7" height="14" fill="#00F5FF" style="animation: cursorFlash2 0.8s infinite;" />
      </g>
      
    <path d="M 6 14 L 6 6 L 14 6" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 1186 6 L 1194 6 L 1194 14" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 6 56 L 6 64 L 14 64" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 1186 64 L 1194 64 L 1194 56" fill="none" stroke="#00F5FF" stroke-width="1" />
  
    
</svg>
