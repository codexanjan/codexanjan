<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="280" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes pulseGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
      @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes waveScroll { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
      @keyframes lineFade { 0%, 20% { opacity: 0; } 35%, 100% { opacity: 1; } }
      text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace; -webkit-font-smoothing: antialiased; }
      @keyframes cursorFlash { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    </style>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 245, 255, 0.08)" stroke-width="0.8"/>
      <circle cx="30" cy="0" r="0.8" fill="#00F5FF" opacity="0.3"/>
    </pattern>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>
    <linearGradient id="hud-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0.9"/>
    </linearGradient>
    
  </defs>
  <rect width="1200" height="280" fill="#04070D" />
  <rect width="1200" height="280" fill="url(#grid-pattern)" />
  
      <rect width="1200" height="280" fill="#04070D" />
      <text x="40" y="32" fill="#00F5FF" font-size="11" font-weight="800" letter-spacing="2">TERMINAL_FOOTER // CODEX_SESSION_SHUTDOWN_INHIBIT</text>
      <text x="1160" y="32" fill="#39FF88" font-size="10" font-weight="700" text-anchor="end">SESSION: PERSISTENT ●</text>
      <line x1="40" y1="42" x2="1160" y2="42" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1" />
      <g transform="translate(600, 110)" text-anchor="middle">
        <text x="0" y="0" fill="#00F5FF" font-size="28" font-weight="900" letter-spacing="8" filter="url(#glow-cyan)">CODEX://ANJAN</text>
        <text x="0" y="28" fill="#EAFBFF" font-size="15" font-weight="800" letter-spacing="4">ANJAN SHETTY // @CODEXANJAN</text>
        <text x="0" y="52" fill="#7894A6" font-size="10" letter-spacing="2">FULL-STACK DEVELOPER // AI-ML ENGINEER</text>
      </g>
      <g transform="translate(600, 195)" text-anchor="middle" font-size="10" font-weight="700">
        <text x="0" y="0" fill="#7894A6">SESSION: <tspan fill="#39FF88">ONLINE</tspan> &nbsp;|&nbsp; GITHUB NODE: <tspan fill="#00F5FF">CONNECTED</tspan> &nbsp;|&nbsp; BUILD PIPELINE: <tspan fill="#39FF88">ACTIVE</tspan></text>
        <text x="0" y="24" fill="#7894A6" font-size="9" letter-spacing="1">THANK YOU FOR ACCESSING THE OPERATING SYSTEM NODE.</text>
      </g>
      <g transform="translate(600, 250)" text-anchor="middle">
        <rect x="-180" y="-18" width="360" height="28" fill="#080D18" stroke="#00F5FF" stroke-width="1" rx="2"/>
        <text x="-140" y="0" fill="#00F5FF" font-size="11" font-weight="700" letter-spacing="2" text-anchor="start">&gt; awaiting_next_commit</text>
        <rect x="75" y="-12" width="8" height="14" fill="#00F5FF" style="animation: cursorFlash 0.8s infinite;" />
      </g>
      
    <path d="M 12 26 L 12 12 L 26 12" fill="none" stroke="#00F5FF" stroke-width="1.2" />
    <path d="M 1174 12 L 1188 12 L 1188 26" fill="none" stroke="#00F5FF" stroke-width="1.2" />
    <path d="M 12 254 L 12 268 L 26 268" fill="none" stroke="#00F5FF" stroke-width="1.2" />
    <path d="M 1174 268 L 1188 268 L 1188 254" fill="none" stroke="#00F5FF" stroke-width="1.2" />
  
    
</svg>
