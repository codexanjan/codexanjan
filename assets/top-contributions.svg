<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="contrib-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020204"/>
      <stop offset="50%" stop-color="#050509"/>
      <stop offset="100%" stop-color="#09090F"/>
    </linearGradient>

    <linearGradient id="contrib-laser-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF1B2D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1B2D"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#21D4FD"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="contrib-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Styles and Animations -->
    <style>
      .tc-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 900; }
      .tc-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
      .tc-mono { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-weight: 800; }

      @keyframes tc-laser-loop {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: -1000; }
      }
      @keyframes tc-ping-led {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.3); filter: drop-shadow(0 0 6px #00E5FF); }
      }
      @keyframes tc-scan-line {
        0% { transform: translateY(12px); opacity: 0; }
        50% { opacity: 0.7; }
        100% { transform: translateY(348px); opacity: 0; }
      }
      @keyframes tc-wave-slide {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes tc-packet-fly {
        0% { transform: translateX(0); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(450px); opacity: 0; }
      }

      .tc-border-laser { stroke-dasharray: 140 400; animation: tc-laser-loop 7s linear infinite; }
      .tc-led { transform-origin: center; animation: tc-ping-led 2s ease-in-out infinite; }
      .tc-scan { animation: tc-scanline 5.5s linear infinite; }
      .tc-wave-anim { stroke-dasharray: 12 8; animation: tc-wave-slide 2.5s linear infinite; }
      .tc-packet { animation: tc-packet-fly 3.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Dark Base Chassis -->
  <rect x="8" y="8" width="984" height="344" rx="10" fill="url(#contrib-bg)" stroke="#8B93A7" stroke-opacity="0.2" stroke-width="1.2"/>

  <!-- Cut-Corner Angular Outer Frame Base -->
  <path d="M 32 10 L 968 10 L 990 32 L 990 328 L 968 350 L 32 350 L 10 328 L 10 32 Z" fill="none" stroke="#FF1B2D" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Animated Running Laser Frame -->
  <path d="M 32 10 L 968 10 L 990 32 L 990 328 L 968 350 L 32 350 L 10 328 L 10 32 Z" fill="none" stroke="#FF1B2D" stroke-width="2.5" class="tc-border-laser" filter="url(#contrib-glow)"/>

  <!-- Animated Scanline Sweep -->
  <line x1="16" y1="0" x2="984" y2="0" stroke="url(#contrib-laser-grad)" stroke-width="1.5" class="tc-scan"/>

  <!-- Background Spider Web Geometry -->
  <g stroke="#FF1B2D" stroke-width="1" stroke-opacity="0.25" fill="none">
    <line x1="8" y1="8" x2="130" y2="70"/>
    <line x1="8" y1="8" x2="70" y2="130"/>
    <path d="M 40 25 Q 60 50 25 70"/>
  </g>
  <g stroke="#00E5FF" stroke-width="1" stroke-opacity="0.25" fill="none">
    <line x1="992" y1="352" x2="870" y2="290"/>
    <line x1="992" y1="352" x2="930" y2="230"/>
    <path d="M 960 330 Q 940 300 975 280"/>
  </g>

  <!-- Corner Brackets -->
  <path d="M 6 45 L 6 6 L 45 6" fill="none" stroke="#00E5FF" stroke-width="2.5"/>
  <path d="M 994 45 L 994 6 L 955 6" fill="none" stroke="#FF1B2D" stroke-width="2.5"/>
  <path d="M 6 315 L 6 354 L 45 354" fill="none" stroke="#00E5FF" stroke-width="2.5"/>
  <path d="M 994 315 L 994 354 L 955 354" fill="none" stroke="#FF1B2D" stroke-width="2.5"/>

  <!-- ================================================================= -->
  <!-- HEADER SECTION: BOLD, VISIBLE TYPOGRAPHY                          -->
  <!-- ================================================================= -->
  <g transform="translate(30, 24)">
    <!-- Top Left Title Badge -->
    <rect x="0" y="0" width="300" height="28" rx="4" fill="#09090F" stroke="#00E5FF" stroke-width="1.5"/>
    <circle cx="14" cy="14" r="4.5" fill="#00E5FF" class="tc-led"/>
    <text x="32" y="19" fill="#00E5FF" font-size="13" class="tc-sub" letter-spacing="1.5">SPIDER-NET // DISPATCH STREAM</text>
  </g>

  <g transform="translate(710, 24)">
    <!-- Top Right Status Node -->
    <rect x="0" y="0" width="260" height="28" rx="4" fill="#09090F" stroke="#FF1B2D" stroke-width="1.5"/>
    <circle cx="16" cy="14" r="4.5" fill="#FF1B2D" class="tc-led"/>
    <text x="32" y="19" fill="#FFFFFF" font-size="13" class="tc-sub" letter-spacing="1">SPIDER VELOCITY: HIGH</text>
  </g>

  <!-- Title Center (Spider-Verse Themed & Crisp Solid White) -->
  <g transform="translate(500, 78)" text-anchor="middle">
    <text x="0" y="0" fill="#FFFFFF" font-size="28" class="tc-title" letter-spacing="4" style="filter: drop-shadow(0 0 12px rgba(255, 27, 45, 0.7)) drop-shadow(0 0 20px rgba(0, 229, 255, 0.5));">
      SPIDER WEB DISPATCH // TOP CONTRIBUTIONS
    </text>
    <text x="0" y="26" fill="#00E5FF" font-size="13.5" class="tc-sub" letter-spacing="2.5">
      ACTIVE COMMIT VELOCITY // CANON REPOSITORIES &amp; OPERATIONS
    </text>
  </g>

  <!-- ================================================================= -->
  <!-- LEFT PANEL: TOP CONTRIBUTED REPOSITORIES (3 ROW TILES)             -->
  <!-- ================================================================= -->
  <g transform="translate(30, 126)">

    <!-- TILE 1: codexanjan/AJ-RUNNER -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="540" height="58" rx="6" fill="#09090F" stroke="#FF1B2D" stroke-width="1.4"/>
      <line x1="0" y1="0" x2="4" y2="58" stroke="#FF1B2D" stroke-width="4"/>
      <circle cx="20" cy="20" r="4" fill="#FF1B2D" class="tc-led"/>
      <text x="34" y="24" fill="#FFFFFF" font-size="15" class="tc-title" letter-spacing="1">
        codexanjan/AJ-RUNNER
      </text>
      <text x="340" y="24" fill="#00E5FF" font-size="12" class="tc-mono">[ High Commit Velocity ]</text>
      <text x="34" y="44" fill="#CBD5E1" font-size="12" class="tc-sub">
        High Velocity Arcade Game // Spider Physics &amp; WebGL Engine
      </text>
    </g>

    <!-- TILE 2: codexanjan/nexusvault -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="540" height="58" rx="6" fill="#09090F" stroke="#00E5FF" stroke-width="1.4"/>
      <line x1="0" y1="0" x2="4" y2="58" stroke="#00E5FF" stroke-width="4"/>
      <circle cx="20" cy="20" r="4" fill="#00E5FF" class="tc-led"/>
      <text x="34" y="24" fill="#FFFFFF" font-size="15" class="tc-title" letter-spacing="1">
        codexanjan/nexusvault
      </text>
      <text x="340" y="24" fill="#21D4FD" font-size="12" class="tc-mono">[ 15 Stars // Multi-Release ]</text>
      <text x="34" y="44" fill="#CBD5E1" font-size="12" class="tc-sub">
        Security Credential Vault // Encrypted Spider Architecture
      </text>
    </g>

    <!-- TILE 3: codexanjan/readme-profile -->
    <g transform="translate(0, 136)">
      <rect x="0" y="0" width="540" height="58" rx="6" fill="#09090F" stroke="#21D4FD" stroke-width="1.4"/>
      <line x1="0" y1="0" x2="4" y2="58" stroke="#21D4FD" stroke-width="4"/>
      <circle cx="20" cy="20" r="4" fill="#21D4FD" class="tc-led"/>
      <text x="34" y="24" fill="#FFFFFF" font-size="15" class="tc-title" letter-spacing="1">
        codexanjan/readme-profile
      </text>
      <text x="340" y="24" fill="#FF1744" font-size="12" class="tc-mono">[ 16 Stars // Automation ]</text>
      <text x="34" y="44" fill="#CBD5E1" font-size="12" class="tc-sub">
        Dynamic Spider-Verse Telemetry Engine // Automation Actions
      </text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT PANEL: REAL-TIME COMMIT VELOCITY & HUD TELEMETRY            -->
  <!-- ================================================================= -->
  <g transform="translate(595, 126)">
    <!-- Chassis Card -->
    <rect x="0" y="0" width="375" height="194" rx="6" fill="#09090F" stroke="#8B93A7" stroke-opacity="0.25" stroke-width="1.2"/>

    <!-- Top Card Header -->
    <rect x="0" y="0" width="375" height="32" rx="6" fill="#050509" stroke="#FF1B2D" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="16" cy="16" r="4" fill="#FF1B2D" class="tc-led"/>
    <text x="32" y="21" fill="#FFFFFF" font-size="12" class="tc-sub" letter-spacing="1.5">
      SPIDER-SENSE PULSE // REAL-TIME DISPATCH
    </text>

    <!-- Animated Telemetry Wave Stream -->
    <g transform="translate(20, 50)">
      <text x="0" y="14" fill="#00E5FF" font-size="11" class="tc-mono" letter-spacing="1">CANON COMMIT STREAM</text>
      <!-- Background Guide Lines -->
      <line x1="0" y1="36" x2="335" y2="36" stroke="#8B93A7" stroke-opacity="0.15" stroke-width="1"/>
      <line x1="0" y1="52" x2="335" y2="52" stroke="#8B93A7" stroke-opacity="0.15" stroke-width="1"/>
      <!-- Animated Wave Polyline -->
      <path d="M 0 46 Q 30 18 60 46 T 120 46 T 180 46 T 240 46 T 300 46 L 335 46" fill="none" stroke="url(#wave-grad)" stroke-width="2.5" class="tc-wave-anim" filter="url(#contrib-glow)"/>
      <!-- Floating Energy Packet -->
      <circle cx="0" cy="46" r="3" fill="#FFFFFF" class="tc-packet" filter="url(#contrib-glow)"/>
    </g>

    <!-- Telemetry Stats List -->
    <g transform="translate(20, 130)">
      <!-- Line 1: Commit Frequency -->
      <text x="0" y="14" fill="#8B93A7" font-size="11" class="tc-sub">CANON VELOCITY:</text>
      <text x="175" y="14" fill="#FFFFFF" font-size="11" class="tc-mono">DAILY SPRINT // ACTIVE</text>

      <!-- Line 2: Pipeline State -->
      <text x="0" y="34" fill="#8B93A7" font-size="11" class="tc-sub">SPIDER-NET STATUS:</text>
      <text x="175" y="34" fill="#00E5FF" font-size="11" class="tc-mono">100% PASSING // GREEN</text>

      <!-- Line 3: Branch Strategy -->
      <text x="0" y="54" fill="#8B93A7" font-size="11" class="tc-sub">MULTIVERSE TARGET:</text>
      <text x="175" y="54" fill="#FF1744" font-size="11" class="tc-mono">origin/main [OPTIMAL]</text>
    </g>
  </g>

  <!-- Bottom Accent Track Beam -->
  <line x1="30" y1="334" x2="970" y2="334" stroke="#8B93A7" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="160" y1="334" x2="840" y2="334" stroke="#FF1B2D" stroke-width="2" class="tc-border-laser"/>
</svg>
