<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes pulseGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
      @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes waveScroll { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
      @keyframes lineFade { 0%, 20% { opacity: 0; } 35%, 100% { opacity: 1; } }
      text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace; -webkit-font-smoothing: antialiased; }
      
    </style>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 245, 255, 0.08)" stroke-width="0.8"/>
      <circle cx="30" cy="0" r="0.8" fill="#00F5FF" opacity="0.3"/>
    </pattern>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>
    <linearGradient id="hud-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0.9"/>
    </linearGradient>
    
  </defs>
  <rect width="600" height="360" fill="#04070D" />
  <rect width="600" height="360" fill="url(#grid-pattern)" />
  
      <rect width="600" height="360" fill="#080D18" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1.5" />
      <rect x="0" y="0" width="600" height="40" fill="#020408" />
      <text x="25" y="25" fill="#00F5FF" font-size="12" font-weight="800" letter-spacing="2">SYSTEM_PROFILE // TELEMETRY_MATRIX</text>
      <g transform="translate(40, 75)">
        <text x="0" y="15" fill="#7894A6" font-size="10">IDENTITY</text><text x="180" y="15" fill="#EAFBFF" font-size="14" font-weight="800">ANJAN SHETTY</text><line x1="0" y1="28" x2="520" y2="28" stroke="rgba(0, 245, 255, 0.08)" stroke-width="1" />
        <text x="0" y="55" fill="#7894A6" font-size="10">GITHUB HANDLE</text><text x="180" y="55" fill="#00F5FF" font-size="13" font-weight="700">@codexanjan</text><line x1="0" y1="68" x2="520" y2="68" stroke="rgba(0, 245, 255, 0.08)" stroke-width="1" />
        <text x="0" y="95" fill="#7894A6" font-size="10">PRIMARY CLASS</text><text x="180" y="95" fill="#EAFBFF" font-size="13" font-weight="700">FULL-STACK ARCHITECTURE</text><line x1="0" y1="108" x2="520" y2="108" stroke="rgba(0, 245, 255, 0.08)" stroke-width="1" />
        <text x="0" y="135" fill="#7894A6" font-size="10">SECONDARY CLASS</text><text x="180" y="135" fill="#FF2BD6" font-size="13" font-weight="700">AI / ML ENGINEERING</text><line x1="0" y1="148" x2="520" y2="148" stroke="rgba(0, 245, 255, 0.08)" stroke-width="1" />
        <text x="0" y="175" fill="#7894A6" font-size="10">ENGINEERING MODE</text><text x="180" y="175" fill="#39FF88" font-size="12" font-weight="700">BUILD &gt; TEST &gt; SHIP &gt; EVOLVE</text><line x1="0" y1="188" x2="520" y2="188" stroke="rgba(0, 245, 255, 0.08)" stroke-width="1" />
        <text x="0" y="215" fill="#7894A6" font-size="10">SYSTEM STATUS</text><text x="180" y="215" fill="#39FF88" font-size="13" font-weight="700">ACTIVE ● READY FOR COMPLEXITY</text>
      </g>
      
    <path d="M 8 22 L 8 8 L 22 8" fill="none" stroke="#00F5FF" stroke-width="1.2" />
    <path d="M 578 8 L 592 8 L 592 22" fill="none" stroke="#00F5FF" stroke-width="1.2" />
    <path d="M 8 338 L 8 352 L 22 352" fill="none" stroke="#00F5FF" stroke-width="1.2" />
    <path d="M 578 352 L 592 352 L 592 338" fill="none" stroke="#00F5FF" stroke-width="1.2" />
  
    
</svg>
