<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes pulseGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
      @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes waveScroll { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
      @keyframes lineFade { 0%, 20% { opacity: 0; } 35%, 100% { opacity: 1; } }
      text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace; -webkit-font-smoothing: antialiased; }
      @keyframes scanBeamVertical { 0% { transform: translateY(0); opacity: 0; } 50% { opacity: 0.8; } 100% { transform: translateY(300px); opacity: 0; } }
    </style>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 245, 255, 0.08)" stroke-width="0.8"/>
      <circle cx="30" cy="0" r="0.8" fill="#00F5FF" opacity="0.3"/>
    </pattern>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>
    <linearGradient id="hud-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0.9"/>
    </linearGradient>
    
  </defs>
  <rect width="600" height="360" fill="#04070D" />
  <rect width="600" height="360" fill="url(#grid-pattern)" />
  
      <rect width="600" height="360" fill="#080D18" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1.5" />
      <rect x="0" y="0" width="600" height="40" fill="#020408" />
      <text x="25" y="25" fill="#00F5FF" font-size="12" font-weight="800" letter-spacing="2">CODEX NETWORK // DIGITAL_ID</text>
      <text x="575" y="25" fill="#39FF88" font-size="10" font-weight="700" text-anchor="end">AUTH_OK</text>
      <line x1="20" y1="45" x2="580" y2="45" stroke="#00F5FF" stroke-width="2" style="animation: scanBeamVertical 4s ease-in-out infinite;" />
      <g transform="translate(40, 75)">
        <polygon points="10,0 80,0 90,10 90,90 80,100 10,100 0,90 0,10" fill="#060A13" stroke="#00F5FF" stroke-width="1.5" />
        <text x="45" y="58" fill="#00F5FF" font-size="28" font-weight="900" text-anchor="middle" filter="url(#glow-cyan)">AS</text>
      </g>
      <g transform="translate(160, 80)">
        <text x="0" y="16" fill="#7894A6" font-size="9">IDENTITY:</text><text x="120" y="16" fill="#EAFBFF" font-size="16" font-weight="900">ANJAN SHETTY</text>
        <text x="0" y="46" fill="#7894A6" font-size="9">CALLSIGN:</text><text x="120" y="46" fill="#00F5FF" font-size="13" font-weight="700">@codexanjan</text>
        <text x="0" y="74" fill="#7894A6" font-size="9">CLASS:</text><text x="120" y="74" fill="#39FF88" font-size="12" font-weight="700">FULL-STACK DEVELOPER</text>
        <text x="0" y="102" fill="#7894A6" font-size="9">MODULE:</text><text x="120" y="102" fill="#FF2BD6" font-size="12" font-weight="700">AI / ML SYSTEMS</text>
        <text x="0" y="130" fill="#7894A6" font-size="9">STATUS:</text><text x="120" y="130" fill="#39FF88" font-size="12" font-weight="700">ONLINE ● OPERATIONAL</text>
        <text x="0" y="158" fill="#7894A6" font-size="9">CLEARANCE:</text><text x="120" y="158" fill="#00F5FF" font-size="11" font-weight="700">DEVELOPER ACCESS [LVL_09]</text>
      </g>
      <g transform="translate(25, 305)">
        <rect x="0" y="0" width="550" height="34" fill="#020408" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1" rx="2" />
        <circle cx="20" cy="17" r="4" fill="#39FF88"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/></circle>
        <text x="35" y="21" fill="#EAFBFF" font-size="10" font-weight="700" letter-spacing="2">VERIFIED DEVELOPER NODE // CERTIFIED</text>
      </g>
      
    <path d="M 8 22 L 8 8 L 22 8" fill="none" stroke="#00F5FF" stroke-width="1.2" />
    <path d="M 578 8 L 592 8 L 592 22" fill="none" stroke="#00F5FF" stroke-width="1.2" />
    <path d="M 8 338 L 8 352 L 22 352" fill="none" stroke="#00F5FF" stroke-width="1.2" />
    <path d="M 578 352 L 592 352 L 592 338" fill="none" stroke="#00F5FF" stroke-width="1.2" />
  
    
</svg>
