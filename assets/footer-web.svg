<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="foot-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020204"/>
      <stop offset="50%" stop-color="#050509"/>
      <stop offset="100%" stop-color="#020204"/>
    </linearGradient>

    <linearGradient id="foot-sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1B2D"/>
      <stop offset="35%" stop-color="#F5F7FA"/>
      <stop offset="70%" stop-color="#00A8FF"/>
      <stop offset="100%" stop-color="#21D4FD"/>
    </linearGradient>

    <filter id="fw-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .fw-mono { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, 'Fira Code', monospace; }
      @keyframes spider-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(8px); }
      }
      .hanging-spider { animation: spider-bob 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Dark Background Base -->
  <rect width="1400" height="240" fill="url(#foot-bg)"/>

  <!-- Top Accent Rail -->
  <line x1="40" y1="12" x2="1360" y2="12" stroke="#8B93A7" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="240" y1="12" x2="520" y2="12" stroke="#FF1B2D" stroke-width="2" filter="url(#fw-glow)"/>
  <line x1="880" y1="12" x2="1160" y2="12" stroke="#00A8FF" stroke-width="2" filter="url(#fw-glow)"/>

  <!-- Corner Spider Webs (Left) -->
  <g stroke="#FF1B2D" stroke-opacity="0.25" stroke-width="1.2" fill="none">
    <line x1="0" y1="240" x2="200" y2="90"/>
    <line x1="0" y1="240" x2="280" y2="150"/>
    <line x1="0" y1="240" x2="110" y2="30"/>
    <path d="M 50 215 Q 90 165 150 190"/>
    <path d="M 95 190 Q 155 110 240 155"/>
  </g>

  <!-- Corner Spider Webs (Right) -->
  <g stroke="#00A8FF" stroke-opacity="0.25" stroke-width="1.2" fill="none">
    <line x1="1400" y1="240" x2="1200" y2="90"/>
    <line x1="1400" y1="240" x2="1120" y2="150"/>
    <line x1="1400" y1="240" x2="1290" y2="30"/>
    <path d="M 1350 215 Q 1310 165 1250 190"/>
    <path d="M 1305 190 Q 1245 110 1160 155"/>
  </g>

  <!-- Hanging Original Spider Icon from Top Web Thread -->
  <g transform="translate(700, 0)" class="hanging-spider">
    <!-- Hanging Web Line -->
    <line x1="0" y1="12" x2="0" y2="44" stroke="#F5F7FA" stroke-width="1.2" stroke-opacity="0.6"/>
    <!-- Spider Glyph Body -->
    <g transform="translate(0, 52)">
      <polygon points="0,-10 6,-3 0,6 -6,-3" fill="#FF1B2D"/>
      <polygon points="0,4 5,11 0,15 -5,11" fill="#21D4FD"/>
      <!-- Legs -->
      <path d="M -4 -5 L -12 -12 L -18 -8 M 4 -5 L 12 -12 L 18 -8" stroke="#FF1B2D" stroke-width="1.2" fill="none"/>
      <path d="M -5 0 L -15 -2 L -20 3 M 5 0 L 15 -2 L 20 3" stroke="#F5F7FA" stroke-width="1.2" fill="none"/>
      <path d="M -4 6 L -13 11 L -17 17 M 4 6 L 13 11 L 17 17" stroke="#00A8FF" stroke-width="1.2" fill="none"/>
    </g>
  </g>

  <!-- Main Developer Footer Typography -->
  <g transform="translate(700, 115)" text-anchor="middle">
    <!-- Developer Name -->
    <text x="0" y="0" fill="url(#foot-sweep)" font-size="30" font-weight="900" class="fw-mono" letter-spacing="8">
      ANJAN SHETTY
    </text>

    <!-- Username & Multiverse Tag -->
    <text x="0" y="28" fill="#8B93A7" font-size="12" font-weight="700" class="fw-mono" letter-spacing="3">
      <tspan fill="#FF1B2D">@codexanjan</tspan>
      <tspan fill="#8B93A7"> // </tspan>
      <tspan fill="#21D4FD">EARTH-CODEX-01</tspan>
    </text>

    <!-- Motto -->
    <text x="0" y="56" fill="#F5F7FA" font-size="13" font-weight="800" class="fw-mono" letter-spacing="5">
      BUILD / CREATE / EVOLVE
    </text>

    <!-- Small Supporting Text -->
    <text x="0" y="78" fill="#8B93A7" font-size="10" font-weight="500" class="fw-mono" letter-spacing="2">
      Built through curiosity, code, and constant iteration.
    </text>
  </g>

  <!-- Bottom Accent Track & Endpoints -->
  <line x1="80" y1="215" x2="1320" y2="215" stroke="#8B93A7" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="80" cy="215" r="2" fill="#FF1B2D"/>
  <circle cx="1320" cy="215" r="2" fill="#00A8FF"/>
</svg>
