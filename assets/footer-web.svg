<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="foot-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020204"/>
      <stop offset="50%" stop-color="#050509"/>
      <stop offset="100%" stop-color="#020204"/>
    </linearGradient>

    <filter id="fw-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .fw-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 900; }
      .fw-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
      @keyframes spider-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(8px); }
      }
      .hanging-spider { animation: spider-bob 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Dark Background Base -->
  <rect width="1400" height="260" fill="url(#foot-bg)"/>

  <!-- Top Accent Rail -->
  <line x1="40" y1="12" x2="1360" y2="12" stroke="#8B93A7" stroke-opacity="0.2" stroke-width="1.2"/>
  <line x1="240" y1="12" x2="520" y2="12" stroke="#FF1B2D" stroke-width="3" filter="url(#fw-glow)"/>
  <line x1="880" y1="12" x2="1160" y2="12" stroke="#00A8FF" stroke-width="3" filter="url(#fw-glow)"/>

  <!-- Corner Spider Webs (Left) -->
  <g stroke="#FF1B2D" stroke-opacity="0.3" stroke-width="1.4" fill="none">
    <line x1="0" y1="260" x2="200" y2="90"/>
    <line x1="0" y1="260" x2="280" y2="160"/>
    <line x1="0" y1="260" x2="110" y2="30"/>
    <path d="M 50 235 Q 90 175 150 200"/>
    <path d="M 95 200 Q 155 120 240 165"/>
  </g>

  <!-- Corner Spider Webs (Right) -->
  <g stroke="#00A8FF" stroke-opacity="0.3" stroke-width="1.4" fill="none">
    <line x1="1400" y1="260" x2="1200" y2="90"/>
    <line x1="1400" y1="260" x2="1120" y2="160"/>
    <line x1="1400" y1="260" x2="1290" y2="30"/>
    <path d="M 1350 235 Q 1310 175 1250 200"/>
    <path d="M 1305 200 Q 1245 120 1160 165"/>
  </g>

  <!-- Hanging Original Spider Icon from Top Web Thread -->
  <g transform="translate(700, 0)" class="hanging-spider">
    <line x1="0" y1="12" x2="0" y2="46" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.7"/>
    <g transform="translate(0, 56)">
      <polygon points="0,-12 8,-4 0,8 -8,-4" fill="#FF1B2D"/>
      <polygon points="0,5 6,13 0,18 -6,13" fill="#21D4FD"/>
      <path d="M -5 -6 L -14 -14 L -20 -10 M 5 -6 L 14 -14 L 20 -10" stroke="#FF1B2D" stroke-width="1.5" fill="none"/>
      <path d="M -6 0 L -17 -3 L -22 3 M 6 0 L 17 -3 L 22 3" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
      <path d="M -5 7 L -15 13 L -19 19 M 5 7 L 15 13 L 19 19" stroke="#00A8FF" stroke-width="1.5" fill="none"/>
    </g>
  </g>

  <!-- Main Developer Footer Typography (Brilliant White & High Contrast) -->
  <g transform="translate(700, 125)" text-anchor="middle">
    <!-- Red & Blue Edge Shadows for Developer Name -->
    <text x="-2" y="2" fill="#FF1B2D" font-size="46" class="fw-title" letter-spacing="8" opacity="0.8">ANJAN SHETTY</text>
    <text x="2" y="-2" fill="#00A8FF" font-size="46" class="fw-title" letter-spacing="8" opacity="0.8">ANJAN SHETTY</text>
    <text x="0" y="0" fill="#FFFFFF" font-size="46" class="fw-title" letter-spacing="8">ANJAN SHETTY</text>

    <!-- Username & Multiverse Tag -->
    <text x="0" y="36" fill="#FFFFFF" font-size="18" class="fw-sub" letter-spacing="3">
      <tspan fill="#FF1744">@codexanjan</tspan><tspan fill="#8B93A7"> // </tspan><tspan fill="#00E5FF">EARTH-CODEX-01</tspan>
    </text>

    <!-- Motto -->
    <text x="0" y="70" fill="#FFFFFF" font-size="20" class="fw-title" letter-spacing="6">
      BUILD / CREATE / EVOLVE
    </text>

    <!-- Small Supporting Text -->
    <text x="0" y="96" fill="#E2E8F0" font-size="15" font-weight="700" class="fw-sub" letter-spacing="2">
      Built through curiosity, code, and constant iteration.
    </text>
  </g>

  <!-- Bottom Accent Track & Endpoints -->
  <line x1="80" y1="240" x2="1320" y2="240" stroke="#8B93A7" stroke-opacity="0.2" stroke-width="1.2"/>
  <circle cx="80" cy="240" r="3" fill="#FF1B2D"/>
  <circle cx="1320" cy="240" r="3" fill="#00A8FF"/>
</svg>
