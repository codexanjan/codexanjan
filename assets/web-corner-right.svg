<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="120" height="120">
  <defs>
    <filter id="corner-glow-right" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Geometric Web Strands Emanating from Top-Right (160,0) -->
  <!-- Primary Radial Strands -->
  <line x1="160" y1="0" x2="0" y2="20" stroke="#00A8FF" stroke-width="1.5" stroke-opacity="0.8" filter="url(#corner-glow-right)"/>
  <line x1="160" y1="0" x2="20" y2="60" stroke="#00A8FF" stroke-width="1.2" stroke-opacity="0.6"/>
  <line x1="160" y1="0" x2="50" y2="110" stroke="#FF1B2D" stroke-width="1.5" stroke-opacity="0.8" filter="url(#corner-glow-right)"/>
  <line x1="160" y1="0" x2="100" y2="140" stroke="#FF1B2D" stroke-width="1.2" stroke-opacity="0.6"/>
  <line x1="160" y1="0" x2="140" y2="160" stroke="#FF1B2D" stroke-width="1.5" stroke-opacity="0.8" filter="url(#corner-glow-right)"/>

  <!-- Concentric Geometric Web Bridges -->
  <!-- Ring 1 (Inner) -->
  <path d="M 120 5 L 125 15 L 132 28 L 145 35 L 155 40" fill="none" stroke="#00A8FF" stroke-width="1" stroke-opacity="0.5"/>
  <!-- Ring 2 (Middle) -->
  <path d="M 80 10 L 90 30 L 105 55 L 130 70 L 150 80" fill="none" stroke="#F5F7FA" stroke-width="1" stroke-opacity="0.4"/>
  <!-- Ring 3 (Outer) -->
  <path d="M 40 15 L 55 45 L 78 82 L 115 105 L 145 120" fill="none" stroke="#FF1B2D" stroke-width="1.2" stroke-opacity="0.6"/>
  <!-- Ring 4 (Edge Boundary) -->
  <path d="M 5 19 L 24 58 L 53 107 L 102 136 L 141 155" fill="none" stroke="#21D4FD" stroke-width="1.4" stroke-opacity="0.75"/>

  <!-- Technical Circuit Intersect Nodes -->
  <circle cx="120" cy="5" r="1.5" fill="#00A8FF"/>
  <circle cx="132" cy="28" r="2" fill="#00A8FF"/>
  <circle cx="155" cy="40" r="1.5" fill="#00A8FF"/>
  <circle cx="80" cy="10" r="2" fill="#00A8FF"/>
  <circle cx="105" cy="55" r="2.5" fill="#21D4FD"/>
  <circle cx="150" cy="80" r="2" fill="#FF1B2D"/>
  <circle cx="40" cy="15" r="2" fill="#FF1B2D"/>
  <circle cx="78" cy="82" r="2.5" fill="#21D4FD"/>
  <circle cx="145" cy="120" r="2" fill="#FF1B2D"/>
  <circle cx="5" cy="19" r="2.5" fill="#21D4FD"/>
  <circle cx="53" cy="107" r="3" fill="#21D4FD" filter="url(#corner-glow-right)"/>
  <circle cx="141" cy="155" r="2.5" fill="#21D4FD"/>

  <!-- Origin Anchor Bracket -->
  <path d="M 160 20 L 160 0 L 140 0" fill="none" stroke="#00A8FF" stroke-width="2.5"/>
</svg>
