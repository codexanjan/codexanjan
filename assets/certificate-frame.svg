<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020204"/>
      <stop offset="50%" stop-color="#050509"/>
      <stop offset="100%" stop-color="#09090F"/>
    </linearGradient>

    <filter id="cf-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="cf-scan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#21D4FD" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF1B2D" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#21D4FD" stop-opacity="0"/>
    </linearGradient>

    <style>
      .cf-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
        fill: #FFFFFF;
        filter: drop-shadow(0 0 12px rgba(33, 212, 253, 0.7)) drop-shadow(0 0 20px rgba(255, 27, 45, 0.5));
      }
      .cf-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
      }
      @keyframes cert-pulse {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; filter: drop-shadow(0 0 8px #21D4FD); }
      }
      @keyframes laser-cycle-cf {
        0% { stroke-dashoffset: 800; }
        100% { stroke-dashoffset: -800; }
      }
      @keyframes beacon-ping-cf {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.3); filter: drop-shadow(0 0 6px #00E5FF); }
      }
      @keyframes scan-horiz-cf {
        0% { transform: translateY(12px); opacity: 0; }
        50% { opacity: 0.7; }
        100% { transform: translateY(148px); opacity: 0; }
      }
      @keyframes web-shimmer-cf {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.55; }
      }
      .cf-pulse { animation: cert-pulse 3.5s ease-in-out infinite; }
      .cf-laser { stroke-dasharray: 120 400; animation: laser-cycle-cf 6s linear infinite; }
      .cf-beacon { transform-origin: center; animation: beacon-ping-cf 2s ease-in-out infinite; }
      .cf-scan { animation: scan-horiz-cf 5.2s linear infinite; }
      .cf-web { animation: web-shimmer-cf 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Dark Base Chassis -->
  <rect x="8" y="8" width="984" height="144" rx="8" fill="url(#cf-bg)" stroke="#8B93A7" stroke-opacity="0.2" stroke-width="1.2"/>

  <!-- Background Spider Web Geometry (Left & Right Flanks) -->
  <g stroke="#21D4FD" stroke-width="1" fill="none" class="cf-web">
    <line x1="8" y1="8" x2="160" y2="80"/>
    <line x1="8" y1="8" x2="80" y2="152"/>
    <path d="M 40 25 Q 70 50 25 80"/>
    <path d="M 80 50 Q 130 90 50 130"/>
  </g>
  <g stroke="#FF1B2D" stroke-width="1" fill="none" class="cf-web">
    <line x1="992" y1="8" x2="840" y2="80"/>
    <line x1="992" y1="8" x2="920" y2="152"/>
    <path d="M 960 25 Q 930 50 975 80"/>
    <path d="M 920 50 Q 870 90 950 130"/>
  </g>

  <!-- Outer Angular Shield Border Base -->
  <path d="M 30 10 L 970 10 L 990 30 L 990 130 L 970 150 L 30 150 L 10 130 L 10 30 Z" fill="none" stroke="#21D4FD" stroke-opacity="0.4" stroke-width="2"/>
  
  <!-- Animated Running Laser Beam on Frame -->
  <path d="M 30 10 L 970 10 L 990 30 L 990 130 L 970 150 L 30 150 L 10 130 L 10 30 Z" fill="none" stroke="#00E5FF" stroke-width="2.5" class="cf-laser" filter="url(#cf-glow)"/>

  <!-- Animated Scanline Sweep -->
  <line x1="20" y1="0" x2="980" y2="0" stroke="url(#cf-scan-grad)" stroke-width="1.5" class="cf-scan"/>

  <!-- Top Left Badge (Spider-Man Themed) -->
  <g transform="translate(30, 16)">
    <rect x="0" y="0" width="250" height="28" rx="4" fill="#09090F" stroke="#21D4FD" stroke-width="1.5"/>
    <circle cx="16" cy="14" r="4.5" fill="#21D4FD" class="cf-beacon" filter="url(#cf-glow)"/>
    <text x="32" y="19" fill="#FFFFFF" font-size="13" class="cf-sub" letter-spacing="1.5">ACADEMY ARCHIVE // VAULT 01</text>
  </g>

  <!-- Top Right Badge (Spider-Man Themed) -->
  <g transform="translate(720, 16)">
    <rect x="0" y="0" width="250" height="28" rx="4" fill="#09090F" stroke="#FF1B2D" stroke-width="1.5"/>
    <circle cx="16" cy="14" r="4.5" fill="#FF1B2D" class="cf-beacon" filter="url(#cf-glow)"/>
    <text x="32" y="19" fill="#FF1744" font-size="13" class="cf-sub" letter-spacing="1.5">SPIDER-NET // VERIFIED</text>
  </g>

  <!-- Corner Brackets -->
  <path d="M 4 40 L 4 6 L 40 6" fill="none" stroke="#21D4FD" stroke-width="2.5"/>
  <path d="M 996 40 L 996 6 L 960 6" fill="none" stroke="#FF1B2D" stroke-width="2.5"/>
  <path d="M 4 120 L 4 154 L 40 154" fill="none" stroke="#21D4FD" stroke-width="2.5"/>
  <path d="M 996 120 L 996 154 L 960 154" fill="none" stroke="#FF1B2D" stroke-width="2.5"/>

  <!-- Center Prominent Typography (Clean Solid White + High-Contrast Cyan Subtitle) -->
  <g transform="translate(500, 84)" text-anchor="middle">
    <!-- Single Crisp Master Title -->
    <text x="0" y="0" font-size="34" class="cf-title" letter-spacing="5">
      SPIDER-VERSE CREDENTIAL VAULT
    </text>

    <!-- Clear High-Contrast Subtitle -->
    <text x="0" y="32" fill="#21D4FD" font-size="14.5" class="cf-sub" letter-spacing="2.5">
      CANON CERTIFICATIONS // SPECIALIZED TECHNICAL MASTERY
    </text>
  </g>

  <!-- Bottom Track Beam -->
  <line x1="30" y1="136" x2="970" y2="136" stroke="#8B93A7" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="160" y1="136" x2="840" y2="136" stroke="#21D4FD" stroke-width="2" class="cf-laser"/>
</svg>
