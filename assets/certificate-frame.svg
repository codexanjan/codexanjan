<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cert-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A8FF"/>
      <stop offset="50%" stop-color="#21D4FD"/>
      <stop offset="100%" stop-color="#FF1B2D"/>
    </linearGradient>

    <filter id="cf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .cf-mono { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, 'Fira Code', monospace; }
      @keyframes cert-pulse {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px #21D4FD); }
      }
      .cf-pulse { animation: cert-pulse 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Dark Base Chassis -->
  <rect x="8" y="8" width="784" height="184" rx="6" fill="#050509" stroke="#8B93A7" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Outer Angular Shield Border -->
  <path d="M 30 10 L 770 10 L 790 30 L 790 170 L 770 190 L 30 190 L 10 170 L 10 30 Z" fill="none" stroke="url(#cert-grad)" stroke-width="1.8" class="cf-pulse"/>

  <!-- Left Security Hologram / Certificate Seal -->
  <g transform="translate(50, 100)">
    <!-- Outer Octagonal Seal -->
    <polygon points="0,-32 23,-23 32,0 23,23 0,32 -23,23 -32,0 -23,-23" fill="#09090F" stroke="#21D4FD" stroke-width="1.8" filter="url(#cf-glow)"/>
    <circle cx="0" cy="0" r="16" fill="#050509" stroke="#FF1B2D" stroke-width="1.2"/>
    <!-- Cyber Keyhole & Spider Glyph -->
    <circle cx="0" cy="-3" r="4" fill="#21D4FD"/>
    <polygon points="-3,0 3,0 5,8 -5,8" fill="#21D4FD"/>
  </g>

  <!-- Connective Trace Line -->
  <line x1="85" y1="100" x2="120" y2="100" stroke="#FF1B2D" stroke-width="1.5" stroke-dasharray="4 2"/>
  <circle cx="120" cy="100" r="2.5" fill="#FF1B2D"/>

  <!-- Corner Brackets -->
  <path d="M 4 40 L 4 6 L 40 6" fill="none" stroke="#21D4FD" stroke-width="2"/>
  <path d="M 796 40 L 796 6 L 760 6" fill="none" stroke="#FF1B2D" stroke-width="2"/>
  <path d="M 4 160 L 4 194 L 40 194" fill="none" stroke="#21D4FD" stroke-width="2"/>
  <path d="M 796 160 L 796 194 L 760 194" fill="none" stroke="#FF1B2D" stroke-width="2"/>

  <!-- Top Right Verified Credential Badge -->
  <g transform="translate(610, 16)">
    <rect x="0" y="0" width="160" height="18" rx="2" fill="#09090F" stroke="#21D4FD" stroke-width="1"/>
    <circle cx="12" cy="9" r="3" fill="#21D4FD" filter="url(#cf-glow)"/>
    <text x="86" y="12" text-anchor="middle" fill="#21D4FD" font-size="8.5" font-weight="700" class="cf-mono" letter-spacing="1">CREDENTIAL ARCHIVE</text>
  </g>

  <!-- Bottom Details Track -->
  <text x="770" y="178" text-anchor="end" fill="#8B93A7" font-size="8.5" class="cf-mono" letter-spacing="1.5">SECURITY // SHA256_AUTHENTICATED</text>
  <text x="130" y="178" fill="#8B93A7" font-size="8.5" class="cf-mono" letter-spacing="1">STATUS: CREDENTIAL_ACTIVE</text>
</svg>
