<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" width="100%" height="260" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes pulseGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
      @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes waveScroll { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
      @keyframes lineFade { 0%, 20% { opacity: 0; } 35%, 100% { opacity: 1; } }
      text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace; -webkit-font-smoothing: antialiased; }
      
    </style>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 245, 255, 0.08)" stroke-width="0.8"/>
      <circle cx="30" cy="0" r="0.8" fill="#00F5FF" opacity="0.3"/>
    </pattern>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>
    <linearGradient id="hud-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0.9"/>
    </linearGradient>
    
  </defs>
  <rect width="600" height="260" fill="#04070D" />
  <rect width="600" height="260" fill="url(#grid-pattern)" />
  
      <rect width="600" height="260" fill="#080D18" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1" />
      <text x="25" y="28" fill="#00F5FF" font-size="11" font-weight="800" letter-spacing="2">SIGNAL_STREAM_MONITOR</text>
      <g transform="translate(30, 60)">
        <text x="0" y="20" fill="#7894A6" font-size="10">DEV SIGNAL</text><line x1="120" y1="16" x2="480" y2="16" stroke="#00F5FF" stroke-width="2"/><circle cx="500" cy="16" r="4" fill="#00F5FF"/>
        <text x="0" y="55" fill="#7894A6" font-size="10">AI SIGNAL</text><line x1="120" y1="51" x2="480" y2="51" stroke="#FF2BD6" stroke-width="2"/><circle cx="500" cy="51" r="4" fill="#FF2BD6"/>
        <text x="0" y="90" fill="#7894A6" font-size="10">GITHUB SIGNAL</text><line x1="120" y1="86" x2="480" y2="86" stroke="#39FF88" stroke-width="2"/><circle cx="500" cy="86" r="4" fill="#39FF88"/>
      </g>
      
    <path d="M 8 18 L 8 8 L 18 8" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 582 8 L 592 8 L 592 18" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 8 242 L 8 252 L 18 252" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 582 252 L 592 252 L 592 242" fill="none" stroke="#00F5FF" stroke-width="1" />
  
    
</svg>
