<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="orbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090D" />
      <stop offset="50%" stop-color="#050608" />
      <stop offset="100%" stop-color="#0C0F15" />
    </linearGradient>

    <radialGradient id="orbReactorAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3038" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FF3038" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FF3038" stop-opacity="0" />
    </radialGradient>

    <filter id="orbRedGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="orbCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes orbitRotateCW {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes orbitRotateCCW {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes pulseReactorCore {
        0%, 100% { r: 22; filter: drop-shadow(0 0 6px #FF3038); }
        50% { r: 26; filter: drop-shadow(0 0 16px #FF3038); }
      }
      @keyframes edgeLaserOrb {
        0% { stroke-dashoffset: 2500; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes beaconFlicker {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.4; }
      }

      .orbit-cw-outer {
        transform-origin: 440px 145px;
        animation: orbitRotateCW 42s linear infinite;
      }
      .orbit-ccw-mid {
        transform-origin: 440px 145px;
        animation: orbitRotateCCW 28s linear infinite;
      }
      .orbit-cw-inner {
        transform-origin: 440px 145px;
        animation: orbitRotateCW 18s linear infinite;
      }
      .core-pulse {
        animation: pulseReactorCore 3s ease-in-out infinite;
      }
      .orb-edge-laser {
        stroke-dasharray: 180 2300;
        animation: edgeLaserOrb 6s linear infinite;
      }
      .beacon-live {
        animation: beaconFlicker 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="880" height="250" rx="10" fill="url(#orbBg)" stroke="#161B24" stroke-width="1.5" />
  <!-- Perimeter Animated Laser Trace -->
  <rect width="880" height="250" rx="10" fill="none" stroke="#FF3038" stroke-width="2" class="orb-edge-laser" opacity="0.9" />

  <!-- Corner Tactical Brackets -->
  <polygon points="12,12 32,12 12,32" fill="#FF3038" />
  <polygon points="868,12 848,12 868,32" fill="#FF3038" />
  <polygon points="12,238 32,238 12,218" fill="#FF3038" />
  <polygon points="868,238 848,238 868,218" fill="#FF3038" />

  <!-- Header Telemetry Bar -->
  <g transform="translate(35, 34)" font-family="'Courier New', Consolas, monospace">
    <polygon points="0,0 8,0 4,8" fill="#FF3038" />
    <text x="14" y="6" font-size="11" font-weight="900" fill="#FF3038" letter-spacing="2">TECH STACK // ORBITING DYNAMICS</text>
    <circle cx="560" cy="2" r="3.5" fill="#42FF9E" class="beacon-live" />
    <text x="572" y="6" font-size="9.5" font-weight="700" fill="#55E6FF" letter-spacing="1.5">ORBITAL HARMONICS // 8 NODES LOCKED</text>
    <line x1="0" y1="16" x2="810" y2="16" stroke="#151A23" stroke-width="1.2" />
  </g>

  <!-- ======================================================== -->
  <!-- ORBITAL DYNAMICS SYSTEM CENTER: (440, 145)               -->
  <!-- ======================================================== -->
  <!-- Center Ambient Radiant Aura -->
  <ellipse cx="440" cy="145" rx="270" ry="85" fill="url(#orbReactorAura)" />

  <!-- Orbit Ring 3: Outer Track (rx=260, ry=72) -->
  <ellipse cx="440" cy="145" rx="260" ry="72" fill="none" stroke="#1C2330" stroke-width="1.2" stroke-dasharray="6 8" />
  <!-- Orbit Ring 2: Mid Track (rx=175, ry=48) -->
  <ellipse cx="440" cy="145" rx="175" ry="48" fill="none" stroke="#222B3B" stroke-width="1.2" stroke-dasharray="4 6" />
  <!-- Orbit Ring 1: Inner Track (rx=105, ry=28) -->
  <ellipse cx="440" cy="145" rx="105" ry="28" fill="none" stroke="#283346" stroke-width="1.2" />

  <!-- Orbit Coordinate Radial Cross-hairs -->
  <line x1="170" y1="145" x2="710" y2="145" stroke="#141922" stroke-width="1" stroke-dasharray="3 5" />
  <line x1="440" y1="65" x2="440" y2="225" stroke="#141922" stroke-width="1" stroke-dasharray="3 5" />

  <!-- ======================================================== -->
  <!-- LAYER 1: OUTER ORBIT SATELLITES (CW ROTATION, rx=260, ry=72) -->
  <!-- ======================================================== -->
  <g class="orbit-cw-outer">
    <!-- Node 1: TypeScript (Top) -->
    <g transform="translate(440, 73)">
      <rect x="-42" y="-12" width="84" height="24" rx="12" fill="#0C0E14" stroke="#55E6FF" stroke-width="1.5" filter="url(#orbCyanGlow)" />
      <circle cx="-26" cy="0" r="4" fill="#55E6FF" />
      <text x="-16" y="4" font-family="'Courier New', monospace" font-size="10" font-weight="900" fill="#FFF" letter-spacing="1">TS • 40%</text>
    </g>

    <!-- Node 2: Python (Bottom-Right) -->
    <g transform="translate(665, 181)">
      <rect x="-40" y="-12" width="80" height="24" rx="12" fill="#0C0E14" stroke="#FACC15" stroke-width="1.5" />
      <circle cx="-25" cy="0" r="4" fill="#FACC15" />
      <text x="-15" y="4" font-family="'Courier New', monospace" font-size="10" font-weight="900" fill="#FFF" letter-spacing="1">PY • 28%</text>
    </g>

    <!-- Node 3: React & Next.js (Bottom-Left) -->
    <g transform="translate(215, 181)">
      <rect x="-44" y="-12" width="88" height="24" rx="12" fill="#0C0E14" stroke="#61DAFB" stroke-width="1.5" filter="url(#orbCyanGlow)" />
      <circle cx="-28" cy="0" r="4" fill="#61DAFB" />
      <text x="-18" y="4" font-family="'Courier New', monospace" font-size="9.5" font-weight="900" fill="#FFF" letter-spacing="0.5">REACT ⚛️</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- LAYER 2: MID ORBIT SATELLITES (CCW ROTATION, rx=175, ry=48) -->
  <!-- ======================================================== -->
  <g class="orbit-ccw-mid">
    <!-- Node 4: Node.js (Right) -->
    <g transform="translate(615, 145)">
      <rect x="-38" y="-11" width="76" height="22" rx="11" fill="#0C0E14" stroke="#42FF9E" stroke-width="1.4" />
      <circle cx="-24" cy="0" r="3.5" fill="#42FF9E" />
      <text x="-14" y="4" font-family="'Courier New', monospace" font-size="9.5" font-weight="900" fill="#FFF">NODE 🚀</text>
    </g>

    <!-- Node 5: Docker (Left) -->
    <g transform="translate(265, 145)">
      <rect x="-40" y="-11" width="80" height="22" rx="11" fill="#0C0E14" stroke="#00B4D8" stroke-width="1.4" />
      <circle cx="-25" cy="0" r="3.5" fill="#00B4D8" />
      <text x="-15" y="4" font-family="'Courier New', monospace" font-size="9.5" font-weight="900" fill="#FFF">DOCKER</text>
    </g>

    <!-- Node 6: MongoDB & SQL (Top-Right) -->
    <g transform="translate(564, 111)">
      <rect x="-34" y="-10" width="68" height="20" rx="10" fill="#0C0E14" stroke="#55E6FF" stroke-width="1.2" />
      <circle cx="-22" cy="0" r="3" fill="#55E6FF" />
      <text x="-12" y="3.5" font-family="'Courier New', monospace" font-size="8.5" font-weight="800" fill="#FFF">MONGO</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- LAYER 3: INNER ORBIT SATELLITES (CW ROTATION, rx=105, ry=28) -->
  <!-- ======================================================== -->
  <g class="orbit-cw-inner">
    <!-- Node 7: C++ (Bottom) -->
    <g transform="translate(440, 173)">
      <rect x="-30" y="-10" width="60" height="20" rx="10" fill="#0C0E14" stroke="#FF3038" stroke-width="1.2" />
      <circle cx="-18" cy="0" r="3" fill="#FF3038" />
      <text x="-8" y="3.5" font-family="'Courier New', monospace" font-size="8.5" font-weight="800" fill="#FFF">C++ 🛡️</text>
    </g>

    <!-- Node 8: JavaScript (Top) -->
    <g transform="translate(440, 117)">
      <rect x="-30" y="-10" width="60" height="20" rx="10" fill="#0C0E14" stroke="#FACC15" stroke-width="1.2" />
      <circle cx="-18" cy="0" r="3" fill="#FACC15" />
      <text x="-8" y="3.5" font-family="'Courier New', monospace" font-size="8.5" font-weight="800" fill="#FFF">JS • 14%</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- CENTRAL SAMURAI CORE REACTOR                             -->
  <!-- ======================================================== -->
  <g transform="translate(440, 145)">
    <!-- Outer Runic Ring -->
    <circle cx="0" cy="0" r="34" fill="none" stroke="#222834" stroke-width="1.2" stroke-dasharray="4 6" />
    <circle cx="0" cy="0" r="28" fill="none" stroke="#FF3038" stroke-width="1.5" stroke-dasharray="6 8" />
    
    <!-- Central Pulsing Glow Core -->
    <circle cx="0" cy="0" r="22" fill="#0B0D12" stroke="#FF3038" stroke-width="2.5" class="core-pulse" />
    
    <!-- Samurai Katana Cross Crest in Center -->
    <polygon points="0,-11 7,-3 9,5 0,11 -9,5 -7,-3" fill="#141822" stroke="#FFFFFF" stroke-width="1.2" />
    <line x1="-7" y1="7" x2="7" y2="-7" stroke="#FF3038" stroke-width="2" />
    <line x1="-7" y1="-7" x2="7" y2="7" stroke="#55E6FF" stroke-width="1.5" />
    <circle cx="0" cy="0" r="2.5" fill="#FACC15" />
  </g>

  <!-- Bottom Left & Right Sub-Telemetry -->
  <g transform="translate(35, 230)" font-family="'Courier New', Consolas, monospace" font-size="9" fill="#6A7280" letter-spacing="1">
    <text x="0" y="0">&gt; TS • PY • REACT • NODE • DOCKER • MONGO • C++ • JS</text>
    <text x="590" y="0" fill="#55E6FF" font-weight="700">&gt; GRAVITATIONAL LOCK: OPTIMAL</text>
  </g>
</svg>
