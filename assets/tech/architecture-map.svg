<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" height="260" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes pulseGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
      @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes waveScroll { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
      @keyframes lineFade { 0%, 20% { opacity: 0; } 35%, 100% { opacity: 1; } }
      text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace; -webkit-font-smoothing: antialiased; }
      
    </style>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 245, 255, 0.08)" stroke-width="0.8"/>
      <circle cx="30" cy="0" r="0.8" fill="#00F5FF" opacity="0.3"/>
    </pattern>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>
    <linearGradient id="hud-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0.9"/>
    </linearGradient>
    
  </defs>
  <rect width="1200" height="260" fill="#04070D" />
  <rect width="1200" height="260" fill="url(#grid-pattern)" />
  
      <rect width="1200" height="260" fill="#04070D" />
      <text x="40" y="32" fill="#00F5FF" font-size="11" font-weight="800" letter-spacing="2">SYSTEM_ARCHITECTURE_MAP // GENERIC_MODERN_STACK</text>
      <g transform="translate(40, 80)">
        <g transform="translate(0, 0)"><rect width="130" height="70" fill="#080D18" stroke="#00F5FF" rx="2" /><text x="14" y="26" fill="#00F5FF" font-size="10" font-weight="800">CLIENT</text><text x="14" y="46" fill="#EAFBFF" font-size="10">Web / Mobile</text></g>
        <g transform="translate(160, 0)"><rect width="130" height="70" fill="#080D18" stroke="#00F5FF" rx="2" /><text x="14" y="26" fill="#00F5FF" font-size="10" font-weight="800">FRONTEND</text><text x="14" y="46" fill="#EAFBFF" font-size="10">React / Next.js</text></g>
        <g transform="translate(320, 0)"><rect width="130" height="70" fill="#080D18" stroke="#3A86FF" rx="2" /><text x="14" y="26" fill="#3A86FF" font-size="10" font-weight="800">API GATEWAY</text><text x="14" y="46" fill="#EAFBFF" font-size="10">Auth &amp; Routing</text></g>
        <g transform="translate(480, 0)"><rect width="140" height="70" fill="#080D18" stroke="#3A86FF" rx="2" /><text x="14" y="26" fill="#3A86FF" font-size="10" font-weight="800">BACKEND</text><text x="14" y="46" fill="#EAFBFF" font-size="10">Node / FastAPI</text></g>
        <g transform="translate(650, 0)"><rect width="130" height="70" fill="#080D18" stroke="#39FF88" rx="2" /><text x="14" y="26" fill="#39FF88" font-size="10" font-weight="800">DATABASE</text><text x="14" y="46" fill="#EAFBFF" font-size="10">Postgres / Mongo</text></g>
        <g transform="translate(810, 0)"><rect width="140" height="70" fill="#080D18" stroke="#FF2BD6" rx="2" /><text x="14" y="26" fill="#FF2BD6" font-size="10" font-weight="800">AI / ML CORE</text><text x="14" y="46" fill="#EAFBFF" font-size="10">Model Inference</text></g>
        <g transform="translate(980, 0)"><rect width="140" height="70" fill="#080D18" stroke="#39FF88" rx="2" /><text x="14" y="26" fill="#39FF88" font-size="10" font-weight="800">CLOUD DEPLOY</text><text x="14" y="46" fill="#EAFBFF" font-size="10">Docker / Vercel</text></g>
      </g>
      
    <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 1176 12 L 1188 12 L 1188 24" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 12 236 L 12 248 L 24 248" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 1176 248 L 1188 248 L 1188 236" fill="none" stroke="#00F5FF" stroke-width="1" />
  
    
</svg>
