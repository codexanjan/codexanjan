<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="340" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes pulseGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
      @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes waveScroll { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
      @keyframes lineFade { 0%, 20% { opacity: 0; } 35%, 100% { opacity: 1; } }
      text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace; -webkit-font-smoothing: antialiased; }
      
    </style>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 245, 255, 0.08)" stroke-width="0.8"/>
      <circle cx="30" cy="0" r="0.8" fill="#00F5FF" opacity="0.3"/>
    </pattern>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>
    <linearGradient id="hud-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0.9"/>
    </linearGradient>
    
  </defs>
  <rect width="600" height="340" fill="#04070D" />
  <rect width="600" height="340" fill="url(#grid-pattern)" />
  
      <rect width="600" height="340" fill="#080D18" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1" />
      <text x="25" y="28" fill="#00F5FF" font-size="11" font-weight="800" letter-spacing="2">LANGUAGE_ORBIT // CORE_SYNAPSE</text>
      <g transform="translate(300, 180)">
        <circle cx="0" cy="0" r="100" fill="none" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1" stroke-dasharray="4 4"/>
        <circle cx="0" cy="0" r="40" fill="#020408" stroke="#00F5FF" stroke-width="1.5"/>
        <text x="0" y="4" fill="#00F5FF" font-size="10" font-weight="800" text-anchor="middle">CODEX CORE</text>
        <g transform="translate(0, -100)"><circle cx="0" cy="0" r="12" fill="#080D18" stroke="#00F5FF" stroke-width="1.2"/><text x="0" y="3" fill="#EAFBFF" font-size="8" font-weight="700" text-anchor="middle">TS</text></g>
        <g transform="translate(95, -31)"><circle cx="0" cy="0" r="12" fill="#080D18" stroke="#3A86FF" stroke-width="1.2"/><text x="0" y="3" fill="#EAFBFF" font-size="8" font-weight="700" text-anchor="middle">JS</text></g>
        <g transform="translate(59, 81)"><circle cx="0" cy="0" r="12" fill="#080D18" stroke="#39FF88" stroke-width="1.2"/><text x="0" y="3" fill="#EAFBFF" font-size="8" font-weight="700" text-anchor="middle">PY</text></g>
      </g>
      
    <path d="M 8 18 L 8 8 L 18 8" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 582 8 L 592 8 L 592 18" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 8 322 L 8 332 L 18 332" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 582 332 L 592 332 L 592 322" fill="none" stroke="#00F5FF" stroke-width="1" />
  
    
</svg>
