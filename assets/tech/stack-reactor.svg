<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" width="100%" height="460" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes pulseGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
      @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes waveScroll { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
      @keyframes lineFade { 0%, 20% { opacity: 0; } 35%, 100% { opacity: 1; } }
      text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace; -webkit-font-smoothing: antialiased; }
      
    </style>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 245, 255, 0.08)" stroke-width="0.8"/>
      <circle cx="30" cy="0" r="0.8" fill="#00F5FF" opacity="0.3"/>
    </pattern>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>
    <linearGradient id="hud-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0.9"/>
    </linearGradient>
    
  </defs>
  <rect width="600" height="460" fill="#04070D" />
  <rect width="600" height="460" fill="url(#grid-pattern)" />
  
      <rect width="600" height="460" fill="#04070D" />
      <text x="30" y="32" fill="#00F5FF" font-size="11" font-weight="800" letter-spacing="2">STACK_REACTOR // FULL-STACK_PIPELINE</text>
      <line x1="30" y1="42" x2="570" y2="42" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1" />
      <g transform="translate(40, 60)">
        <rect x="0" y="0" width="520" height="40" fill="#080D18" stroke="#00F5FF" rx="2"/><text x="16" y="24" fill="#EAFBFF" font-size="11" font-weight="700">USER INTERFACE // REACT • NEXT.JS</text>
      </g>
      <g transform="translate(40, 115)">
        <rect x="0" y="0" width="520" height="40" fill="#080D18" stroke="#3A86FF" rx="2"/><text x="16" y="24" fill="#EAFBFF" font-size="11" font-weight="700">API GATEWAY // REST • GRAPHQL</text>
      </g>
      <g transform="translate(40, 170)">
        <rect x="0" y="0" width="520" height="40" fill="#080D18" stroke="#3A86FF" rx="2"/><text x="16" y="24" fill="#EAFBFF" font-size="11" font-weight="700">BACKEND RUNTIME // NODE.JS • FASTAPI</text>
      </g>
      <g transform="translate(40, 225)">
        <rect x="0" y="0" width="520" height="40" fill="#080D18" stroke="#39FF88" rx="2"/><text x="16" y="24" fill="#EAFBFF" font-size="11" font-weight="700">DATABASE &amp; CACHE // POSTGRES • MONGO • REDIS</text>
      </g>
      <g transform="translate(40, 280)">
        <rect x="0" y="0" width="520" height="40" fill="#080D18" stroke="#FF2BD6" rx="2"/><text x="16" y="24" fill="#EAFBFF" font-size="11" font-weight="700">AI CORE // PYTORCH • TENSORS • INFERENCE</text>
      </g>
      <g transform="translate(40, 335)">
        <rect x="0" y="0" width="520" height="40" fill="#080D18" stroke="#39FF88" rx="2"/><text x="16" y="24" fill="#EAFBFF" font-size="11" font-weight="700">DEPLOYMENT // DOCKER • VERCEL • CI/CD</text>
      </g>
      
    <path d="M 10 20 L 10 10 L 20 10" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 580 10 L 590 10 L 590 20" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 10 440 L 10 450 L 20 450" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 580 450 L 590 450 L 590 440" fill="none" stroke="#00F5FF" stroke-width="1" />
  
    
</svg>
