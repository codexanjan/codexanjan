<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="100%" height="520" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes pulseGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
      @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes waveScroll { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
      @keyframes lineFade { 0%, 20% { opacity: 0; } 35%, 100% { opacity: 1; } }
      text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace; -webkit-font-smoothing: antialiased; }
      
    </style>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 245, 255, 0.08)" stroke-width="0.8"/>
      <circle cx="30" cy="0" r="0.8" fill="#00F5FF" opacity="0.3"/>
    </pattern>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>
    <linearGradient id="hud-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0.9"/>
    </linearGradient>
    
  </defs>
  <rect width="600" height="520" fill="#04070D" />
  <rect width="600" height="520" fill="url(#grid-pattern)" />
  
      <rect width="600" height="520" fill="#04070D" />
      <text x="30" y="32" fill="#00F5FF" font-size="11" font-weight="800" letter-spacing="2">NEURAL_TECH_ORBIT // SPHERES</text>
      <line x1="30" y1="42" x2="570" y2="42" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1" />
      <g transform="translate(300, 270)">
        <circle cx="0" cy="0" r="190" fill="none" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1" stroke-dasharray="6 6"/>
        <circle cx="0" cy="0" r="145" fill="none" stroke="rgba(58, 134, 255, 0.35)" stroke-width="1" stroke-dasharray="4 8"/>
        <circle cx="0" cy="0" r="105" fill="none" stroke="#FF2BD6" stroke-width="1" stroke-dasharray="5 5" opacity="0.6"/>
        <circle cx="0" cy="0" r="65" fill="none" stroke="#39FF88" stroke-width="1" stroke-dasharray="3 3"/>
        <text x="0" y="-195" fill="#00F5FF" font-size="9" font-weight="700" text-anchor="middle">ORBIT 1 // FRONTEND</text>
        <text x="0" y="-150" fill="#3A86FF" font-size="9" font-weight="700" text-anchor="middle">ORBIT 2 // BACKEND</text>
        <text x="0" y="-110" fill="#FF2BD6" font-size="9" font-weight="700" text-anchor="middle">ORBIT 3 // AI-ML</text>
        <text x="0" y="-70" fill="#39FF88" font-size="9" font-weight="700" text-anchor="middle">ORBIT 4 // DATA</text>
        <circle cx="0" cy="0" r="32" fill="#080D18" stroke="#00F5FF" stroke-width="1.8" />
        <text x="0" y="-2" fill="#EAFBFF" font-size="8" font-weight="800" text-anchor="middle">ANJAN</text>
        <text x="0" y="11" fill="#00F5FF" font-size="8" font-weight="700" text-anchor="middle">DEV CORE</text>
      </g>
      
    <path d="M 10 22 L 10 10 L 22 10" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 578 10 L 590 10 L 590 22" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 10 498 L 10 510 L 22 510" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 578 510 L 590 510 L 590 498" fill="none" stroke="#00F5FF" stroke-width="1" />
  
    
</svg>
