<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="520" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes pulseGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
      @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes waveScroll { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
      @keyframes lineFade { 0%, 20% { opacity: 0; } 35%, 100% { opacity: 1; } }
      text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace; -webkit-font-smoothing: antialiased; }
      
    </style>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 245, 255, 0.08)" stroke-width="0.8"/>
      <circle cx="30" cy="0" r="0.8" fill="#00F5FF" opacity="0.3"/>
    </pattern>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>
    <linearGradient id="hud-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0.9"/>
    </linearGradient>
    
  </defs>
  <rect width="1200" height="520" fill="#04070D" />
  <rect width="1200" height="520" fill="url(#grid-pattern)" />
  
      <rect width="1200" height="520" fill="#04070D" />
      <text x="40" y="35" fill="#00F5FF" font-size="12" font-weight="800" letter-spacing="2">NEURAL_CONSTELLATION // ACTIVE_TECH_ARSENAL</text>
      <text x="1160" y="35" fill="#39FF88" font-size="10" font-weight="700" text-anchor="end" letter-spacing="1">TOPOLOGY: MESH_SYNAPSE</text>
      <line x1="40" y1="46" x2="1160" y2="46" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1" />

      <g transform="translate(600, 260)">
        <line x1="0" y1="0" x2="-350" y2="-120" stroke="#00F5FF" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.6"/>
        <line x1="0" y1="0" x2="350" y2="-120" stroke="#00F5FF" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.6"/>
        <line x1="0" y1="0" x2="-350" y2="120" stroke="#3A86FF" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.6"/>
        <line x1="0" y1="0" x2="350" y2="120" stroke="#FF2BD6" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.6"/>
        <polygon points="0,-45 40,-22 40,22 0,45 -40,22 -40,-22" fill="#080D18" stroke="#00F5FF" stroke-width="2" />
        <text x="0" y="-5" fill="#EAFBFF" font-size="11" font-weight="900" text-anchor="middle">ANJAN</text>
        <text x="0" y="14" fill="#00F5FF" font-size="10" font-weight="700" text-anchor="middle">DEV CORE</text>
      </g>

      <g transform="translate(250, 140)"><polygon points="0,-20 120,-20 130,-10 130,50 120,60 0,60" fill="#080D18" stroke="#00F5FF" stroke-width="1.2" /><text x="14" y="0" fill="#00F5FF" font-size="10" font-weight="800">FRONTEND</text><text x="14" y="22" fill="#EAFBFF" font-size="11" font-weight="700">TypeScript • React</text><text x="14" y="42" fill="#7894A6" font-size="10">Next.js • TailwindCSS</text></g>
      <g transform="translate(950, 140)"><polygon points="-130,-20 -10,-20 0,-10 0,50 -10,60 -130,60" fill="#080D18" stroke="#3A86FF" stroke-width="1.2" /><text x="-116" y="0" fill="#3A86FF" font-size="10" font-weight="800">BACKEND</text><text x="-116" y="22" fill="#EAFBFF" font-size="11" font-weight="700">Node.js • Express</text><text x="-116" y="42" fill="#7894A6" font-size="10">FastAPI • Python</text></g>
      <g transform="translate(950, 380)"><polygon points="-140,-20 -10,-20 0,-10 0,50 -10,60 -140,60" fill="#080D18" stroke="#FF2BD6" stroke-width="1.2" /><text x="-126" y="0" fill="#FF2BD6" font-size="10" font-weight="800">AI // ML CORE</text><text x="-126" y="22" fill="#EAFBFF" font-size="11" font-weight="700">PyTorch • Scikit-Learn</text><text x="-126" y="42" fill="#7894A6" font-size="10">LLMs • HuggingFace</text></g>
      <g transform="translate(250, 380)"><polygon points="0,-20 130,-20 140,-10 140,50 130,60 0,60" fill="#080D18" stroke="#39FF88" stroke-width="1.2" /><text x="14" y="0" fill="#39FF88" font-size="10" font-weight="800">DATA MATRIX</text><text x="14" y="22" fill="#EAFBFF" font-size="11" font-weight="700">PostgreSQL • MongoDB</text><text x="14" y="42" fill="#7894A6" font-size="10">Supabase • Redis</text></g>
      <g transform="translate(600, 90)"><rect x="-90" y="-18" width="180" height="36" fill="#080D18" stroke="#39FF88" stroke-width="1.2" rx="2" /><text x="0" y="4" fill="#39FF88" font-size="10" font-weight="800" text-anchor="middle">DOCKER • GIT • VERCEL</text></g>
      <g transform="translate(600, 430)"><rect x="-90" y="-18" width="180" height="36" fill="#080D18" stroke="#00F5FF" stroke-width="1.2" rx="2" /><text x="0" y="4" fill="#00F5FF" font-size="10" font-weight="800" text-anchor="middle">REST • GRAPHQL • CI/CD</text></g>
      
    <path d="M 12 28 L 12 12 L 28 12" fill="none" stroke="#00F5FF" stroke-width="1.2" />
    <path d="M 1172 12 L 1188 12 L 1188 28" fill="none" stroke="#00F5FF" stroke-width="1.2" />
