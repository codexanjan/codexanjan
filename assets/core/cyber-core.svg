<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes pulseGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
      @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes waveScroll { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
      @keyframes lineFade { 0%, 20% { opacity: 0; } 35%, 100% { opacity: 1; } }
      text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace; -webkit-font-smoothing: antialiased; }
      @keyframes spinSlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 245, 255, 0.08)" stroke-width="0.8"/>
      <circle cx="30" cy="0" r="0.8" fill="#00F5FF" opacity="0.3"/>
    </pattern>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>
    <linearGradient id="hud-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0.9"/>
    </linearGradient>
    
  </defs>
  <rect width="600" height="500" fill="#04070D" />
  <rect width="600" height="500" fill="url(#grid-pattern)" />
  
      <rect width="600" height="500" fill="#04070D" />
      <text x="30" y="32" fill="#00F5FF" font-size="11" font-weight="700" letter-spacing="2">REACTOR_CORE // CODEX://AS01</text>
      <text x="570" y="32" fill="#39FF88" font-size="10" font-weight="700" text-anchor="end" letter-spacing="1">STATE: CRITICAL_EFFICIENCY</text>
      <line x1="30" y1="42" x2="570" y2="42" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1" />
      <g transform="translate(300, 260)">
        <circle cx="0" cy="0" r="180" fill="none" stroke="rgba(0, 245, 255, 0.08)" stroke-width="1" />
        <g style="animation: spinSlow 30s linear infinite;">
          <circle cx="0" cy="0" r="180" fill="none" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1.5" stroke-dasharray="40 80" />
          <circle cx="180" cy="0" r="4" fill="#00F5FF" /><circle cx="-180" cy="0" r="4" fill="#00F5FF" />
        </g>
        <circle cx="0" cy="0" r="140" fill="none" stroke="#3A86FF" stroke-width="1.8" stroke-dasharray="20 40" />
        <circle cx="0" cy="0" r="95" fill="none" stroke="#00F5FF" stroke-width="2.2" stroke-dasharray="60 30" />
        <circle cx="0" cy="0" r="60" fill="#080D18" stroke="#00F5FF" stroke-width="2" />
        <text x="0" y="10" fill="#FFFFFF" font-size="30" font-weight="900" text-anchor="middle" letter-spacing="4" filter="url(#glow-cyan)">AS</text>
        <text x="0" y="-115" fill="#00F5FF" font-size="10" font-weight="700" text-anchor="middle">DEV</text>
        <text x="115" y="-40" fill="#EAFBFF" font-size="10" font-weight="700" text-anchor="middle">AI</text>
        <text x="115" y="60" fill="#39FF88" font-size="10" font-weight="700" text-anchor="middle">ML</text>
        <text x="0" y="125" fill="#00F5FF" font-size="10" font-weight="700" text-anchor="middle">SYSTEMS</text>
        <text x="-115" y="60" fill="#FF2BD6" font-size="10" font-weight="700" text-anchor="middle">CODEX</text>
        <text x="-115" y="-40" fill="#EAFBFF" font-size="10" font-weight="700" text-anchor="middle">ANJAN</text>
      </g>
      <text x="30" y="475" fill="#7894A6" font-size="9">CORE TEMP: <tspan fill="#00F5FF">34.8°C</tspan> | NEURAL LINK: <tspan fill="#39FF88">ACTIVE</tspan> | DEV ENGINE: <tspan fill="#00F5FF">ONLINE</tspan></text>
      
    <path d="M 10 22 L 10 10 L 22 10" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 578 10 L 590 10 L 590 22" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 10 478 L 10 490 L 22 490" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 578 490 L 590 490 L 590 478" fill="none" stroke="#00F5FF" stroke-width="1" />
  
    
</svg>
