<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="300" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes pulseGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
      @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes waveScroll { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
      @keyframes lineFade { 0%, 20% { opacity: 0; } 35%, 100% { opacity: 1; } }
      text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace; -webkit-font-smoothing: antialiased; }
      
    </style>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 245, 255, 0.08)" stroke-width="0.8"/>
      <circle cx="30" cy="0" r="0.8" fill="#00F5FF" opacity="0.3"/>
    </pattern>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>
    <linearGradient id="hud-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0.9"/>
    </linearGradient>
    
  </defs>
  <rect width="600" height="300" fill="#04070D" />
  <rect width="600" height="300" fill="url(#grid-pattern)" />
  
      <rect width="600" height="300" fill="#04070D" />
      <text x="25" y="28" fill="#39FF88" font-size="11" font-weight="700" letter-spacing="2">NEURAL_SYNAPSE_GRID // TOPOLOGY</text>
      <g transform="translate(50, 60)">
        <circle cx="50" cy="50" r="8" fill="#00F5FF" /><circle cx="50" cy="150" r="8" fill="#00F5FF" />
        <circle cx="250" cy="30" r="8" fill="#3A86FF" /><circle cx="250" cy="100" r="8" fill="#3A86FF" /><circle cx="250" cy="170" r="8" fill="#3A86FF" />
        <circle cx="450" cy="70" r="8" fill="#39FF88" /><circle cx="450" cy="130" r="8" fill="#39FF88" />
        <line x1="50" y1="50" x2="250" y2="30" stroke="#00F5FF" stroke-width="1" opacity="0.6"/>
        <line x1="50" y1="150" x2="250" y2="100" stroke="#00F5FF" stroke-width="1" opacity="0.6"/>
        <line x1="250" y1="100" x2="450" y2="70" stroke="#39FF88" stroke-width="1" opacity="0.6"/>
      </g>
      <text x="25" y="275" fill="#7894A6" font-size="9">TOPOLOGY: FEED-FORWARD MULTI-LAYER NEURAL NET</text>
      
    <path d="M 10 20 L 10 10 L 20 10" fill="none" stroke="#39FF88" stroke-width="1" />
    <path d="M 580 10 L 590 10 L 590 20" fill="none" stroke="#39FF88" stroke-width="1" />
    <path d="M 10 280 L 10 290 L 20 290" fill="none" stroke="#39FF88" stroke-width="1" />
    <path d="M 580 290 L 590 290 L 590 280" fill="none" stroke="#39FF88" stroke-width="1" />
  
    
</svg>
