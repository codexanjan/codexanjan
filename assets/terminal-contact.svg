<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0D" />
      <stop offset="50%" stop-color="#06080A" />
      <stop offset="100%" stop-color="#0E1218" />
    </linearGradient>
    <filter id="termGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes promptBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .t-cursor { animation: promptBlink 1.1s infinite; }
    </style>
  </defs>

  <rect width="800" height="300" rx="10" fill="url(#termBg)" stroke="#171B21" stroke-width="1.5" />
  <polygon points="12,12 28,12 12,28" fill="#FF3038" />
  <polygon points="788,288 772,288 788,272" fill="#FF3038" />

  <!-- Terminal Top Window Header -->
  <g transform="translate(30, 32)">
    <circle cx="0" cy="0" r="4" fill="#FF3038" />
    <circle cx="14" cy="0" r="4" fill="#F4C95D" />
    <circle cx="28" cy="0" r="4" fill="#42FF9E" />
    <text x="50" y="4" font-family="'Courier New', Consolas, monospace" font-size="12" font-weight="700" fill="#A8ADB7" letter-spacing="2">RONIN TERMINAL // SECURE CHANNEL 0xCC</text>
    <line x1="0" y1="16" x2="740" y2="16" stroke="#171B21" stroke-width="1" />
  </g>

  <!-- Terminal Dialogue Commands & Outputs -->
  <g transform="translate(45, 78)" font-family="'Courier New', Consolas, monospace">
    <!-- Prompt 1: identity -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" font-size="13" font-weight="700" fill="#FF3038">&gt; identity</text>
      <text x="0" y="22" font-size="16" font-weight="900" fill="#F4F4F2" letter-spacing="2">ANJAN SHETTY</text>
    </g>

    <!-- Prompt 2: role -->
    <g transform="translate(0, 52)">
      <text x="0" y="0" font-size="13" font-weight="700" fill="#FF3038">&gt; role</text>
      <text x="0" y="20" font-size="14" font-weight="700" fill="#A8ADB7">FULL-STACK DEVELOPER // <tspan fill="#55E6FF">AI-ML ENGINEER</tspan></text>
    </g>

    <!-- Prompt 3: github -->
    <g transform="translate(0, 104)">
      <text x="0" y="0" font-size="13" font-weight="700" fill="#FF3038">&gt; github</text>
      <text x="0" y="20" font-size="14" font-weight="700" fill="#55E6FF">github.com/codexanjan</text>
    </g>

    <!-- Prompt 4: status -->
    <g transform="translate(0, 156)">
      <text x="0" y="0" font-size="13" font-weight="700" fill="#FF3038">&gt; status</text>
      <text x="0" y="20" font-size="14" font-weight="700" fill="#42FF9E">OPEN TO BUILDING INTERESTING SYSTEMS</text>
    </g>

    <!-- Final Prompt Line with Active Blinking Cursor -->
    <g transform="translate(0, 204)">
      <text x="0" y="0" font-size="14" font-weight="700" fill="#FF3038">&gt; transmission_ready_</text>
      <rect x="195" y="-13" width="9" height="17" fill="#FF3038" class="t-cursor" />
    </g>
  </g>
</svg>
