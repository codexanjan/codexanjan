<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 190" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="arsBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090C10" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <style>
      @keyframes arsSweep4 {
        0% { transform: translateX(-200px); }
        100% { transform: translateX(850px); }
      }
      .ars-scanner4 { animation: arsSweep4 4.8s linear infinite; }
    </style>
  </defs>

  <rect width="800" height="190" rx="8" fill="url(#arsBg4)" stroke="#171B21" stroke-width="1.5" />
  <polygon points="8,8 24,8 8,24" fill="#FF3038" />
  <polygon points="792,182 776,182 792,166" fill="#FF3038" />

  <g clip-path="url(#arsClip4)">
    <clipPath id="arsClip4">
      <rect x="2" y="2" width="796" height="186" rx="6" />
    </clipPath>
    <line x1="0" y1="0" x2="0" y2="190" stroke="#FF3038" stroke-width="1.5" opacity="0.6" class="ars-scanner4" />
  </g>

  <g transform="translate(30, 32)" font-family="'Courier New', Consolas, monospace">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#FF3038" letter-spacing="3">WEAPON RACK 04 // DATA VAULTS</text>
    <text x="560" y="0" font-size="10" fill="#787F89" letter-spacing="1">PERSISTENCE // CACHE</text>
    <line x1="0" y1="12" x2="740" y2="12" stroke="#171B21" stroke-width="1" />
  </g>

  <!-- 4 Database Items: PostgreSQL, MySQL, MongoDB, Redis -->
  <g transform="translate(30, 70)" font-family="'Courier New', Consolas, monospace">
    <!-- PostgreSQL -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="175" height="85" rx="5" fill="#10141C" stroke="#55E6FF" stroke-width="1.2" />
      <polygon points="0,0 12,0 0,12" fill="#55E6FF" />
      <text x="87" y="32" text-anchor="middle" font-size="17" font-weight="900" fill="#55E6FF">POSTGRESQL</text>
      <text x="87" y="55" text-anchor="middle" font-size="11" font-weight="700" fill="#F4F4F2">RELATIONAL</text>
      <text x="87" y="72" text-anchor="middle" font-size="9" fill="#787F89">ACID // INDEXED</text>
    </g>

    <!-- MySQL -->
    <g transform="translate(190, 0)">
      <rect x="0" y="0" width="175" height="85" rx="5" fill="#10141C" stroke="#171B21" stroke-width="1.2" />
      <polygon points="0,0 12,0 0,12" fill="#F4C95D" />
      <text x="87" y="32" text-anchor="middle" font-size="17" font-weight="900" fill="#F4C95D">MYSQL</text>
      <text x="87" y="55" text-anchor="middle" font-size="11" font-weight="700" fill="#F4F4F2">SQL ENGINE</text>
      <text x="87" y="72" text-anchor="middle" font-size="9" fill="#787F89">REPLICATION</text>
    </g>

    <!-- MongoDB -->
    <g transform="translate(380, 0)">
      <rect x="0" y="0" width="175" height="85" rx="5" fill="#10141C" stroke="#42FF9E" stroke-width="1.2" />
      <polygon points="0,0 12,0 0,12" fill="#42FF9E" />
      <text x="87" y="32" text-anchor="middle" font-size="17" font-weight="900" fill="#42FF9E">MONGODB</text>
      <text x="87" y="55" text-anchor="middle" font-size="11" font-weight="700" fill="#F4F4F2">NOSQL DOCUMENT</text>
      <text x="87" y="72" text-anchor="middle" font-size="9" fill="#787F89">MERN ARCHITECTURE</text>
    </g>

    <!-- Redis -->
    <g transform="translate(570, 0)">
      <rect x="0" y="0" width="170" height="85" rx="5" fill="#10141C" stroke="#FF3038" stroke-width="1.2" />
      <polygon points="0,0 12,0 0,12" fill="#FF3038" />
      <text x="85" y="32" text-anchor="middle" font-size="17" font-weight="900" fill="#FF3038">REDIS</text>
      <text x="85" y="55" text-anchor="middle" font-size="11" font-weight="700" fill="#F4F4F2">IN-MEMORY CACHE</text>
      <text x="85" y="72" text-anchor="middle" font-size="9" fill="#FF4B4B">PUB/SUB // SUB-MS</text>
    </g>
  </g>
</svg>
