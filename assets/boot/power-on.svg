<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="100%" height="180" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes pulseGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
      @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes waveScroll { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
      @keyframes lineFade { 0%, 20% { opacity: 0; } 35%, 100% { opacity: 1; } }
      text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace; -webkit-font-smoothing: antialiased; }
      
    </style>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 245, 255, 0.08)" stroke-width="0.8"/>
      <circle cx="30" cy="0" r="0.8" fill="#00F5FF" opacity="0.3"/>
    </pattern>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>
    <linearGradient id="hud-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0.9"/>
    </linearGradient>
    
  </defs>
  <rect width="1200" height="180" fill="#04070D" />
  <rect width="1200" height="180" fill="url(#grid-pattern)" />
  
      <rect width="1200" height="180" fill="#020408" opacity="0.95" />
      <text x="30" y="28" fill="#7894A6" font-size="9" letter-spacing="2">SYS.BOOT://INITIAL_POWER_SURGE</text>
      <text x="1170" y="28" fill="#00F5FF" font-size="9" text-anchor="end" letter-spacing="2">VOLTAGE: 1.21 GV [NOMINAL]</text>
      <line x1="30" y1="35" x2="1170" y2="35" stroke="rgba(0, 245, 255, 0.08)" stroke-width="1" />
      <g transform="translate(600, 95)">
        <circle cx="0" cy="0" r="4" fill="#00F5FF"><animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/></circle>
        <circle cx="0" cy="0" r="16" fill="none" stroke="#00F5FF" stroke-width="1.2" stroke-dasharray="3 3"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/></circle>
        <circle cx="0" cy="0" r="36" fill="none" stroke="#3A86FF" stroke-width="1" opacity="0.6"><animate attributeName="r" values="8;48" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="3s" repeatCount="indefinite"/></circle>
        <line x1="-550" y1="0" x2="550" y2="0" stroke="url(#cyan-gradient)" stroke-width="1.5" opacity="0.8"/>
        <line x1="-300" y1="0" x2="300" y2="0" stroke="#FFF" stroke-width="2.5" opacity="0.9"/>
      </g>
      <text x="600" y="80" fill="#EAFBFF" font-size="18" font-weight="900" text-anchor="middle" letter-spacing="8" filter="url(#glow-cyan)">CODEX NETWORK</text>
      <text x="600" y="132" fill="#00F5FF" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="4">POWER://ONLINE <tspan fill="#39FF88">● [ACTIVE]</tspan></text>
      
    <path d="M 10 24 L 10 10 L 24 10" fill="none" stroke="#00F5FF" stroke-width="1.2" />
    <path d="M 1176 10 L 1190 10 L 1190 24" fill="none" stroke="#00F5FF" stroke-width="1.2" />
    <path d="M 10 156 L 10 170 L 24 170" fill="none" stroke="#00F5FF" stroke-width="1.2" />
    <path d="M 1176 170 L 1190 170 L 1190 156" fill="none" stroke="#00F5FF" stroke-width="1.2" />
  
    
</svg>
