        <text x="0" y="78" fill="#7894A6">[0.0058] DEV ENGINE .............................. <tspan fill="#00F5FF" font-weight="700">READY [TYPESCRIPT // FULL-STACK]</tspan></text>
        <text x="0" y="104" fill="#7894A6">[0.0089] AI MODULE ............................... <tspan fill="#00F5FF" font-weight="700">READY [DEEP ARCHITECTURE ONLINE]</tspan></text>
        <text x="0" y="130" fill="#7894A6">[0.0120] GITHUB INTERFACE ........................ <tspan fill="#39FF88" font-weight="700">CONNECTED [@CODEXANJAN]</tspan></text>
        <text x="0" y="156" fill="#7894A6">[0.0155] IDENTITY SYSTEM ......................... <tspan fill="#FFC857" font-weight="700">ENCRYPTED // SEARCHING FOR OPERATOR...</tspan></text>
        <text x="0" y="184" fill="#00F5FF">&gt;&gt; PRIMARY NODE DETECTED: [ANJAN SHETTY]</text>
        
        <g transform="translate(0, 205)">
