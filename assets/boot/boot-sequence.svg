        <text x="15" y="184" fill="#39FF88" font-size="9" font-weight="700">STATUS: OPTIMAL</text>
        
    <path d="M 4 14 L 4 4 L 14 4" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 246 4 L 256 4 L 256 14" fill="none" stroke="#00F5FF" stroke-width="1" />
