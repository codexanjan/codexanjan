<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="100%" height="150" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes pulseGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
      @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes waveScroll { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
      @keyframes lineFade { 0%, 20% { opacity: 0; } 35%, 100% { opacity: 1; } }
      text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace; -webkit-font-smoothing: antialiased; }
      
    </style>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 245, 255, 0.08)" stroke-width="0.8"/>
      <circle cx="30" cy="0" r="0.8" fill="#00F5FF" opacity="0.3"/>
    </pattern>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>
    <linearGradient id="hud-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0.9"/>
    </linearGradient>
    
  </defs>
  <rect width="1200" height="150" fill="#04070D" />
  <rect width="1200" height="150" fill="url(#grid-pattern)" />
  
      <g transform="translate(30, 20)">
        <text x="0" y="20" fill="#00F5FF" font-size="13" font-weight="700" letter-spacing="2">BIOS_SCAN://HARDWARE_DIAGNOSTIC_TELEMETRY</text>
        <text x="0" y="42" fill="#7894A6" font-size="10">BUS INTEGRITY: PASS | BUS WIDTH: 512-BIT | ECC MEMORY: ACTIVE</text>
        <g transform="translate(0, 60)">
          <rect x="0" y="0" width="180" height="40" fill="#080D18" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1"/><text x="12" y="24" fill="#EAFBFF" font-size="11" font-weight="600">L1 CACHE: 128 KB</text>
          <rect x="200" y="0" width="180" height="40" fill="#080D18" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1"/><text x="212" y="24" fill="#EAFBFF" font-size="11" font-weight="600">L2 CACHE: 4096 KB</text>
          <rect x="400" y="0" width="180" height="40" fill="#080D18" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1"/><text x="412" y="24" fill="#EAFBFF" font-size="11" font-weight="600">FP16 ACCEL: ACTIVE</text>
          <rect x="600" y="0" width="180" height="40" fill="#080D18" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1"/><text x="612" y="24" fill="#39FF88" font-size="11" font-weight="600">DEV PROTOCOL: OK</text>
        </g>
      </g>
      
    <path d="M 10 20 L 10 10 L 20 10" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 1180 10 L 1190 10 L 1190 20" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 10 130 L 10 140 L 20 140" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 1180 140 L 1190 140 L 1190 130" fill="none" stroke="#00F5FF" stroke-width="1" />
  
    
</svg>
