<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="100%" height="100%">
  <defs>
    <filter id="cc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="cc-scan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1B2D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF1B2D" stop-opacity="0"/>
    </linearGradient>

    <style>
      .cc-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
        fill: #FFFFFF;
        filter: drop-shadow(0 0 14px rgba(255, 27, 45, 0.75)) drop-shadow(0 0 22px rgba(0, 229, 255, 0.5));
      }
      .cc-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
      }
      @keyframes cc-sweep {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: -400; }
      }
      @keyframes cc-laser-orbit {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: -1000; }
      }
      @keyframes cc-blink {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px #21D4FD); }
      }
      @keyframes cc-spin-reticle {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes cc-scanline {
        0% { transform: translateY(12px); opacity: 0; }
        50% { opacity: 0.7; }
        100% { transform: translateY(148px); opacity: 0; }
      }
      @keyframes web-shimmer-cc {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.55; }
      }
      .cc-laser { stroke-dasharray: 80 200; animation: cc-sweep 4s linear infinite; }
      .cc-frame-laser { stroke-dasharray: 140 400; animation: cc-laser-orbit 7s linear infinite; }
      .cc-pulse { animation: cc-blink 2s ease-in-out infinite; }
      .cc-spin { transform-origin: center; animation: cc-spin-reticle 10s linear infinite; }
      .cc-scan { animation: cc-scanline 5s linear infinite; }
      .cc-web { animation: web-shimmer-cc 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Dark Base HUD Plate -->
  <rect x="10" y="10" width="1180" height="140" rx="8" fill="#050509" stroke="#8B93A7" stroke-opacity="0.2" stroke-width="1.2"/>

  <!-- Background Spider Web Geometry (Left & Right Flanks) -->
  <g stroke="#FF1B2D" stroke-width="1" fill="none" class="cc-web">
    <line x1="10" y1="10" x2="160" y2="80"/>
    <line x1="10" y1="10" x2="80" y2="148"/>
    <path d="M 40 25 Q 70 50 25 80"/>
    <path d="M 80 50 Q 130 90 50 130"/>
  </g>
  <g stroke="#00A8FF" stroke-width="1" fill="none" class="cc-web">
    <line x1="1190" y1="10" x2="1040" y2="80"/>
    <line x1="1190" y1="10" x2="1120" y2="148"/>
    <path d="M 1160 25 Q 1130 50 1175 80"/>
    <path d="M 1120 50 Q 1070 90 1150 130"/>
  </g>

  <!-- Cut Corner Angular Outer Frame Base -->
  <path d="M 35 12 L 1165 12 L 1188 35 L 1188 125 L 1165 148 L 35 148 L 12 125 L 12 35 Z" fill="none" stroke="#00A8FF" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Animated Running Laser Frame -->
  <path d="M 35 12 L 1165 12 L 1188 35 L 1188 125 L 1165 148 L 35 148 L 12 125 L 12 35 Z" fill="none" stroke="#FF1B2D" stroke-width="2.5" class="cc-frame-laser" filter="url(#cc-glow)"/>

  <!-- Animated Scanline Sweep -->
  <line x1="20" y1="0" x2="1180" y2="0" stroke="url(#cc-scan-grad)" stroke-width="1.5" class="cc-scan"/>

  <!-- Top Red & Blue Glowing Tracks -->
  <line x1="80" y1="12" x2="400" y2="12" stroke="#FF1B2D" stroke-width="3" filter="url(#cc-glow)"/>
  <line x1="800" y1="12" x2="1120" y2="12" stroke="#21D4FD" stroke-width="3" filter="url(#cc-glow)"/>

  <!-- Corner Brackets -->
  <path d="M 6 45 L 6 6 L 45 6" fill="none" stroke="#FF1B2D" stroke-width="2.5"/>
  <path d="M 1194 45 L 1194 6 L 1155 6" fill="none" stroke="#21D4FD" stroke-width="2.5"/>
  <path d="M 6 115 L 6 154 L 45 154" fill="none" stroke="#FF1B2D" stroke-width="2.5"/>
  <path d="M 1194 115 L 1194 154 L 1155 154" fill="none" stroke="#21D4FD" stroke-width="2.5"/>

  <!-- Left Telemetry Node (Spider-Man Themed) -->
  <g transform="translate(45, 38)">
    <rect x="0" y="0" width="225" height="32" rx="4" fill="#09090F" stroke="#FF1B2D" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="4.5" fill="#FF1B2D" class="cc-pulse"/>
    <text x="32" y="21" fill="#FFFFFF" font-size="13" class="cc-sub" letter-spacing="1.5">NODE // EARTH-CODEX-01</text>
    
    <text x="6" y="52" fill="#FF1744" font-size="12.5" class="cc-sub" letter-spacing="1">AGENT: ANJAN SHETTY</text>
    <text x="6" y="72" fill="#00E5FF" font-size="12.5" class="cc-sub" letter-spacing="1">STATUS: SPIDER-NET ONLINE</text>
  </g>

  <!-- Center Main HUD Heading (Single Razor-Sharp Solid White + Electric Cyan) -->
  <g transform="translate(600, 52)" text-anchor="middle">
    <!-- Top Status Badge -->
    <rect x="-170" y="-24" width="340" height="24" rx="12" fill="#09090F" stroke="#00E5FF" stroke-width="1.2"/>
    <text x="0" y="-8" fill="#00E5FF" font-size="12" class="cc-sub" letter-spacing="2.5">
      DEVELOPER COMMAND CENTER
    </text>

    <!-- Single Crisp Master Title -->
    <text x="0" y="38" font-size="40" class="cc-title" letter-spacing="6">
      SPIDER-VERSE COMMAND CENTER
    </text>

    <text x="0" y="68" fill="#00E5FF" font-size="14.5" class="cc-sub" letter-spacing="3">
      MULTIVERSE TELEMETRY // REAL-TIME GITHUB METRICS
    </text>
  </g>

  <!-- Right Telemetry Node (Spider-Man Themed) -->
  <g transform="translate(930, 38)">
    <rect x="0" y="0" width="225" height="32" rx="4" fill="#09090F" stroke="#00E5FF" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="4.5" fill="#21D4FD" class="cc-pulse"/>
    <text x="32" y="21" fill="#00E5FF" font-size="13" class="cc-sub" letter-spacing="1.5">SPIDER RADAR // ACTIVE</text>
    
    <text x="6" y="52" fill="#FFFFFF" font-size="12.5" class="cc-sub" letter-spacing="1">LATENCY: 12ms [OPTIMAL]</text>
    <text x="6" y="72" fill="#FF1744" font-size="12.5" class="cc-sub" letter-spacing="1">CANON LINK: SYNCHRONIZED</text>
  </g>

  <!-- Bottom Track Beam -->
  <line x1="35" y1="148" x2="1165" y2="148" stroke="#00A8FF" stroke-width="2.5" class="cc-laser"/>
</svg>
