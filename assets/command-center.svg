<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="100%" height="100%">
  <defs>
    <linearGradient id="cc-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1B2D"/>
      <stop offset="40%" stop-color="#F5F7FA"/>
      <stop offset="70%" stop-color="#00A8FF"/>
      <stop offset="100%" stop-color="#21D4FD"/>
    </linearGradient>

    <filter id="cc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .cc-mono { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, 'Fira Code', monospace; }
      @keyframes cc-sweep {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: -400; }
      }
      @keyframes cc-blink {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      .cc-laser { stroke-dasharray: 80 200; animation: cc-sweep 4s linear infinite; }
      .cc-pulse { animation: cc-blink 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Dark Base HUD Plate -->
  <rect x="10" y="10" width="1180" height="110" rx="6" fill="#050509" stroke="#8B93A7" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Cut Corner Angular Outer Frame -->
  <path d="M 35 12 L 1165 12 L 1188 35 L 1188 95 L 1165 118 L 35 118 L 12 95 L 12 35 Z" fill="none" stroke="#00A8FF" stroke-width="1.6"/>

  <!-- Top Red Glowing Track -->
  <line x1="80" y1="12" x2="400" y2="12" stroke="#FF1B2D" stroke-width="2" filter="url(#cc-glow)"/>
  <line x1="800" y1="12" x2="1120" y2="12" stroke="#21D4FD" stroke-width="2" filter="url(#cc-glow)"/>

  <!-- Corner Brackets -->
  <path d="M 6 45 L 6 6 L 45 6" fill="none" stroke="#FF1B2D" stroke-width="2"/>
  <path d="M 1194 45 L 1194 6 L 1155 6" fill="none" stroke="#21D4FD" stroke-width="2"/>
  <path d="M 6 85 L 6 124 L 45 124" fill="none" stroke="#FF1B2D" stroke-width="2"/>
  <path d="M 1194 85 L 1194 124 L 1155 124" fill="none" stroke="#21D4FD" stroke-width="2"/>

  <!-- Left Telemetry Node -->
  <g transform="translate(45, 42)">
    <rect x="0" y="0" width="180" height="24" rx="2" fill="#09090F" stroke="#FF1B2D" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#FF1B2D" class="cc-pulse"/>
    <text x="26" y="16" fill="#F5F7FA" font-size="10" font-weight="700" class="cc-mono" letter-spacing="1.5">USER // CODEXANJAN</text>
    <text x="0" y="38" fill="#8B93A7" font-size="9" class="cc-mono">NODE // EARTH-CODEX-01</text>
    <text x="0" y="52" fill="#00A8FF" font-size="9" class="cc-mono">TELEMETRY: SPIDER-NET</text>
  </g>

  <!-- Center Main HUD Heading -->
  <g transform="translate(600, 52)" text-anchor="middle">
    <!-- Top Status Badge -->
    <rect x="-110" y="-24" width="220" height="18" rx="2" fill="#09090F" stroke="#8B93A7" stroke-opacity="0.3" stroke-width="1"/>
    <text x="0" y="-12" fill="#21D4FD" font-size="9" font-weight="700" class="cc-mono" letter-spacing="2.5">
      DEVELOPER COMMAND CENTER
    </text>

    <!-- Main Title -->
    <text x="0" y="22" fill="url(#cc-beam)" font-size="28" font-weight="900" class="cc-mono" letter-spacing="6">
      COMMAND CENTER
    </text>

    <text x="0" y="44" fill="#8B93A7" font-size="10" font-weight="600" class="cc-mono" letter-spacing="3">
      GITHUB TELEMETRY // REAL-TIME METRICS
    </text>
  </g>

  <!-- Right Telemetry Node -->
  <g transform="translate(975, 42)">
    <rect x="0" y="0" width="180" height="24" rx="2" fill="#09090F" stroke="#00A8FF" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#21D4FD" class="cc-pulse"/>
    <text x="26" y="16" fill="#21D4FD" font-size="10" font-weight="700" class="cc-mono" letter-spacing="1.5">STREAM // ACTIVE</text>
    <text x="0" y="38" fill="#8B93A7" font-size="9" class="cc-mono">LATENCY // 12ms [OPTIMAL]</text>
    <text x="0" y="52" fill="#FF1B2D" font-size="9" class="cc-mono">PROTOCOL: GIT_DISPATCH</text>
  </g>

  <!-- Bottom Track Beam -->
  <line x1="35" y1="118" x2="1165" y2="118" stroke="#00A8FF" stroke-width="2" class="cc-laser"/>
</svg>
