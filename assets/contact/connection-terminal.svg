<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="280" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes pulseGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
      @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes waveScroll { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
      @keyframes lineFade { 0%, 20% { opacity: 0; } 35%, 100% { opacity: 1; } }
      text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace; -webkit-font-smoothing: antialiased; }
      
    </style>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 245, 255, 0.08)" stroke-width="0.8"/>
      <circle cx="30" cy="0" r="0.8" fill="#00F5FF" opacity="0.3"/>
    </pattern>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>
    <linearGradient id="hud-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0.9"/>
    </linearGradient>
    
  </defs>
  <rect width="1200" height="280" fill="#04070D" />
  <rect width="1200" height="280" fill="url(#grid-pattern)" />
  
      <rect width="1200" height="280" fill="#04070D" />
      <text x="40" y="32" fill="#00F5FF" font-size="11" font-weight="800" letter-spacing="2">CONNECTION_PORT // SECURE_SOCKET_IO</text>
      <text x="1160" y="32" fill="#39FF88" font-size="10" font-weight="700" text-anchor="end">STATUS: CHANNEL_OPEN ●</text>
      <line x1="40" y1="42" x2="1160" y2="42" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1" />
      <g transform="translate(50, 75)" font-size="12">
        <text x="0" y="0" fill="#00F5FF" font-weight="700">&gt; INITIALIZING SECURE COMMUNICATION PROTOCOL...</text>
        <g transform="translate(0, 32)">
          <rect x="0" y="-16" width="160" height="24" fill="#080D18" stroke="rgba(0, 245, 255, 0.25)" rx="2"/>
          <text x="12" y="0" fill="#00F5FF" font-weight="700">GITHUB NODE:</text><text x="180" y="0" fill="#EAFBFF" font-weight="800">github.com/codexanjan</text><text x="520" y="0" fill="#39FF88">[CHANNEL VERIFIED]</text>
        </g>
        <g transform="translate(0, 64)">
          <rect x="0" y="-16" width="160" height="24" fill="#080D18" stroke="rgba(0, 245, 255, 0.25)" rx="2"/>
          <text x="12" y="0" fill="#00F5FF" font-weight="700">X (TWITTER):</text><text x="180" y="0" fill="#EAFBFF" font-weight="800">x.com/anjxnshetty</text><text x="520" y="0" fill="#39FF88">[ACTIVE HANDLE]</text>
        </g>
        <g transform="translate(0, 96)">
          <rect x="0" y="-16" width="160" height="24" fill="#080D18" stroke="rgba(0, 245, 255, 0.25)" rx="2"/>
          <text x="12" y="0" fill="#00F5FF" font-weight="700">LINKEDIN:</text><text x="180" y="0" fill="#EAFBFF" font-weight="700">[ADD LINKEDIN URL]</text><text x="520" y="0" fill="#FFC857">[PORT READY]</text>
        </g>
        <g transform="translate(0, 128)">
          <rect x="0" y="-16" width="160" height="24" fill="#080D18" stroke="rgba(0, 245, 255, 0.25)" rx="2"/>
          <text x="12" y="0" fill="#00F5FF" font-weight="700">DIRECT COMMS:</text><text x="180" y="0" fill="#EAFBFF" font-weight="700">[ADD SECURE EMAIL]</text><text x="520" y="0" fill="#FFC857">[PORT READY]</text>
        </g>
      </g>
      
    <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#39FF88" stroke-width="1" />
    <path d="M 1176 12 L 1188 12 L 1188 24" fill="none" stroke="#39FF88" stroke-width="1" />
    <path d="M 12 256 L 12 268 L 24 268" fill="none" stroke="#39FF88" stroke-width="1" />
    <path d="M 1176 268 L 1188 268 L 1188 256" fill="none" stroke="#39FF88" stroke-width="1" />
  
    
</svg>
