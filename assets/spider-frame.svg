<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="frame-grad-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1B2D"/>
      <stop offset="50%" stop-color="#C8102E"/>
      <stop offset="100%" stop-color="#FF1B2D"/>
    </linearGradient>

    <linearGradient id="frame-grad-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21D4FD"/>
      <stop offset="100%" stop-color="#00A8FF"/>
    </linearGradient>

    <filter id="sf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes border-pulse {
        0%, 100% { opacity: 0.75; }
        50% { opacity: 1; filter: drop-shadow(0 0 8px #FF1B2D); }
      }
      .f-pulse { animation: border-pulse 4s ease-in-out infinite; }
      .f-mono { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, 'Fira Code', monospace; }
    </style>
  </defs>

  <!-- Dark Shield Base Background -->
  <rect x="6" y="6" width="788" height="228" rx="8" fill="#050509" stroke="#8B93A7" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Red Angular Border Path (Cut Corners) -->
  <path d="M 30 10 L 770 10 L 790 30 L 790 210 L 770 230 L 30 230 L 10 210 L 10 30 Z" fill="none" stroke="url(#frame-grad-red)" stroke-width="1.8" class="f-pulse"/>

  <!-- Electric Blue Corner Nodes -->
  <circle cx="10" cy="30" r="3.5" fill="#21D4FD" filter="url(#sf-glow)"/>
  <circle cx="790" cy="30" r="3.5" fill="#21D4FD" filter="url(#sf-glow)"/>
  <circle cx="10" cy="210" r="3.5" fill="#21D4FD" filter="url(#sf-glow)"/>
  <circle cx="790" cy="210" r="3.5" fill="#21D4FD" filter="url(#sf-glow)"/>

  <!-- Outer HUD Corner Brackets -->
  <path d="M 4 45 L 4 6 L 45 6" fill="none" stroke="#00A8FF" stroke-width="2"/>
  <path d="M 796 45 L 796 6 L 755 6" fill="none" stroke="#00A8FF" stroke-width="2"/>
  <path d="M 4 195 L 4 234 L 45 234" fill="none" stroke="#00A8FF" stroke-width="2"/>
  <path d="M 796 195 L 796 234 L 755 234" fill="none" stroke="#00A8FF" stroke-width="2"/>

  <!-- Web Connector Strands in Corners -->
  <g stroke="#FF1B2D" stroke-opacity="0.3" stroke-width="1" fill="none">
    <line x1="10" y1="30" x2="60" y2="10"/>
    <line x1="10" y1="60" x2="30" y2="10"/>
    <line x1="790" y1="30" x2="740" y2="10"/>
    <line x1="790" y1="60" x2="770" y2="10"/>
    <line x1="10" y1="210" x2="60" y2="230"/>
    <line x1="10" y1="180" x2="30" y2="230"/>
    <line x1="790" y1="210" x2="740" y2="230"/>
    <line x1="790" y1="180" x2="770" y2="230"/>
  </g>

  <!-- Top Center HUD Badge -->
  <rect x="340" y="2" width="120" height="16" rx="2" fill="#09090F" stroke="#FF1B2D" stroke-width="1"/>
  <text x="400" y="13" text-anchor="middle" fill="#F5F7FA" font-size="8.5" font-weight="700" class="f-mono" letter-spacing="2">SPIDER // CORE</text>

  <!-- Bottom Center Status Tag -->
  <rect x="320" y="222" width="160" height="16" rx="2" fill="#09090F" stroke="#00A8FF" stroke-width="1"/>
  <circle cx="332" cy="230" r="2.5" fill="#21D4FD"/>
  <text x="406" y="233" text-anchor="middle" fill="#21D4FD" font-size="8" font-weight="700" class="f-mono" letter-spacing="1.5">INTERFACE: ACTIVE</text>
</svg>
