<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="100%" height="100%">
  <defs>
    <filter id="af-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="af-scan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF1B2D" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>

    <style>
      .af-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 900; }
      .af-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
      @keyframes ach-pulse {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; filter: drop-shadow(0 0 8px #00A8FF); }
      }
      @keyframes laser-cycle-rev {
        0% { stroke-dashoffset: -800; }
        100% { stroke-dashoffset: 800; }
      }
      @keyframes beacon-ping-af {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.3); filter: drop-shadow(0 0 6px #FF1B2D); }
      }
      @keyframes scan-horiz-af {
        0% { transform: translateY(148px); opacity: 0; }
        30% { opacity: 0.7; }
        70% { opacity: 0.7; }
        100% { transform: translateY(12px); opacity: 0; }
      }
      .af-pulse { animation: ach-pulse 3.5s ease-in-out infinite; }
      .af-laser { stroke-dasharray: 120 400; animation: laser-cycle-rev 6s linear infinite; }
      .af-beacon { transform-origin: 14px 14px; animation: beacon-ping-af 2s ease-in-out infinite; }
      .af-scan { animation: scan-horiz-af 5.5s linear infinite; }
    </style>
  </defs>

  <!-- Dark Base Chassis -->
  <rect x="8" y="8" width="984" height="144" rx="8" fill="#050509" stroke="#8B93A7" stroke-opacity="0.2" stroke-width="1.2"/>

  <!-- Outer Angular Shield Border Base -->
  <path d="M 30 10 L 970 10 L 990 30 L 990 130 L 970 150 L 30 150 L 10 130 L 10 30 Z" fill="none" stroke="#00A8FF" stroke-opacity="0.5" stroke-width="2"/>
  
  <!-- Animated Running Laser Beam on Frame -->
  <path d="M 30 10 L 970 10 L 990 30 L 990 130 L 970 150 L 30 150 L 10 130 L 10 30 Z" fill="none" stroke="#FF1B2D" stroke-width="2.5" class="af-laser" filter="url(#af-glow)"/>

  <!-- Animated Scanline Sweep -->
  <line x1="20" y1="0" x2="980" y2="0" stroke="url(#af-scan-grad)" stroke-width="1.5" class="af-scan"/>

  <!-- Top Left Badge -->
  <g transform="translate(30, 16)">
    <rect x="0" y="0" width="240" height="28" rx="4" fill="#09090F" stroke="#FF1B2D" stroke-width="1.5"/>
    <circle cx="14" cy="14" r="4.5" fill="#FF1B2D" class="af-beacon" filter="url(#af-glow)"/>
    <text x="30" y="19" fill="#FFFFFF" font-size="13" class="af-sub" letter-spacing="1.5">RECORD: AUTHENTICATED</text>
  </g>

  <!-- Top Right Badge -->
  <g transform="translate(750, 16)">
    <rect x="0" y="0" width="220" height="28" rx="4" fill="#09090F" stroke="#00E5FF" stroke-width="1.5"/>
    <circle cx="14" cy="14" r="4" fill="#21D4FD" class="af-pulse"/>
    <text x="30" y="19" fill="#00E5FF" font-size="13" class="af-sub" letter-spacing="1">NETWORK: VERIFIED</text>
  </g>

  <!-- Corner Brackets -->
  <path d="M 6 45 L 6 6 L 45 6" fill="none" stroke="#FF1B2D" stroke-width="2.5"/>
  <path d="M 994 45 L 994 6 L 955 6" fill="none" stroke="#21D4FD" stroke-width="2.5"/>
  <path d="M 6 115 L 6 154 L 45 154" fill="none" stroke="#FF1B2D" stroke-width="2.5"/>
  <path d="M 994 115 L 994 154 L 955 154" fill="none" stroke="#21D4FD" stroke-width="2.5"/>

  <!-- Center Prominent Typography -->
  <g transform="translate(500, 82)" text-anchor="middle">
    <!-- Drop Shadows -->
    <text x="-2" y="2" fill="#00A8FF" font-size="36" class="af-title" letter-spacing="5" opacity="0.8">ACHIEVEMENT NETWORK</text>
    <text x="2" y="-2" fill="#FF1B2D" font-size="36" class="af-title" letter-spacing="5" opacity="0.8">ACHIEVEMENT NETWORK</text>
    <!-- Solid Brilliant White -->
    <text x="0" y="0" fill="#FFFFFF" font-size="36" class="af-title" letter-spacing="5">ACHIEVEMENT NETWORK</text>

    <text x="0" y="32" fill="#00E5FF" font-size="15" class="af-sub" letter-spacing="2.5">
      HACKATHONS // COMPETITIVE SPRINTS // MILESTONES
    </text>
  </g>

  <!-- Bottom Track Beam -->
  <line x1="30" y1="136" x2="970" y2="136" stroke="#8B93A7" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="160" y1="136" x2="840" y2="136" stroke="#00A8FF" stroke-width="2" class="af-laser"/>
</svg>
