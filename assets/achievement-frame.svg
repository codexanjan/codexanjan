<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="ach-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1B2D"/>
      <stop offset="60%" stop-color="#00A8FF"/>
      <stop offset="100%" stop-color="#21D4FD"/>
    </linearGradient>

    <filter id="af-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .af-mono { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, 'Fira Code', monospace; }
      @keyframes ach-pulse {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px #00A8FF); }
      }
      .af-pulse { animation: ach-pulse 3.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Dark Base Chassis -->
  <rect x="8" y="8" width="784" height="184" rx="6" fill="#050509" stroke="#8B93A7" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Outer Angular Shield Border -->
  <path d="M 30 10 L 770 10 L 790 30 L 790 170 L 770 190 L 30 190 L 10 170 L 10 30 Z" fill="none" stroke="url(#ach-grad)" stroke-width="1.8" class="af-pulse"/>

  <!-- Left Side Achievement Crest Area -->
  <g transform="translate(45, 100)">
    <polygon points="0,-36 28,-14 28,18 0,40 -28,18 -28,-14" fill="#09090F" stroke="#FF1B2D" stroke-width="1.8"/>
    <circle cx="0" cy="2" r="14" fill="#050509" stroke="#00A8FF" stroke-width="1.2"/>
    <!-- Cyber Spider Emblem Inside Crest -->
    <polygon points="0,-6 4,-2 0,3 -4,-2" fill="#FF1B2D"/>
    <polygon points="0,2 3,6 0,9 -3,6" fill="#21D4FD"/>
    <path d="M -3 -3 L -8 -7 M 3 -3 L 8 -7" stroke="#FF1B2D" stroke-width="1.2" fill="none"/>
    <path d="M -4 2 L -9 2 M 4 2 L 9 2" stroke="#F5F7FA" stroke-width="1.2" fill="none"/>
    <path d="M -3 7 L -8 11 M 3 7 L 8 11" stroke="#00A8FF" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Connecting Circuit Web Line from Crest to Content -->
  <line x1="75" y1="100" x2="110" y2="100" stroke="#00A8FF" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="110" cy="100" r="2.5" fill="#21D4FD" filter="url(#af-glow)"/>

  <!-- Corner Brackets -->
  <path d="M 4 40 L 4 6 L 40 6" fill="none" stroke="#FF1B2D" stroke-width="2"/>
  <path d="M 796 40 L 796 6 L 760 6" fill="none" stroke="#21D4FD" stroke-width="2"/>
  <path d="M 4 160 L 4 194 L 40 194" fill="none" stroke="#FF1B2D" stroke-width="2"/>
  <path d="M 796 160 L 796 194 L 760 194" fill="none" stroke="#21D4FD" stroke-width="2"/>

  <!-- Top Right Telemetry Tag -->
  <g transform="translate(620, 16)">
    <rect x="0" y="0" width="150" height="18" rx="2" fill="#09090F" stroke="#FF1B2D" stroke-width="1"/>
    <text x="75" y="12" text-anchor="middle" fill="#FF1B2D" font-size="8.5" font-weight="700" class="af-mono" letter-spacing="1.5">RECORD: VERIFIED</text>
  </g>

  <!-- Bottom Details Track -->
  <text x="770" y="178" text-anchor="end" fill="#8B93A7" font-size="8.5" class="af-mono" letter-spacing="1.5">NETWORK PROTOCOL // RECORD_ARCHIVE</text>
  <text x="120" y="178" fill="#8B93A7" font-size="8.5" class="af-mono" letter-spacing="1">AUTHENTICATION: SIGNED</text>
</svg>
