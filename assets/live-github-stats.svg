<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="liveStatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1218" />
      <stop offset="50%" stop-color="#080A0D" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <linearGradient id="rankCircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3038" />
      <stop offset="50%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>

    <filter id="statGlowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes statEdgeLaser {
        0% { stroke-dashoffset: 1400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes rankDashRotate {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 260; }
      }
      @keyframes pulseAura {
        0%, 100% { filter: drop-shadow(0 0 3px #FF3038); }
        50% { filter: drop-shadow(0 0 10px #FF3038); }
      }
      .stat-edge {
        stroke-dasharray: 120 1280;
        animation: statEdgeLaser 4.5s linear infinite;
      }
      .rank-ring {
        stroke-dasharray: 18 8;
        animation: rankDashRotate 10s linear infinite;
      }
      .glow-badge {
        animation: pulseAura 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="495" height="195" rx="6" fill="url(#liveStatBg)" stroke="#1C222E" stroke-width="1.2" />
  <!-- Traveling Animated Laser Edge -->
  <rect width="495" height="195" rx="6" fill="none" stroke="#FF3038" stroke-width="1.8" class="stat-edge" opacity="0.85" />

  <!-- Corner Brackets -->
  <polygon points="8,8 20,8 8,20" fill="#FF3038" />
  <polygon points="487,8 475,8 487,20" fill="#FF3038" />
  <polygon points="8,187 20,187 8,175" fill="#FF3038" />
  <polygon points="487,187 475,187 487,175" fill="#FF3038" />

  <!-- Title Header -->
  <g transform="translate(25, 34)" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <!-- Mini Sword Icon -->
    <path d="M 0 0 L 12 0 L 16 -3 L 12 -6 L 0 -6 Z" fill="#FF3038" transform="translate(0, -6)" />
    <line x1="-3" y1="-9" x2="-3" y2="-3" stroke="#FFF" stroke-width="2" />
    <text x="22" y="-3" font-size="16" font-weight="800" fill="#FF3038" letter-spacing="0.5">Anjan Shetty's GitHub Stats</text>
  </g>

  <!-- Metrics List (Left Column) -->
  <g transform="translate(28, 62)" font-family="system-ui, -apple-system, 'SF Mono', Consolas, monospace" font-size="12.5" font-weight="600">
    <!-- Item 1: Stars -->
    <g transform="translate(0, 0)">
      <polygon points="6,1 8,5 12,6 9,9 10,13 6,11 2,13 3,9 0,6 4,5" fill="#FACC15" />
      <text x="24" y="11" fill="#C5CAD4">Total Stars Earned:</text>
      <text x="210" y="11" font-weight="800" fill="#F4F4F2">73</text>
    </g>

    <!-- Item 2: Commits -->
    <g transform="translate(0, 24)">
      <circle cx="6" cy="7" r="4.5" fill="none" stroke="#55E6FF" stroke-width="2" />
      <line x1="6" y1="1" x2="6" y2="4" stroke="#55E6FF" stroke-width="2" />
      <text x="24" y="11" fill="#C5CAD4">Total Commits (2026):</text>
      <text x="210" y="11" font-weight="800" fill="#F4F4F2">82</text>
    </g>

    <!-- Item 3: PRs -->
    <g transform="translate(0, 48)">
      <circle cx="4" cy="4" r="2.5" fill="#42FF9E" />
      <circle cx="8" cy="10" r="2.5" fill="#42FF9E" />
      <path d="M 4 6 L 4 10 L 6 10" stroke="#42FF9E" stroke-width="1.5" fill="none" />
      <text x="24" y="11" fill="#C5CAD4">Total PRs:</text>
      <text x="210" y="11" font-weight="800" fill="#F4F4F2">1</text>
    </g>

    <!-- Item 4: Issues -->
    <g transform="translate(0, 72)">
      <circle cx="6" cy="7" r="5" fill="none" stroke="#FF5E65" stroke-width="1.8" />
      <circle cx="6" cy="7" r="1.5" fill="#FF5E65" />
      <text x="24" y="11" fill="#C5CAD4">Total Issues:</text>
      <text x="210" y="11" font-weight="800" fill="#F4F4F2">0</text>
    </g>

    <!-- Item 5: Contributed to -->
    <g transform="translate(0, 96)">
      <rect x="2" y="3" width="9" height="8" rx="1.5" fill="none" stroke="#A78BFA" stroke-width="1.5" />
      <line x1="2" y1="6" x2="11" y2="6" stroke="#A78BFA" stroke-width="1" />
      <text x="24" y="11" fill="#C5CAD4">Contributed to (last year):</text>
      <text x="210" y="11" font-weight="800" fill="#F4F4F2">27</text>
    </g>
  </g>

  <!-- Rank Badge (Right Column) -->
  <g transform="translate(395, 108)" class="glow-badge">
    <!-- Outer Glow Circle -->
    <circle cx="0" cy="0" r="46" fill="#0C0E14" stroke="#1F2633" stroke-width="2" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#rankCircleGrad)" stroke-width="4.5" class="rank-ring" />

    <!-- Inner Circle -->
    <circle cx="0" cy="0" r="32" fill="#141822" stroke="#FF3038" stroke-width="1.2" />

    <!-- Rank Grade Letter -->
    <text x="0" y="8" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="28" font-weight="900" fill="#F4F4F2">B-</text>
    <text x="0" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#A8ADB7" letter-spacing="1">RANK</text>
  </g>
</svg>
