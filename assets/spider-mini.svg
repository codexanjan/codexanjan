<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="24" height="24">
  <defs>
    <filter id="mini-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes mini-breathe {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #FF1B2D); }
        50% { transform: scale(1.12); filter: drop-shadow(0 0 6px #00E5FF) drop-shadow(0 0 4px #FF1B2D); }
      }
      @keyframes eye-glow {
        0%, 100% { fill: #00E5FF; opacity: 0.7; }
        50% { fill: #FFFFFF; opacity: 1; filter: drop-shadow(0 0 3px #00E5FF); }
      }
      .mini-anim { transform-origin: 16px 16px; animation: mini-breathe 2.5s ease-in-out infinite; }
      .mini-eye { animation: eye-glow 1.5s ease-in-out infinite; }
    </style>
  </defs>
  <g class="mini-anim">
    <!-- 8 Micro Angular Cyber Spider Legs -->
    <g stroke="#00A8FF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Top Legs -->
      <path d="M 13 12 L 8 8 L 4 10"/>
      <path d="M 19 12 L 24 8 L 28 10"/>
      <!-- Upper Legs -->
      <path d="M 12 15 L 6 14 L 3 17"/>
      <path d="M 20 15 L 26 14 L 29 17"/>
      <!-- Lower Legs -->
      <path d="M 12 18 L 6 20 L 4 24"/>
      <path d="M 20 18 L 26 20 L 28 24"/>
      <!-- Bottom Legs -->
      <path d="M 13 21 L 9 25 L 7 28"/>
      <path d="M 19 21 L 23 25 L 25 28"/>
    </g>
    <!-- Center Head & Abdomen -->
    <polygon points="16,8 19,12 16,14 13,12" fill="#050509" stroke="#FF1B2D" stroke-width="1.2" filter="url(#mini-glow)"/>
    <circle cx="15" cy="11" r="0.9" class="mini-eye"/>
    <circle cx="17" cy="11" r="0.9" class="mini-eye"/>
    <polygon points="16,14 20,17 18,23 16,25 14,23 12,17" fill="#09090F" stroke="#FF1B2D" stroke-width="1.4" filter="url(#mini-glow)"/>
    <!-- Micro Center Tech Node -->
    <circle cx="16" cy="19" r="1.2" fill="#00E5FF"/>
  </g>
</svg>
