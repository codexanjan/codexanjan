<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="topBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0E" />
      <stop offset="50%" stop-color="#050608" />
      <stop offset="100%" stop-color="#0E1118" />
    </linearGradient>

    <linearGradient id="bladeSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141820" />
      <stop offset="40%" stop-color="#A8ADB7" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#A8ADB7" />
      <stop offset="100%" stop-color="#141820" />
    </linearGradient>

    <linearGradient id="bladeEdgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3038" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#FF3038" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFF" stop-opacity="1" />
    </linearGradient>

    <radialGradient id="topCenterAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3038" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#FF3038" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FF3038" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="topRadarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3038" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FF3038" stop-opacity="0" />
    </linearGradient>

    <filter id="topRedGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes spinSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spinReverse {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes polyBreathe {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #FF3038); }
        50% { transform: scale(1.025); filter: drop-shadow(0 0 14px #FF3038); }
      }
      @keyframes pulseNodeWhite {
        0%, 100% { r: 5; filter: drop-shadow(0 0 3px #FFF); }
        50% { r: 7; filter: drop-shadow(0 0 10px #55E6FF); }
      }
      @keyframes pulseBladeSlash {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; filter: drop-shadow(0 0 8px #FF3038); }
      }
      @keyframes axisLaser {
        0% { stroke-dashoffset: 140; }
        100% { stroke-dashoffset: 0; }
      }

      .radar-sweep-blade {
        transform-origin: 450px 240px;
        animation: spinSweep 7s linear infinite;
      }
      .mon-ring-rotate {
        transform-origin: 450px 240px;
        animation: spinReverse 24s linear infinite;
      }
      .active-web-poly {
        transform-origin: 450px 240px;
        animation: polyBreathe 4s ease-in-out infinite;
      }
      @keyframes cardEdgeLaserRank {
        0% { stroke-dashoffset: 2700; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes plasmaPulseSlash {
        0%, 100% { opacity: 0.75; filter: drop-shadow(0 0 6px #FF3038); }
        50% { opacity: 1; filter: drop-shadow(0 0 16px #FF3038); }
      }
      @keyframes plasmaPulseCyan {
        0%, 100% { opacity: 0.75; filter: drop-shadow(0 0 6px #55E6FF); }
        50% { opacity: 1; filter: drop-shadow(0 0 16px #55E6FF); }
      }
      .blade-slash-line {
        animation: pulseBladeSlash 3s ease-in-out infinite;
      }
      .node-pulse-white {
        animation: pulseNodeWhite 2.5s ease-in-out infinite;
      }
      .laser-axis {
        stroke-dasharray: 20 120;
        animation: axisLaser 3s linear infinite;
      }
      .rank-edge-laser {
        stroke-dasharray: 200 2500;
        animation: cardEdgeLaserRank 6s linear infinite;
      }
      .plasma-slash-red {
        animation: plasmaPulseSlash 3.5s ease-in-out infinite;
      }
      .plasma-slash-cyan {
        animation: plasmaPulseCyan 3.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="900" height="450" rx="8" fill="url(#topBg)" stroke="#1C222E" stroke-width="1.5" />
  <!-- Animated Perimeter Edge Laser -->
  <rect width="900" height="450" rx="8" fill="none" stroke="#FF3038" stroke-width="2" class="rank-edge-laser" opacity="0.9" />

  <!-- Tactical Corner Brackets -->
  <polygon points="12,12 36,12 12,36" fill="#FF3038" />
  <polygon points="888,12 864,12 888,36" fill="#FF3038" />
  <polygon points="12,438 36,438 12,414" fill="#FF3038" />
  <polygon points="888,438 864,438 888,414" fill="#FF3038" />

  <!-- Top Header Telemetry -->
  <g transform="translate(35, 36)" font-family="'Courier New', Consolas, monospace">
    <polygon points="0,0 8,0 4,8" fill="#FF3038" />
    <text x="14" y="6" font-size="12" font-weight="900" fill="#FF3038" letter-spacing="2">CAPABILITY TOPOLOGY // BUSHIDO OF CODE</text>
    <text x="590" y="6" font-size="10" font-weight="700" fill="#55E6FF" letter-spacing="1.5">MASTERY // 6 TACTICAL DISCIPLINES</text>
    <line x1="0" y1="16" x2="830" y2="16" stroke="#171C25" stroke-width="1" />
  </g>

  <!-- ======================================================== -->
  <!-- DUAL CROSSED KATANA BLADES (X SYMBOL IN KATANA)          -->
  <!-- ======================================================== -->
  <g transform="translate(450, 240)">
    <!-- SWORD 1: Top-Left to Bottom-Right (Red Plasma Katana) -->
    <g transform="rotate(32)" class="plasma-slash-red">
      <!-- Full Steel Blade: runs through (0,0) to +280 -->
      <path d="M -170 -2.5 L 280 -2.5 L 298 0 L 280 2.5 L -170 2.5 Z" fill="url(#bladeSteel)" />
      <!-- Hamon & Razor Edge -->
      <line x1="-170" y1="-2" x2="280" y2="-2" stroke="#FFFFFF" stroke-width="1.2" opacity="0.95" />
      <line x1="-170" y1="2" x2="280" y2="2" stroke="#FF3038" stroke-width="2.5" filter="url(#topRedGlow)" />
      <!-- Habaki (Gold Blade Collar) -->
      <rect x="-178" y="-4" width="9" height="8" rx="1" fill="#FACC15" stroke="#9A3412" stroke-width="0.8" />
      <!-- Tsuba (Samurai Guard) -->
      <ellipse cx="-180" cy="0" rx="5" ry="18" fill="#141820" stroke="#FF3038" stroke-width="2.2" filter="url(#topRedGlow)" />
      <circle cx="-180" cy="0" r="3" fill="#FACC15" />
      <!-- Tsuka (Handle with Diamond Wrap) -->
      <rect x="-275" y="-4" width="95" height="8" rx="2" fill="#0C0E14" stroke="#222834" stroke-width="1.2" />
      <line x1="-275" y1="0" x2="-180" y2="0" stroke="#FF3038" stroke-width="5" stroke-dasharray="5 7" />
      <!-- Kashira (Gold Pommel Cap) -->
      <rect x="-282" y="-5" width="8" height="10" rx="2" fill="#FACC15" stroke="#9A3412" stroke-width="1" />
      <!-- Kissaki (Sharp Tip Accent) -->
      <polygon points="280,-2.5 300,0 280,2.5" fill="#FFFFFF" filter="url(#topRedGlow)" />
    </g>

    <!-- SWORD 2: Bottom-Left to Top-Right (Cyan Plasma Katana) -->
    <g transform="rotate(-32)" class="plasma-slash-cyan">
      <!-- Full Steel Blade: runs through (0,0) to +280 -->
      <path d="M -170 -2.5 L 280 -2.5 L 298 0 L 280 2.5 L -170 2.5 Z" fill="url(#bladeSteel)" />
      <!-- Hamon & Razor Edge -->
      <line x1="-170" y1="-2" x2="280" y2="-2" stroke="#FFFFFF" stroke-width="1.2" opacity="0.95" />
      <line x1="-170" y1="2" x2="280" y2="2" stroke="#55E6FF" stroke-width="2.5" filter="url(#cyanGlow)" />
      <!-- Habaki (Gold Blade Collar) -->
      <rect x="-178" y="-4" width="9" height="8" rx="1" fill="#FACC15" stroke="#00B4D8" stroke-width="0.8" />
      <!-- Tsuba (Samurai Guard) -->
      <ellipse cx="-180" cy="0" rx="5" ry="18" fill="#141820" stroke="#55E6FF" stroke-width="2.2" filter="url(#cyanGlow)" />
      <circle cx="-180" cy="0" r="3" fill="#FACC15" />
      <!-- Tsuka (Handle with Diamond Wrap) -->
      <rect x="-275" y="-4" width="95" height="8" rx="2" fill="#0C0E14" stroke="#222834" stroke-width="1.2" />
      <line x1="-275" y1="0" x2="-180" y2="0" stroke="#55E6FF" stroke-width="5" stroke-dasharray="5 7" />
      <!-- Kashira (Gold Pommel Cap) -->
      <rect x="-282" y="-5" width="8" height="10" rx="2" fill="#FACC15" stroke="#00B4D8" stroke-width="1" />
      <!-- Kissaki (Sharp Tip Accent) -->
      <polygon points="280,-2.5 300,0 280,2.5" fill="#FFFFFF" filter="url(#cyanGlow)" />
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- CONNECTING CIRCUIT TRACES (Radar Vertices to Tactical Pods) -->
  <!-- ======================================================== -->
  <g>
    <!-- 01: Top (Vertex 450,115 to Pod 450,86) -->
    <line x1="450" y1="115" x2="450" y2="86" stroke="#FF3038" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="450" cy="86" r="3" fill="#FF3038" />

    <!-- 02: Top-Right (Vertex 555,179 to Pod 670,160) -->
    <polyline points="555,179 610,160 670,160" fill="none" stroke="#55E6FF" stroke-width="1.5" stroke-dasharray="4 3" />
    <circle cx="670" cy="160" r="3" fill="#55E6FF" />

    <!-- 03: Bottom-Right (Vertex 553,300 to Pod 670,320) -->
    <polyline points="553,300 610,320 670,320" fill="none" stroke="#A8ADB7" stroke-width="1.5" stroke-dasharray="4 3" />
    <circle cx="670" cy="320" r="3" fill="#A8ADB7" />

    <!-- 04: Bottom (Vertex 450,363 to Pod 450,394) -->
    <line x1="450" y1="363" x2="450" y2="394" stroke="#FF3038" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="450" cy="394" r="3" fill="#FF3038" />

    <!-- 05: Bottom-Left (Vertex 349,298 to Pod 230,320) -->
    <polyline points="349,298 290,320 230,320" fill="none" stroke="#A8ADB7" stroke-width="1.5" stroke-dasharray="4 3" />
    <circle cx="230" cy="320" r="3" fill="#A8ADB7" />

    <!-- 06: Top-Left (Vertex 352,183 to Pod 230,160) -->
    <polyline points="352,183 290,160 230,160" fill="none" stroke="#55E6FF" stroke-width="1.5" stroke-dasharray="4 3" />
    <circle cx="230" cy="160" r="3" fill="#55E6FF" />
  </g>

  <!-- ======================================================== -->
  <!-- TOPOLOGY RADAR GRAPH CENTER (450, 240) - MINIMAL & CRISP -->
  <!-- ======================================================== -->
  <g transform="translate(450, 240)">
    <!-- Ambient Center Radiant Glow -->
    <circle cx="0" cy="0" r="140" fill="url(#topCenterAura)" />

    <!-- Minimal Concentric Hexagons -->
    <!-- Outer Hexagon (r=130, 100% capacity) -->
    <polygon points="0,-130 112,-65 112,65 0,130 -112,65 -112,-65" fill="#0C0F15" fill-opacity="0.25" stroke="#1D2432" stroke-width="1.2" />
    <!-- Mid Hexagon (r=65, 50% capacity) -->
    <polygon points="0,-65 56,-32.5 56,32.5 0,65 -56,32.5 -56,-32.5" fill="none" stroke="#161C27" stroke-width="1" stroke-dasharray="3 4" />

    <!-- 6 Hexagonal Radial Axes -->
    <g stroke="#1F2736" stroke-width="1.2">
      <line x1="0" y1="0" x2="0" y2="-130" />
      <line x1="0" y1="0" x2="112" y2="-65" />
      <line x1="0" y1="0" x2="112" y2="65" />
      <line x1="0" y1="0" x2="0" y2="130" />
      <line x1="0" y1="0" x2="-112" y2="65" />
      <line x1="0" y1="0" x2="-112" y2="-65" />
    </g>

    <!-- Traveling Laser Pulses along Axes -->
    <g stroke="#FF3038" stroke-width="2" class="laser-axis">
      <line x1="0" y1="0" x2="0" y2="-130" />
      <line x1="0" y1="0" x2="112" y2="-65" />
      <line x1="0" y1="0" x2="112" y2="65" />
      <line x1="0" y1="0" x2="0" y2="130" />
      <line x1="0" y1="0" x2="-112" y2="65" />
      <line x1="0" y1="0" x2="-112" y2="-65" />
    </g>

    <!-- Active High-Discipline Polygon Web (96%, 94%, 92%, 95%, 90%, 88%) -->
    <polygon points="0,-125 105,-61 103,60 0,123 -101,58 -98,-57" 
             fill="#FF3038" fill-opacity="0.18" stroke="#FF3038" stroke-width="2.2" class="active-web-poly" filter="url(#topRedGlow)" />
    
    <!-- Secondary Precision Wireframe -->
    <polygon points="0,-125 105,-61 103,60 0,123 -101,58 -98,-57" 
             fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

    <!-- Minimal Radar Sweep Beam -->
    <g class="radar-sweep-blade">
      <line x1="0" y1="0" x2="0" y2="-130" stroke="#FF3038" stroke-width="1.5" opacity="0.8" />
      <path d="M 0 0 L 0 -130 A 130 130 0 0 1 45 -122 Z" fill="url(#topRadarSweep)" />
    </g>

    <!-- Center Samurai Crest Minimal Mon -->
    <circle cx="0" cy="0" r="22" fill="#0A0D12" stroke="#FF3038" stroke-width="2" />
    <polygon points="0,-9 7,-3 8,5 0,10 -8,5 -7,-3" fill="#141822" stroke="#FFF" stroke-width="1.2" />
    <path d="M -3 -3 L 0 2 L 3 -3" fill="none" stroke="#FF3038" stroke-width="1.5" />
    <circle cx="0" cy="4" r="1.5" fill="#55E6FF" />

    <!-- 6 Vertex Mastery Nodes -->
    <circle cx="0" cy="-125" r="4.5" fill="#FFF" stroke="#FF3038" stroke-width="2" class="node-pulse-white" />
    <circle cx="105" cy="-61" r="4.5" fill="#FFF" stroke="#FF3038" stroke-width="2" class="node-pulse-white" />
    <circle cx="103" cy="60" r="4.5" fill="#FFF" stroke="#FF3038" stroke-width="2" class="node-pulse-white" />
    <circle cx="0" cy="123" r="4.5" fill="#FFF" stroke="#FF3038" stroke-width="2" class="node-pulse-white" />
    <circle cx="-101" cy="58" r="4.5" fill="#FFF" stroke="#FF3038" stroke-width="2" class="node-pulse-white" />
    <circle cx="-98" cy="-57" r="4.5" fill="#FFF" stroke="#FF3038" stroke-width="2" class="node-pulse-white" />
  </g>

  <!-- ======================================================== -->
  <!-- 6 DISCIPLINE LABELS & TACTICAL PODS                     -->
  <!-- ======================================================== -->
  <!-- 01: Top Center - FRONTEND ARCHITECTURE -->
  <g transform="translate(450, 72)" text-anchor="middle">
    <rect x="-95" y="-14" width="190" height="28" rx="4" fill="#0C0E14" stroke="#FF3038" stroke-width="1.2" />
    <text x="0" y="4" font-family="'Orbitron', sans-serif" font-size="10.5" font-weight="900" fill="#FFF" letter-spacing="1">FRONTEND // KENJUTSU</text>
    <text x="0" y="24" font-family="'Courier New', monospace" font-size="9" font-weight="700" fill="#FF3038">REACT • NEXT.JS • 96%</text>
  </g>

  <!-- 02: Top Right - AI / ML INTELLECT -->
  <g transform="translate(680, 160)" text-anchor="start">
    <rect x="-10" y="-14" width="185" height="28" rx="4" fill="#0C0E14" stroke="#55E6FF" stroke-width="1.2" />
    <text x="5" y="4" font-family="'Orbitron', sans-serif" font-size="10.5" font-weight="900" fill="#FFF" letter-spacing="1">AI / ML // KAKUSHIN</text>
    <text x="5" y="24" font-family="'Courier New', monospace" font-size="9" font-weight="700" fill="#55E6FF">AGENTIC AI • LLMS • 94%</text>
  </g>

  <!-- 03: Bottom Right - SYSTEM DESIGN -->
  <g transform="translate(680, 320)" text-anchor="start">
    <rect x="-10" y="-14" width="185" height="28" rx="4" fill="#0C0E14" stroke="#222834" stroke-width="1.2" />
    <text x="5" y="4" font-family="'Orbitron', sans-serif" font-size="10.5" font-weight="900" fill="#FFF" letter-spacing="1">SYSTEM DESIGN</text>
    <text x="5" y="24" font-family="'Courier New', monospace" font-size="9" font-weight="700" fill="#A8ADB7">SCALABILITY • 92%</text>
  </g>

  <!-- 04: Bottom Center - BACKEND ENGINES -->
  <g transform="translate(450, 408)" text-anchor="middle">
    <rect x="-95" y="-14" width="190" height="28" rx="4" fill="#0C0E14" stroke="#FF3038" stroke-width="1.2" />
    <text x="0" y="4" font-family="'Orbitron', sans-serif" font-size="10.5" font-weight="900" fill="#FFF" letter-spacing="1">BACKEND // TAIJUTSU</text>
    <text x="0" y="24" font-family="'Courier New', monospace" font-size="9" font-weight="700" fill="#FF3038">NODE • EXPRESS • 95%</text>
  </g>

  <!-- 05: Bottom Left - DATABASE SYSTEMS -->
  <g transform="translate(220, 320)" text-anchor="end">
    <rect x="-175" y="-14" width="185" height="28" rx="4" fill="#0C0E14" stroke="#222834" stroke-width="1.2" />
    <text x="-5" y="4" font-family="'Orbitron', sans-serif" font-size="10.5" font-weight="900" fill="#FFF" letter-spacing="1">DATABASE ENGINE</text>
    <text x="-5" y="24" font-family="'Courier New', monospace" font-size="9" font-weight="700" fill="#A8ADB7">POSTGRES • MONGO • 90%</text>
  </g>

  <!-- 06: Top Left - DEVOPS & CLOUD -->
  <g transform="translate(220, 160)" text-anchor="end">
    <rect x="-175" y="-14" width="185" height="28" rx="4" fill="#0C0E14" stroke="#55E6FF" stroke-width="1.2" />
    <text x="-5" y="4" font-family="'Orbitron', sans-serif" font-size="10.5" font-weight="900" fill="#FFF" letter-spacing="1">CLOUD // YOROI</text>
    <text x="-5" y="24" font-family="'Courier New', monospace" font-size="9" font-weight="700" fill="#55E6FF">DOCKER • CI/CD • 88%</text>
  </g>
</svg>
