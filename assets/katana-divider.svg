<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 45" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="cyberDataRail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3038" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#FF4B4B" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#55E6FF" />
      <stop offset="100%" stop-color="#00A3FF" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="plasmaTravelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3038" stop-opacity="0" />
      <stop offset="30%" stop-color="#FF3038" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="70%" stop-color="#55E6FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#55E6FF" stop-opacity="0" />
    </linearGradient>

    <filter id="cyberGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes cyberTravel {
        0% { stroke-dashoffset: 1000; opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { stroke-dashoffset: -1000; opacity: 0; }
      }
      @keyframes nodePulse {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.3); opacity: 1; }
      }
      .cyber-beam {
        stroke-dasharray: 200 800;
        animation: cyberTravel 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .telemetry-node {
        transform-origin: center;
        animation: nodePulse 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base Track -->
  <rect x="20" y="19" width="960" height="6" rx="3" fill="#080A0D" stroke="#171B21" stroke-width="1" />

  <!-- Left Tech Cap [ // 0x1 ] -->
  <path d="M 20 15 L 28 15 L 28 29 L 20 29 Z" fill="#101318" stroke="#FF3038" stroke-width="1.2" />
  <circle cx="24" cy="22" r="1.5" fill="#FF3038" />

  <!-- Main Cyber Line -->
  <line x1="30" y1="22" x2="970" y2="22" stroke="#1E232D" stroke-width="1.5" />

  <!-- High-Energy Plasma Pulse -->
  <line x1="30" y1="22" x2="970" y2="22" stroke="url(#plasmaTravelGrad)" stroke-width="3" stroke-linecap="round" class="cyber-beam" filter="url(#cyberGlow)" />
  <line x1="30" y1="22" x2="970" y2="22" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" class="cyber-beam" />

  <!-- Right Tech Cap [ 0x1 // ] -->
  <path d="M 972 15 L 980 15 L 980 29 L 972 29 Z" fill="#101318" stroke="#55E6FF" stroke-width="1.2" />
  <circle cx="976" cy="22" r="1.5" fill="#55E6FF" />

  <!-- Telemetry Circuit Nodes -->
  <circle cx="160" cy="22" r="2.5" fill="#FF3038" class="telemetry-node" />
  <circle cx="340" cy="22" r="2" fill="#FFFFFF" class="telemetry-node" />
  <circle cx="660" cy="22" r="2" fill="#55E6FF" class="telemetry-node" />
  <circle cx="840" cy="22" r="2.5" fill="#00A3FF" class="telemetry-node" />

  <!-- Center HUD Telemetry Label -->
  <rect x="360" y="32" width="280" height="12" rx="2" fill="#0A0C10" stroke="#171B21" stroke-width="0.8" />
  <text x="500" y="41" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="7.5" font-weight="700" fill="#787F89" letter-spacing="3">CYBER INTERFACE // TELEMETRY STREAM 0x1</text>
</svg>
