<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="lang-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020204"/>
      <stop offset="50%" stop-color="#050509"/>
      <stop offset="100%" stop-color="#09090F"/>
    </linearGradient>

    <linearGradient id="ts-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A8FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <linearGradient id="js-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9100"/>
      <stop offset="100%" stop-color="#FFD600"/>
    </linearGradient>

    <linearGradient id="py-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E62429"/>
      <stop offset="100%" stop-color="#FF1744"/>
    </linearGradient>

    <linearGradient id="web-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#B388FF"/>
    </linearGradient>

    <linearGradient id="laser-scan-lang" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1B2D" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF1B2D" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="lang-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Styles and Animations -->
    <style>
      .lh-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 900; }
      .lh-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-weight: 800; }
      .lh-mono { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-weight: 800; }

      @keyframes lang-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes lang-pulse {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; filter: drop-shadow(0 0 8px #00E5FF); }
      }
      @keyframes spark-slide {
        0% { transform: translateX(0); opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { transform: translateX(480px); opacity: 0; }
      }
      @keyframes scan-vert-lang {
        0% { transform: translateY(12px); opacity: 0; }
        50% { opacity: 0.65; }
        100% { transform: translateY(348px); opacity: 0; }
      }
      @keyframes border-cycle-lang {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: -1000; }
      }

      .l-spin { transform-origin: 90px 180px; animation: lang-spin 22s linear infinite; }
      .l-pulse { animation: lang-pulse 3s ease-in-out infinite; }
      .l-spark-1 { animation: spark-slide 3.2s ease-in-out infinite; }
      .l-spark-2 { animation: spark-slide 4s ease-in-out infinite; }
      .l-spark-3 { animation: spark-slide 4.8s ease-in-out infinite; }
      .l-scan { animation: scan-vert-lang 6s linear infinite; }
      .l-border-laser { stroke-dasharray: 140 400; animation: border-cycle-lang 7s linear infinite; }
    </style>
  </defs>

  <!-- Dark Base Chassis -->
  <rect x="8" y="8" width="984" height="344" rx="10" fill="url(#lang-bg)" stroke="#8B93A7" stroke-opacity="0.2" stroke-width="1.2"/>

  <!-- Cut-Corner Angular Outer Frame Base -->
  <path d="M 32 10 L 968 10 L 990 32 L 990 328 L 968 350 L 32 350 L 10 328 L 10 32 Z" fill="none" stroke="#00A8FF" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Animated Running Laser Frame -->
  <path d="M 32 10 L 968 10 L 990 32 L 990 328 L 968 350 L 32 350 L 10 328 L 10 32 Z" fill="none" stroke="#00E5FF" stroke-width="2.5" class="l-border-laser" filter="url(#lang-glow)"/>

  <!-- Animated Scanline Sweep -->
  <line x1="16" y1="0" x2="984" y2="0" stroke="url(#laser-scan-lang)" stroke-width="1.5" class="l-scan"/>

  <!-- Corner Brackets -->
  <path d="M 6 45 L 6 6 L 45 6" fill="none" stroke="#FF1B2D" stroke-width="2.5"/>
  <path d="M 994 45 L 994 6 L 955 6" fill="none" stroke="#00E5FF" stroke-width="2.5"/>
  <path d="M 6 315 L 6 354 L 45 354" fill="none" stroke="#FF1B2D" stroke-width="2.5"/>
  <path d="M 994 315 L 994 354 L 955 354" fill="none" stroke="#00E5FF" stroke-width="2.5"/>

  <!-- ================================================================= -->
  <!-- HEADER SECTION: BOLD, VISIBLE TYPOGRAPHY                          -->
  <!-- ================================================================= -->
  <g transform="translate(30, 24)">
    <!-- Top Left Title Badge -->
    <rect x="0" y="0" width="280" height="28" rx="4" fill="#09090F" stroke="#FF1B2D" stroke-width="1.5"/>
    <circle cx="14" cy="14" r="4.5" fill="#FF1B2D" class="l-pulse"/>
    <text x="32" y="19" fill="#FFFFFF" font-size="13" class="lh-sub" letter-spacing="1.5">TECH ARSENAL // TELEMETRY</text>
  </g>

  <g transform="translate(710, 24)">
    <!-- Top Right Status Node -->
    <rect x="0" y="0" width="260" height="28" rx="4" fill="#09090F" stroke="#00E5FF" stroke-width="1.5"/>
    <circle cx="16" cy="14" r="4.5" fill="#00E5FF" class="l-pulse"/>
    <text x="32" y="19" fill="#00E5FF" font-size="13" class="lh-sub" letter-spacing="1">16 REPOSITORIES ANALYZED</text>
  </g>

  <!-- Title Center -->
  <g transform="translate(500, 78)" text-anchor="middle">
    <text x="-2" y="2" fill="#FF1B2D" font-size="30" class="lh-title" letter-spacing="4" opacity="0.8">TOP LANGUAGES USED</text>
    <text x="2" y="-2" fill="#00A8FF" font-size="30" class="lh-title" letter-spacing="4" opacity="0.8">TOP LANGUAGES USED</text>
    <text x="0" y="0" fill="#FFFFFF" font-size="30" class="lh-title" letter-spacing="4">TOP LANGUAGES USED</text>
    <text x="0" y="24" fill="#00E5FF" font-size="13.5" class="lh-sub" letter-spacing="2">
      PRODUCTION SYSTEMS // FULL STACK CODE DISTRIBUTION
    </text>
  </g>

  <!-- ================================================================= -->
  <!-- LEFT SIDE: ROTATING RADAR RETICLE                                 -->
  <!-- ================================================================= -->
  <g transform="translate(100, 220)">
    <g class="l-spin">
      <circle cx="0" cy="0" r="64" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="14 10 4 10" opacity="0.6"/>
      <circle cx="0" cy="0" r="52" fill="none" stroke="#FF1B2D" stroke-width="1.2" stroke-dasharray="24 16"/>
      <circle cx="0" cy="-64" r="3.5" fill="#00E5FF"/>
      <circle cx="0" cy="64" r="3.5" fill="#FF1B2D"/>
    </g>
    <!-- Core Hub -->
    <circle cx="0" cy="0" r="36" fill="#050509" stroke="#00A8FF" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" fill="#FFFFFF" font-size="18" class="lh-title" letter-spacing="1">&lt;/&gt;</text>
    <!-- Sub-label -->
    <rect x="-45" y="74" width="90" height="20" rx="3" fill="#09090F" stroke="#00E5FF" stroke-width="1"/>
    <text x="0" y="88" text-anchor="middle" fill="#00E5FF" font-size="10.5" class="lh-sub" letter-spacing="1">RADAR: LOCK</text>
  </g>

  <!-- ================================================================= -->
  <!-- RIGHT SIDE: LANGUAGE BARS & PERCENTAGES                           -->
  <!-- ================================================================= -->
  <g transform="translate(210, 130)">

    <!-- CUMULATIVE MULTI-COLOR BAR TRACK -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="750" height="18" rx="9" fill="#09090F" stroke="#8B93A7" stroke-opacity="0.3" stroke-width="1"/>
      <!-- TypeScript segment: 56.3% -> 422px -->
      <rect x="2" y="2" width="422" height="14" rx="7" fill="url(#ts-grad)"/>
      <!-- JavaScript segment: 31.2% -> 234px -->
      <rect x="426" y="2" width="234" height="14" rx="2" fill="url(#js-grad)"/>
      <!-- Python segment: 12.5% -> 90px -->
      <rect x="662" y="2" width="86" height="14" rx="7" fill="url(#py-grad)"/>
    </g>

    <!-- 1. TYPESCRIPT -->
    <g transform="translate(0, 36)">
      <circle cx="6" cy="14" r="5" fill="#00E5FF"/>
      <text x="22" y="19" fill="#FFFFFF" font-size="15" class="lh-title" letter-spacing="1">TypeScript</text>
      <text x="135" y="19" fill="#00E5FF" font-size="14" class="lh-mono" letter-spacing="1">56.3%</text>
      <text x="205" y="19" fill="#8B93A7" font-size="12" class="lh-sub">[ 9 Active Repositories ]</text>
      <!-- Progress Bar Track -->
      <rect x="0" y="28" width="750" height="10" rx="5" fill="#09090F" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="1"/>
      <rect x="1" y="29" width="422" height="8" rx="4" fill="url(#ts-grad)"/>
      <!-- Animated Sparkle -->
      <circle cx="2" cy="33" r="3" fill="#FFFFFF" class="l-spark-1" filter="url(#lang-glow)"/>
    </g>

    <!-- 2. JAVASCRIPT -->
    <g transform="translate(0, 88)">
      <circle cx="6" cy="14" r="5" fill="#FFD600"/>
      <text x="22" y="19" fill="#FFFFFF" font-size="15" class="lh-title" letter-spacing="1">JavaScript</text>
      <text x="135" y="19" fill="#FFD600" font-size="14" class="lh-mono" letter-spacing="1">31.2%</text>
      <text x="205" y="19" fill="#8B93A7" font-size="12" class="lh-sub">[ 5 Repositories // AJ-RUNNER &amp; WebGL ]</text>
      <!-- Progress Bar Track -->
      <rect x="0" y="28" width="750" height="10" rx="5" fill="#09090F" stroke="#FFD600" stroke-opacity="0.3" stroke-width="1"/>
      <rect x="1" y="29" width="234" height="8" rx="4" fill="url(#js-grad)"/>
      <!-- Animated Sparkle -->
      <circle cx="2" cy="33" r="3" fill="#FFFFFF" class="l-spark-2" filter="url(#lang-glow)"/>
    </g>

    <!-- 3. PYTHON -->
    <g transform="translate(0, 140)">
      <circle cx="6" cy="14" r="5" fill="#FF1744"/>
      <text x="22" y="19" fill="#FFFFFF" font-size="15" class="lh-title" letter-spacing="1">Python</text>
      <text x="135" y="19" fill="#FF1744" font-size="14" class="lh-mono" letter-spacing="1">12.5%</text>
      <text x="205" y="19" fill="#8B93A7" font-size="12" class="lh-sub">[ AI Systems &amp; Automation Pipelines ]</text>
      <!-- Progress Bar Track -->
      <rect x="0" y="28" width="750" height="10" rx="5" fill="#09090F" stroke="#FF1744" stroke-opacity="0.3" stroke-width="1"/>
      <rect x="1" y="29" width="94" height="8" rx="4" fill="url(#py-grad)"/>
      <!-- Animated Sparkle -->
      <circle cx="2" cy="33" r="3" fill="#FFFFFF" class="l-spark-3" filter="url(#lang-glow)"/>
    </g>
  </g>

  <!-- Bottom Accent Track Beam -->
  <line x1="30" y1="334" x2="970" y2="334" stroke="#8B93A7" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="160" y1="334" x2="840" y2="334" stroke="#00E5FF" stroke-width="2" class="l-border-laser"/>
</svg>
