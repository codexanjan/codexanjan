<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="100%" height="150" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes pulseGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
      @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes waveScroll { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
      @keyframes lineFade { 0%, 20% { opacity: 0; } 35%, 100% { opacity: 1; } }
      text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace; -webkit-font-smoothing: antialiased; }
      
    </style>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 245, 255, 0.08)" stroke-width="0.8"/>
      <circle cx="30" cy="0" r="0.8" fill="#00F5FF" opacity="0.3"/>
    </pattern>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>
    <linearGradient id="hud-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0.9"/>
    </linearGradient>
    
  </defs>
  <rect width="1200" height="150" fill="#04070D" />
  <rect width="1200" height="150" fill="url(#grid-pattern)" />
  
      <rect width="1200" height="150" fill="#04070D" />
      <text x="40" y="32" fill="#00F5FF" font-size="11" font-weight="800" letter-spacing="2">LANGUAGE_SPECTRUM // CONTINUOUS_DISTRIBUTION</text>
      <g transform="translate(40, 55)">
        <rect x="0" y="0" width="772" height="28" fill="#3178C6" rx="2" /><text x="14" y="18" fill="#FFF" font-size="10" font-weight="800">TypeScript 68.9%</text>
        <rect x="774" y="0" width="182" height="28" fill="#F7DF1E" /><text x="784" y="18" fill="#000" font-size="9" font-weight="800">JS 16.3%</text>
        <rect x="958" y="0" width="102" height="28" fill="#3572A5" /><text x="966" y="18" fill="#FFF" font-size="9" font-weight="800">Py 9.1%</text>
        <rect x="1062" y="0" width="50" height="28" fill="#563D7C" />
        <rect x="1114" y="0" width="14" height="28" fill="#E34C26" rx="2" />
      </g>
      
    <path d="M 12 22 L 12 12 L 22 12" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 1178 12 L 1188 12 L 1188 22" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 12 128 L 12 138 L 22 138" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 1178 138 L 1188 138 L 1188 128" fill="none" stroke="#00F5FF" stroke-width="1" />
  
    
</svg>
