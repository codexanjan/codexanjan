<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="350" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      @keyframes pulseGlow { 0%, 100% { opacity: 0.8; } 50% { opacity: 0.3; } }
      @keyframes cursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes waveScroll { 0% { stroke-dashoffset: 800; } 100% { stroke-dashoffset: 0; } }
      @keyframes lineFade { 0%, 20% { opacity: 0; } 35%, 100% { opacity: 1; } }
      text { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace; -webkit-font-smoothing: antialiased; }
      
    </style>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid-pattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 245, 255, 0.08)" stroke-width="0.8"/>
      <circle cx="30" cy="0" r="0.8" fill="#00F5FF" opacity="0.3"/>
    </pattern>
    <linearGradient id="cyan-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#3A86FF" />
    </linearGradient>
    <linearGradient id="hud-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39FF88" stop-opacity="0.9"/>
    </linearGradient>
    
  </defs>
  <rect width="1200" height="350" fill="#04070D" />
  <rect width="1200" height="350" fill="url(#grid-pattern)" />
  
      <rect width="1200" height="350" fill="#04070D" />
      <text x="40" y="32" fill="#00F5FF" font-size="11" font-weight="800" letter-spacing="2">LANGUAGE_MATRIX // CODEBASE_COMPOSITION</text>
      <text x="1160" y="32" fill="#39FF88" font-size="10" font-weight="700" text-anchor="end">PUBLIC_CODE_ANALYSIS</text>
      <line x1="40" y1="42" x2="1160" y2="42" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1" />

      <!-- TypeScript -->
      <g transform="translate(40, 65)">
        <rect width="1120" height="42" fill="#080D18" stroke="rgba(0, 245, 255, 0.25)" rx="2" />
        <circle cx="20" cy="21" r="5" fill="#3178C6" /><text x="36" y="26" fill="#EAFBFF" font-size="13" font-weight="800">TypeScript</text>
        <rect x="240" y="14" width="400" height="14" fill="#3178C6" rx="1" />
        <text x="660" y="26" fill="#00F5FF" font-size="12" font-weight="900">68.9%</text>
        <text x="1100" y="26" fill="#7894A6" font-size="10" text-anchor="end">1,972.4 KB</text>
      </g>

      <!-- JavaScript -->
      <g transform="translate(40, 117)">
        <rect width="1120" height="42" fill="#080D18" stroke="rgba(0, 245, 255, 0.25)" rx="2" />
        <circle cx="20" cy="21" r="5" fill="#F7DF1E" /><text x="36" y="26" fill="#EAFBFF" font-size="13" font-weight="800">JavaScript</text>
        <rect x="240" y="14" width="100" height="14" fill="#F7DF1E" rx="1" />
        <text x="360" y="26" fill="#00F5FF" font-size="12" font-weight="900">16.3%</text>
        <text x="1100" y="26" fill="#7894A6" font-size="10" text-anchor="end">466.5 KB</text>
      </g>

      <!-- Python -->
      <g transform="translate(40, 169)">
        <rect width="1120" height="42" fill="#080D18" stroke="rgba(0, 245, 255, 0.25)" rx="2" />
        <circle cx="20" cy="21" r="5" fill="#3572A5" /><text x="36" y="26" fill="#EAFBFF" font-size="13" font-weight="800">Python</text>
        <rect x="240" y="14" width="60" height="14" fill="#3572A5" rx="1" />
        <text x="320" y="26" fill="#00F5FF" font-size="12" font-weight="900">9.1%</text>
        <text x="1100" y="26" fill="#7894A6" font-size="10" text-anchor="end">261.5 KB</text>
      </g>

      <!-- CSS -->
      <g transform="translate(40, 221)">
        <rect width="1120" height="42" fill="#080D18" stroke="rgba(0, 245, 255, 0.25)" rx="2" />
        <circle cx="20" cy="21" r="5" fill="#563D7C" /><text x="36" y="26" fill="#EAFBFF" font-size="13" font-weight="800">CSS</text>
        <rect x="240" y="14" width="30" height="14" fill="#563D7C" rx="1" />
        <text x="290" y="26" fill="#00F5FF" font-size="12" font-weight="900">4.5%</text>
        <text x="1100" y="26" fill="#7894A6" font-size="10" text-anchor="end">127.6 KB</text>
      </g>

      <!-- HTML -->
      <g transform="translate(40, 273)">
        <rect width="1120" height="42" fill="#080D18" stroke="rgba(0, 245, 255, 0.25)" rx="2" />
        <circle cx="20" cy="21" r="5" fill="#E34C26" /><text x="36" y="26" fill="#EAFBFF" font-size="13" font-weight="800">HTML</text>
        <rect x="240" y="14" width="15" height="14" fill="#E34C26" rx="1" />
        <text x="270" y="26" fill="#00F5FF" font-size="12" font-weight="900">1.2%</text>
        <text x="1100" y="26" fill="#7894A6" font-size="10" text-anchor="end">34.2 KB</text>
      </g>
      
    <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 1176 12 L 1188 12 L 1188 24" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 12 326 L 12 338 L 24 338" fill="none" stroke="#00F5FF" stroke-width="1" />
    <path d="M 1176 338 L 1188 338 L 1188 326" fill="none" stroke="#00F5FF" stroke-width="1" />
  
    
</svg>
