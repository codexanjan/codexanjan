<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 580" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="panel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06070E"/>
      <stop offset="50%" stop-color="#0A0D1B"/>
      <stop offset="100%" stop-color="#04050A"/>
    </linearGradient>

    <linearGradient id="card-inner-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1224"/>
      <stop offset="100%" stop-color="#080A15"/>
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>

    <linearGradient id="gold-glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FFE082"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="flame-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono-text { font-family: 'Fira Code', 'Consolas', monospace; }
      .sans-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

      @keyframes telemetry-pulse {
        0%, 100% { opacity: 0.9; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.03); filter: drop-shadow(0 0 10px #FF1B2D); }
      }
      @keyframes spin-ring {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes flame-pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; filter: drop-shadow(0 0 6px #FFB300); }
        50% { transform: scale(1.18); opacity: 1; filter: drop-shadow(0 0 16px #FF1B2D) drop-shadow(0 0 20px #FFB300); }
      }
      @keyframes scan-horizontal {
        0% { transform: translateX(-10px); opacity: 0; }
        50% { opacity: 0.55; }
        100% { transform: translateX(1190px); opacity: 0; }
      }

      .pulse-item { transform-origin: center; animation: telemetry-pulse 3s ease-in-out infinite; }
      .spin-circle { transform-origin: center; animation: spin-ring 24s linear infinite; }
      .flame-anim { transform-origin: center; animation: flame-pulse 2s ease-in-out infinite; }
      .scan-line { animation: scan-horizontal 6.5s linear infinite; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1180" height="580" fill="url(#panel-bg)" rx="16" stroke="#1E293B" stroke-width="1.6"/>

  <!-- Multiverse Ambient Lighting -->
  <circle cx="240" cy="180" r="180" fill="#FF1B2D" opacity="0.07" filter="blur(70px)"/>
  <circle cx="940" cy="180" r="180" fill="#00E5FF" opacity="0.07" filter="blur(70px)"/>
  <circle cx="240" cy="450" r="180" fill="#00E5FF" opacity="0.07" filter="blur(70px)"/>
  <circle cx="940" cy="450" r="180" fill="#FF1B2D" opacity="0.07" filter="blur(70px)"/>

  <!-- Technical Corner Accents -->
  <path d="M 16 42 L 16 16 L 42 16" fill="none" stroke="#FF1B2D" stroke-width="3"/>
  <path d="M 1164 42 L 1164 16 L 1138 16" fill="none" stroke="#00E5FF" stroke-width="3"/>
  <path d="M 16 538 L 16 564 L 42 564" fill="none" stroke="#FF1B2D" stroke-width="3"/>
  <path d="M 1164 538 L 1164 564 L 1138 564" fill="none" stroke="#00E5FF" stroke-width="3"/>

  <!-- ======================================================== -->
  <!-- TOP CENTER PILL: SPIDER-NET CODE ENGINE: OPERATIONAL    -->
  <!-- ======================================================== -->
  <g transform="translate(590, 42)" text-anchor="middle">
    <!-- Cyber Shield Icon -->
    <path d="M -185 -13 L -171 -20 L -157 -13 L -157 0 C -157 10 -171 17 -171 17 C -171 17 -185 10 -185 0 Z" fill="#0D1B2A" stroke="url(#shield-grad)" stroke-width="1.8"/>
    <circle cx="-171" cy="-1" r="3.5" fill="#00E5FF"/>

    <text x="0" y="2" dominant-baseline="central" fill="#FFD700" font-size="16.5" font-weight="900" class="mono-text" letter-spacing="3.5">
      SPIDER-NET CODE ENGINE: OPERATIONAL
    </text>
    <line x1="-270" y1="22" x2="270" y2="22" stroke="#334155" stroke-opacity="0.4" stroke-width="1.2"/>
  </g>

  <!-- ======================================================== -->
  <!-- CARD 1: SPIDER-NET METRICS (Top Left)                   -->
  <!-- ======================================================== -->
  <g transform="translate(25, 78)">
    <rect width="555" height="235" rx="10" fill="url(#card-inner-bg)" stroke="#FFB300" stroke-opacity="0.45" stroke-width="1.4"/>
    <path d="M 0 20 L 0 0 L 20 0" fill="none" stroke="#FFB300" stroke-width="2.5"/>
    <path d="M 555 215 L 555 235 L 535 235" fill="none" stroke="#FFB300" stroke-width="2.5"/>

    <!-- Header -->
    <circle cx="24" cy="25" r="4.5" fill="#00E5FF"/>
    <text x="38" y="29" fill="#FFD700" font-size="12.5" font-weight="900" class="mono-text" letter-spacing="1.5">
      SPIDER-NET METRICS
    </text>
    <path d="M 515 21 L 528 25 L 515 29" fill="none" stroke="#FFD700" stroke-width="1.8"/>

    <!-- Metrics List -->
    <g transform="translate(24, 62)" font-size="12" class="mono-text">
      <!-- Stars -->
      <polygon points="7,2 9,8 15,8 10,12 12,18 7,14 2,18 4,12 0,8 6,8" fill="#FFB300"/>
      <text x="26" y="12" fill="#94A3B8">Total Stars Earned:</text>
      <text x="240" y="12" fill="#FFFFFF" font-weight="900" text-anchor="end">73</text>

      <!-- Commits -->
      <circle cx="7" cy="38" r="6" fill="none" stroke="#00E5FF" stroke-width="1.4"/>
      <line x1="7" y1="38" x2="7" y2="34" stroke="#00E5FF" stroke-width="1.4"/>
      <line x1="7" y1="38" x2="11" y2="38" stroke="#00E5FF" stroke-width="1.4"/>
      <text x="26" y="42" fill="#94A3B8">Total Commits (2026):</text>
      <text x="240" y="42" fill="#FFFFFF" font-weight="900" text-anchor="end">82</text>

      <!-- PRs -->
      <circle cx="5" cy="70" r="3" fill="#FF1B2D"/>
      <circle cx="10" cy="63" r="3" fill="#00E5FF"/>
      <path d="M 5 72 L 5 77 C 5 79 10 79 10 66" fill="none" stroke="#94A3B8" stroke-width="1.2"/>
      <text x="26" y="72" fill="#94A3B8">Total PRs:</text>
      <text x="240" y="72" fill="#FFFFFF" font-weight="900" text-anchor="end">1</text>

      <!-- Issues -->
      <circle cx="7" cy="100" r="6" fill="none" stroke="#FF1B2D" stroke-width="1.4"/>
      <circle cx="7" cy="100" r="2.5" fill="#FF1B2D"/>
      <text x="26" y="102" fill="#94A3B8">Total Issues:</text>
      <text x="240" y="102" fill="#FFFFFF" font-weight="900" text-anchor="end">0</text>

      <!-- Contributed To -->
      <rect x="2" y="126" width="10" height="10" rx="2" fill="none" stroke="#FFD700" stroke-width="1.4"/>
      <text x="26" y="133" fill="#94A3B8">Contributed to (yr):</text>
      <text x="240" y="133" fill="#FFFFFF" font-weight="900" text-anchor="end">27</text>
    </g>

    <!-- Circular Rank Gauge (Right Side of Card 1) -->
    <g transform="translate(425, 138)">
      <!-- Outer Track -->
      <circle cx="0" cy="0" r="50" fill="none" stroke="#1E293B" stroke-width="8"/>
      <!-- Glowing Score Arc -->
      <circle cx="0" cy="0" r="50" fill="none" stroke="#FFD700" stroke-width="8" stroke-dasharray="245 70" stroke-linecap="round" filter="url(#neon-glow)"/>
      <circle cx="0" cy="0" r="38" fill="#05060B" stroke="#334155" stroke-width="1.2"/>
      <!-- Rank Text -->
      <text x="0" y="-4" dominant-baseline="central" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="900" class="mono-text">A+</text>
      <text x="0" y="18" dominant-baseline="central" text-anchor="middle" fill="#FFD700" font-size="10" font-weight="800" class="mono-text" letter-spacing="1.5">RANK</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- CARD 2: STREAK PROTOCOL // CADENCE (Top Right)          -->
  <!-- ======================================================== -->
  <g transform="translate(600, 78)">
    <rect width="555" height="235" rx="10" fill="url(#card-inner-bg)" stroke="#FFB300" stroke-opacity="0.45" stroke-width="1.4"/>
    <path d="M 0 20 L 0 0 L 20 0" fill="none" stroke="#FFB300" stroke-width="2.5"/>
    <path d="M 555 215 L 555 235 L 535 235" fill="none" stroke="#FFB300" stroke-width="2.5"/>

    <!-- Decorative Top Right Wing -->
    <path d="M 505 21 L 518 25 L 505 29" fill="none" stroke="#FFD700" stroke-width="1.8"/>

    <!-- 1. Left Stat: Total Contributions -->
    <g transform="translate(90, 126)" text-anchor="middle">
      <text x="0" y="-15" fill="#FFFFFF" font-size="42" font-weight="900" class="mono-text">88</text>
      <text x="0" y="20" fill="#94A3B8" font-size="11.5" font-weight="700" class="sans-text">Total Contributions</text>
      <text x="0" y="38" fill="#64748B" font-size="10" font-weight="600" class="mono-text">Apr 20 - Present</text>
    </g>

    <!-- 2. Center Stat: Current Streak with Flame Beacon -->
    <g transform="translate(278, 126)" text-anchor="middle">
      <!-- Flame Beacon -->
      <g transform="translate(0, -56)" class="flame-anim">
        <path d="M 0 -13 C 8 -4 10 5 0 18 C -10 5 -8 -4 0 -13 Z" fill="#FFD700" filter="url(#flame-glow)"/>
        <path d="M 0 -6 C 4 0 5 5 0 11 C -5 5 -4 0 0 -6 Z" fill="#FF1B2D"/>
      </g>

      <!-- Glowing Streak Circle -->
      <circle cx="0" cy="0" r="38" fill="#080A14" stroke="#FFD700" stroke-width="3.5" filter="url(#neon-glow)"/>
      <circle cx="0" cy="0" r="31" fill="#04050A" stroke="#FF1B2D" stroke-width="1.2"/>
      <text x="0" y="2" dominant-baseline="central" fill="#FFFFFF" font-size="30" font-weight="900" class="mono-text">3</text>

      <text x="0" y="52" fill="#FFD700" font-size="12" font-weight="900" class="mono-text" letter-spacing="1">Current Streak</text>
      <text x="0" y="68" fill="#64748B" font-size="10" font-weight="600" class="mono-text">Sep 4 - Sep 6</text>
    </g>

    <!-- 3. Right Stat: Longest Streak -->
    <g transform="translate(465, 126)" text-anchor="middle">
      <text x="0" y="-15" fill="#FFFFFF" font-size="42" font-weight="900" class="mono-text">4</text>
      <text x="0" y="20" fill="#94A3B8" font-size="11.5" font-weight="700" class="sans-text">Longest Streak</text>
      <text x="0" y="38" fill="#64748B" font-size="10" font-weight="600" class="mono-text">Jun 6 - Jun 9</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- CARD 3: TOP LANGUAGES (BY REPO) (Bottom Left)           -->
  <!-- ======================================================== -->
  <g transform="translate(25, 330)">
    <rect width="555" height="235" rx="10" fill="url(#card-inner-bg)" stroke="#FFB300" stroke-opacity="0.45" stroke-width="1.4"/>
    <path d="M 0 20 L 0 0 L 20 0" fill="none" stroke="#FFB300" stroke-width="2.5"/>
    <path d="M 555 215 L 555 235 L 535 235" fill="none" stroke="#FFB300" stroke-width="2.5"/>

    <!-- Header -->
    <circle cx="24" cy="25" r="4.5" fill="#FFD700"/>
    <text x="38" y="29" fill="#FFD700" font-size="12.5" font-weight="900" class="mono-text" letter-spacing="1.5">
      TOP LANGUAGES (BY REPO)
    </text>
    <path d="M 515 21 L 528 25 L 515 29" fill="none" stroke="#FFD700" stroke-width="1.8"/>

    <!-- Horizontal Language Progress Bars -->
    <g transform="translate(24, 64)" font-size="11.5" class="mono-font">
      <!-- JavaScript 38% -->
      <rect x="0" y="0" width="9" height="9" rx="2" fill="#F7DF1E"/>
      <text x="18" y="9" fill="#FFFFFF">JavaScript</text>
      <rect x="110" y="2" width="100" height="7" rx="3.5" fill="#1E293B"/>
      <rect x="110" y="2" width="68" height="7" rx="3.5" fill="#F7DF1E"/>
      <text x="235" y="9" fill="#94A3B8" text-anchor="end">38%</text>

      <!-- Dart 26% -->
      <rect x="0" y="26" width="9" height="9" rx="2" fill="#00E5FF"/>
      <text x="18" y="35" fill="#FFFFFF">Dart</text>
      <rect x="110" y="28" width="100" height="7" rx="3.5" fill="#1E293B"/>
      <rect x="110" y="28" width="50" height="7" rx="3.5" fill="#00E5FF"/>
      <text x="235" y="35" fill="#94A3B8" text-anchor="end">26%</text>

      <!-- HTML 16% -->
      <rect x="0" y="52" width="9" height="9" rx="2" fill="#FF5722"/>
      <text x="18" y="61" fill="#FFFFFF">HTML</text>
      <rect x="110" y="54" width="100" height="7" rx="3.5" fill="#1E293B"/>
      <rect x="110" y="54" width="34" height="7" rx="3.5" fill="#FF5722"/>
      <text x="235" y="61" fill="#94A3B8" text-anchor="end">16%</text>

      <!-- Kotlin 12% -->
      <rect x="0" y="78" width="9" height="9" rx="2" fill="#8B5CF6"/>
      <text x="18" y="87" fill="#FFFFFF">Kotlin</text>
      <rect x="110" y="80" width="100" height="7" rx="3.5" fill="#1E293B"/>
      <rect x="110" y="80" width="24" height="7" rx="3.5" fill="#8B5CF6"/>
      <text x="235" y="87" fill="#94A3B8" text-anchor="end">12%</text>

      <!-- Python 8% -->
      <rect x="0" y="104" width="9" height="9" rx="2" fill="#3776AB"/>
      <text x="18" y="113" fill="#FFFFFF">Python</text>
      <rect x="110" y="106" width="100" height="7" rx="3.5" fill="#1E293B"/>
      <rect x="110" y="106" width="16" height="7" rx="3.5" fill="#3776AB"/>
      <text x="235" y="113" fill="#94A3B8" text-anchor="end">8%</text>
    </g>

    <!-- Donut Chart with Center Spider Emblem (radius 44) -->
    <g transform="translate(425, 134)">
      <!-- Donut Segments (circumference ~ 276) -->
      <circle cx="0" cy="0" r="44" fill="none" stroke="#1E293B" stroke-width="14"/>
      <!-- JS: 38% -> 105 -->
      <circle cx="0" cy="0" r="44" fill="none" stroke="#F7DF1E" stroke-width="14" stroke-dasharray="105 171" stroke-dashoffset="0"/>
      <!-- Dart: 26% -> 72 -->
      <circle cx="0" cy="0" r="44" fill="none" stroke="#00E5FF" stroke-width="14" stroke-dasharray="72 204" stroke-dashoffset="-105"/>
      <!-- HTML: 16% -> 44 -->
      <circle cx="0" cy="0" r="44" fill="none" stroke="#FF5722" stroke-width="14" stroke-dasharray="44 232" stroke-dashoffset="-177"/>
      <!-- Kotlin: 12% -> 33 -->
      <circle cx="0" cy="0" r="44" fill="none" stroke="#8B5CF6" stroke-width="14" stroke-dasharray="33 243" stroke-dashoffset="-221"/>
      <!-- Python: 8% -> 22 -->
      <circle cx="0" cy="0" r="44" fill="none" stroke="#3776AB" stroke-width="14" stroke-dasharray="22 254" stroke-dashoffset="-254"/>

      <!-- Inner Core & Spider Icon -->
      <circle cx="0" cy="0" r="33" fill="#060812"/>
      <polygon points="0,-12 7,-4 0,6 -7,-4" fill="#FF1B2D"/>
      <polygon points="0,4 5,11 0,16 -5,11" fill="#00E5FF"/>
      <path d="M -4 -6 L -10 -10 M 4 -6 L 10 -10 M -5 0 L -11 0 M 5 0 L 11 0 M -4 6 L -10 10 M 4 6 L 10 10" stroke="#FFFFFF" stroke-width="1.2" fill="none"/>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- CARD 4: TOP LANGUAGES (BY COMMIT) (Bottom Right)        -->
  <!-- ======================================================== -->
  <g transform="translate(600, 330)">
    <rect width="555" height="235" rx="10" fill="url(#card-inner-bg)" stroke="#FFB300" stroke-opacity="0.45" stroke-width="1.4"/>
    <path d="M 0 20 L 0 0 L 20 0" fill="none" stroke="#FFB300" stroke-width="2.5"/>
    <path d="M 555 215 L 555 235 L 535 235" fill="none" stroke="#FFB300" stroke-width="2.5"/>

    <!-- Header -->
    <circle cx="24" cy="25" r="4.5" fill="#00E5FF"/>
    <text x="38" y="29" fill="#FFD700" font-size="12.5" font-weight="900" class="mono-text" letter-spacing="1.5">
      TOP LANGUAGES (BY COMMIT)
    </text>
    <path d="M 515 21 L 528 25 L 515 29" fill="none" stroke="#FFD700" stroke-width="1.8"/>

    <!-- Horizontal Language Progress Bars -->
    <g transform="translate(24, 64)" font-size="11.5" class="mono-font">
      <!-- Python 44% -->
      <rect x="0" y="0" width="9" height="9" rx="2" fill="#00E5FF"/>
      <text x="18" y="9" fill="#FFFFFF">Python</text>
      <rect x="110" y="2" width="100" height="7" rx="3.5" fill="#1E293B"/>
      <rect x="110" y="2" width="76" height="7" rx="3.5" fill="#00E5FF"/>
      <text x="235" y="9" fill="#94A3B8" text-anchor="end">44%</text>

      <!-- TypeScript 22% -->
      <rect x="0" y="26" width="9" height="9" rx="2" fill="#FFD700"/>
      <text x="18" y="35" fill="#FFFFFF">TypeScript</text>
      <rect x="110" y="28" width="100" height="7" rx="3.5" fill="#1E293B"/>
      <rect x="110" y="28" width="44" height="7" rx="3.5" fill="#FFD700"/>
      <text x="235" y="35" fill="#94A3B8" text-anchor="end">22%</text>

      <!-- Dart 15% -->
      <rect x="0" y="52" width="9" height="9" rx="2" fill="#21D4FD"/>
      <text x="18" y="61" fill="#FFFFFF">Dart</text>
      <rect x="110" y="54" width="100" height="7" rx="3.5" fill="#1E293B"/>
      <rect x="110" y="54" width="30" height="7" rx="3.5" fill="#21D4FD"/>
      <text x="235" y="61" fill="#94A3B8" text-anchor="end">15%</text>

      <!-- JavaScript 11% -->
      <rect x="0" y="78" width="9" height="9" rx="2" fill="#FF7043"/>
      <text x="18" y="87" fill="#FFFFFF">JavaScript</text>
      <rect x="110" y="80" width="100" height="7" rx="3.5" fill="#1E293B"/>
      <rect x="110" y="80" width="22" height="7" rx="3.5" fill="#FF7043"/>
      <text x="235" y="87" fill="#94A3B8" text-anchor="end">11%</text>

      <!-- HTML 8% -->
      <rect x="0" y="104" width="9" height="9" rx="2" fill="#FF1B2D"/>
      <text x="18" y="113" fill="#FFFFFF">HTML</text>
      <rect x="110" y="106" width="100" height="7" rx="3.5" fill="#1E293B"/>
      <rect x="110" y="106" width="16" height="7" rx="3.5" fill="#FF1B2D"/>
      <text x="235" y="113" fill="#94A3B8" text-anchor="end">8%</text>
    </g>

    <!-- Donut Chart with Center Spider Emblem (radius 44) -->
    <g transform="translate(425, 134)">
      <!-- Donut Segments (circumference ~ 276) -->
      <circle cx="0" cy="0" r="44" fill="none" stroke="#1E293B" stroke-width="14"/>
      <!-- Python: 44% -> 122 -->
      <circle cx="0" cy="0" r="44" fill="none" stroke="#00E5FF" stroke-width="14" stroke-dasharray="122 154" stroke-dashoffset="0"/>
      <!-- TS: 22% -> 61 -->
      <circle cx="0" cy="0" r="44" fill="none" stroke="#FFD700" stroke-width="14" stroke-dasharray="61 215" stroke-dashoffset="-122"/>
      <!-- Dart: 15% -> 41 -->
      <circle cx="0" cy="0" r="44" fill="none" stroke="#21D4FD" stroke-width="14" stroke-dasharray="41 235" stroke-dashoffset="-183"/>
      <!-- JS: 11% -> 30 -->
      <circle cx="0" cy="0" r="44" fill="none" stroke="#FF7043" stroke-width="14" stroke-dasharray="30 246" stroke-dashoffset="-224"/>
      <!-- HTML: 8% -> 22 -->
      <circle cx="0" cy="0" r="44" fill="none" stroke="#FF1B2D" stroke-width="14" stroke-dasharray="22 254" stroke-dashoffset="-254"/>

      <!-- Inner Core & Spider Icon -->
      <circle cx="0" cy="0" r="33" fill="#060812"/>
      <polygon points="0,-12 7,-4 0,6 -7,-4" fill="#00E5FF"/>
      <polygon points="0,4 5,11 0,16 -5,11" fill="#FF1B2D"/>
      <path d="M -4 -6 L -10 -10 M 4 -6 L 10 -10 M -5 0 L -11 0 M 5 0 L 11 0 M -4 6 L -10 10 M 4 6 L 10 10" stroke="#FFFFFF" stroke-width="1.2" fill="none"/>
    </g>
  </g>

  <!-- Horizontal Laser Scanline -->
  <line x1="0" y1="0" x2="0" y2="580" stroke="#00E5FF" stroke-width="2" opacity="0.35" class="scan-line"/>
</svg>
