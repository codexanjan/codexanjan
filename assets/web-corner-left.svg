<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="120" height="120">
  <defs>
    <filter id="corner-glow-left" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Geometric Web Strands Emanating from Top-Left (0,0) -->
  <!-- Primary Radial Strands -->
  <line x1="0" y1="0" x2="160" y2="20" stroke="#FF1B2D" stroke-width="1.5" stroke-opacity="0.8" filter="url(#corner-glow-left)"/>
  <line x1="0" y1="0" x2="140" y2="60" stroke="#FF1B2D" stroke-width="1.2" stroke-opacity="0.6"/>
  <line x1="0" y1="0" x2="110" y2="110" stroke="#00A8FF" stroke-width="1.5" stroke-opacity="0.8" filter="url(#corner-glow-left)"/>
  <line x1="0" y1="0" x2="60" y2="140" stroke="#00A8FF" stroke-width="1.2" stroke-opacity="0.6"/>
  <line x1="0" y1="0" x2="20" y2="160" stroke="#21D4FD" stroke-width="1.5" stroke-opacity="0.8" filter="url(#corner-glow-left)"/>

  <!-- Concentric Geometric Web Bridges -->
  <!-- Ring 1 (Inner) -->
  <path d="M 40 5 L 35 15 L 28 28 L 15 35 L 5 40" fill="none" stroke="#FF1B2D" stroke-width="1" stroke-opacity="0.5"/>
  <!-- Ring 2 (Middle) -->
  <path d="M 80 10 L 70 30 L 55 55 L 30 70 L 10 80" fill="none" stroke="#F5F7FA" stroke-width="1" stroke-opacity="0.4"/>
  <!-- Ring 3 (Outer) -->
  <path d="M 120 15 L 105 45 L 82 82 L 45 105 L 15 120" fill="none" stroke="#00A8FF" stroke-width="1.2" stroke-opacity="0.6"/>
  <!-- Ring 4 (Edge Boundary) -->
  <path d="M 155 19 L 136 58 L 107 107 L 58 136 L 19 155" fill="none" stroke="#21D4FD" stroke-width="1.4" stroke-opacity="0.75"/>

  <!-- Technical Circuit Intersect Nodes -->
  <circle cx="40" cy="5" r="1.5" fill="#FF1B2D"/>
  <circle cx="28" cy="28" r="2" fill="#FF1B2D"/>
  <circle cx="5" cy="40" r="1.5" fill="#FF1B2D"/>
  <circle cx="80" cy="10" r="2" fill="#FF1B2D"/>
  <circle cx="55" cy="55" r="2.5" fill="#21D4FD"/>
  <circle cx="10" cy="80" r="2" fill="#00A8FF"/>
  <circle cx="120" cy="15" r="2" fill="#00A8FF"/>
  <circle cx="82" cy="82" r="2.5" fill="#21D4FD"/>
  <circle cx="15" cy="120" r="2" fill="#00A8FF"/>
  <circle cx="155" cy="19" r="2.5" fill="#21D4FD"/>
  <circle cx="107" cy="107" r="3" fill="#21D4FD" filter="url(#corner-glow-left)"/>
  <circle cx="19" cy="155" r="2.5" fill="#21D4FD"/>

  <!-- Origin Anchor Bracket -->
  <path d="M 0 20 L 0 0 L 20 0" fill="none" stroke="#FF1B2D" stroke-width="2.5"/>
</svg>
