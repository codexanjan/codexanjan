<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="trCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0E" />
      <stop offset="50%" stop-color="#050608" />
      <stop offset="100%" stop-color="#0D1017" />
    </linearGradient>
    <linearGradient id="trophyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FFA500" />
    </linearGradient>
    <linearGradient id="trophyRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3038" />
      <stop offset="100%" stop-color="#FF6B72" />
    </linearGradient>
    <linearGradient id="trophyCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55E6FF" />
      <stop offset="100%" stop-color="#00A3C4" />
    </linearGradient>
    <filter id="trGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="900" height="160" rx="8" fill="url(#trCardBg)" stroke="#171C25" stroke-width="1.5" />

  <!-- 8 Trophy Slots Centered -->
  <g transform="translate(45, 18)" font-family="'Courier New', Consolas, monospace" text-anchor="middle">
    <!-- Trophy 1: Stars (Grade A) -->
    <g transform="translate(35, 0)">
      <text x="0" y="12" font-size="9.5" fill="#6A7280" font-weight="700">Stars</text>
      <!-- Cup Icon -->
      <g transform="translate(0, 48)">
        <path d="M-14,-22 L14,-22 L10,6 C7,14 -7,14 -10,6 Z" fill="#121620" stroke="url(#trophyCyan)" stroke-width="1.8" filter="url(#trGlow)" />
        <path d="M-14,-16 C-22,-16 -22,-6 -14,-6" fill="none" stroke="url(#trophyCyan)" stroke-width="1.6" />
        <path d="M14,-16 C22,-16 22,-6 14,-6" fill="none" stroke="url(#trophyCyan)" stroke-width="1.6" />
        <rect x="-4" y="14" width="8" height="8" fill="#1C2330" />
        <rect x="-12" y="22" width="24" height="4" rx="1" fill="url(#trophyCyan)" />
        <text x="0" y="-3" font-family="'Orbitron', sans-serif" font-size="12" font-weight="900" fill="#FFF">A</text>
      </g>
      <text x="0" y="92" font-size="9" fill="#F4F4F2" font-weight="700">Super Star</text>
      <text x="0" y="106" font-size="8.5" fill="#55E6FF">164 pt</text>
      <line x1="-30" y1="114" x2="30" y2="114" stroke="#55E6FF" stroke-width="2" />
    </g>

    <!-- Trophy 2: Commits (Grade A) -->
    <g transform="translate(138, 0)">
      <text x="0" y="12" font-size="9.5" fill="#6A7280" font-weight="700">Commits</text>
      <g transform="translate(0, 48)">
        <path d="M-14,-22 L14,-22 L10,6 C7,14 -7,14 -10,6 Z" fill="#121620" stroke="url(#trophyCyan)" stroke-width="1.8" filter="url(#trGlow)" />
        <path d="M-14,-16 C-22,-16 -22,-6 -14,-6" fill="none" stroke="url(#trophyCyan)" stroke-width="1.6" />
        <path d="M14,-16 C22,-16 22,-6 14,-6" fill="none" stroke="url(#trophyCyan)" stroke-width="1.6" />
        <rect x="-4" y="14" width="8" height="8" fill="#1C2330" />
        <rect x="-12" y="22" width="24" height="4" rx="1" fill="url(#trophyCyan)" />
        <text x="0" y="-3" font-family="'Orbitron', sans-serif" font-size="12" font-weight="900" fill="#FFF">A</text>
      </g>
      <text x="0" y="92" font-size="9" fill="#F4F4F2" font-weight="700">High Committer</text>
      <text x="0" y="106" font-size="8.5" fill="#55E6FF">127 pt</text>
      <line x1="-30" y1="114" x2="30" y2="114" stroke="#55E6FF" stroke-width="2" />
    </g>

    <!-- Trophy 3: Followers (Grade B) -->
    <g transform="translate(241, 0)">
      <text x="0" y="12" font-size="9.5" fill="#6A7280" font-weight="700">Followers</text>
      <g transform="translate(0, 48)">
        <path d="M-14,-22 L14,-22 L10,6 C7,14 -7,14 -10,6 Z" fill="#121620" stroke="url(#trophyRed)" stroke-width="1.8" filter="url(#trGlow)" />
        <path d="M-14,-16 C-22,-16 -22,-6 -14,-6" fill="none" stroke="url(#trophyRed)" stroke-width="1.6" />
        <path d="M14,-16 C22,-16 22,-6 14,-6" fill="none" stroke="url(#trophyRed)" stroke-width="1.6" />
        <rect x="-4" y="14" width="8" height="8" fill="#1C2330" />
        <rect x="-12" y="22" width="24" height="4" rx="1" fill="url(#trophyRed)" />
        <text x="0" y="-3" font-family="'Orbitron', sans-serif" font-size="12" font-weight="900" fill="#FFF">B</text>
      </g>
      <text x="0" y="92" font-size="9" fill="#F4F4F2" font-weight="700">Many Friends</text>
      <text x="0" y="106" font-size="8.5" fill="#FF3038">17 pt</text>
      <line x1="-30" y1="114" x2="30" y2="114" stroke="#FF3038" stroke-width="2" />
    </g>

    <!-- Trophy 4: Repositories (Grade B) -->
    <g transform="translate(344, 0)">
      <text x="0" y="12" font-size="9.5" fill="#6A7280" font-weight="700">Repositories</text>
      <g transform="translate(0, 48)">
        <path d="M-14,-22 L14,-22 L10,6 C7,14 -7,14 -10,6 Z" fill="#121620" stroke="url(#trophyRed)" stroke-width="1.8" filter="url(#trGlow)" />
        <path d="M-14,-16 C-22,-16 -22,-6 -14,-6" fill="none" stroke="url(#trophyRed)" stroke-width="1.6" />
        <path d="M14,-16 C22,-16 22,-6 14,-6" fill="none" stroke="url(#trophyRed)" stroke-width="1.6" />
        <rect x="-4" y="14" width="8" height="8" fill="#1C2330" />
        <rect x="-12" y="22" width="24" height="4" rx="1" fill="url(#trophyRed)" />
        <text x="0" y="-3" font-family="'Orbitron', sans-serif" font-size="12" font-weight="900" fill="#FFF">B</text>
      </g>
      <text x="0" y="92" font-size="9" fill="#F4F4F2" font-weight="700">Repo Creator</text>
      <text x="0" y="106" font-size="8.5" fill="#FF3038">18 pt</text>
      <line x1="-30" y1="114" x2="30" y2="114" stroke="#FF3038" stroke-width="2" />
    </g>

    <!-- Trophy 5: Issues -->
    <g transform="translate(447, 0)">
      <text x="0" y="12" font-size="9.5" fill="#6A7280" font-weight="700">Issues</text>
      <g transform="translate(0, 48)">
        <path d="M-14,-22 L14,-22 L10,6 C7,14 -7,14 -10,6 Z" fill="#121620" stroke="#4A5568" stroke-width="1.8" />
        <path d="M-14,-16 C-22,-16 -22,-6 -14,-6" fill="none" stroke="#4A5568" stroke-width="1.6" />
        <path d="M14,-16 C22,-16 22,-6 14,-6" fill="none" stroke="#4A5568" stroke-width="1.6" />
        <rect x="-4" y="14" width="8" height="8" fill="#1C2330" />
        <rect x="-12" y="22" width="24" height="4" rx="1" fill="#4A5568" />
        <text x="0" y="-3" font-family="'Orbitron', sans-serif" font-size="12" font-weight="900" fill="#A8ADB7">?</text>
      </g>
      <text x="0" y="92" font-size="9" fill="#A8ADB7" font-weight="700">Contributor</text>
      <text x="0" y="106" font-size="8.5" fill="#6A7280">0 pt</text>
      <line x1="-30" y1="114" x2="30" y2="114" stroke="#4A5568" stroke-width="2" />
    </g>

    <!-- Trophy 6: PullRequest -->
    <g transform="translate(550, 0)">
      <text x="0" y="12" font-size="9.5" fill="#6A7280" font-weight="700">PullRequest</text>
      <g transform="translate(0, 48)">
        <path d="M-14,-22 L14,-22 L10,6 C7,14 -7,14 -10,6 Z" fill="#121620" stroke="#4A5568" stroke-width="1.8" />
        <path d="M-14,-16 C-22,-16 -22,-6 -14,-6" fill="none" stroke="#4A5568" stroke-width="1.6" />
        <path d="M14,-16 C22,-16 22,-6 14,-6" fill="none" stroke="#4A5568" stroke-width="1.6" />
        <rect x="-4" y="14" width="8" height="8" fill="#1C2330" />
        <rect x="-12" y="22" width="24" height="4" rx="1" fill="#4A5568" />
        <text x="0" y="-3" font-family="'Orbitron', sans-serif" font-size="12" font-weight="900" fill="#A8ADB7">?</text>
      </g>
      <text x="0" y="92" font-size="9" fill="#A8ADB7" font-weight="700">Merger</text>
      <text x="0" y="106" font-size="8.5" fill="#6A7280">0 pt</text>
      <line x1="-30" y1="114" x2="30" y2="114" stroke="#4A5568" stroke-width="2" />
    </g>

    <!-- Trophy 7: Reviews -->
    <g transform="translate(653, 0)">
      <text x="0" y="12" font-size="9.5" fill="#6A7280" font-weight="700">Reviews</text>
      <g transform="translate(0, 48)">
        <path d="M-14,-22 L14,-22 L10,6 C7,14 -7,14 -10,6 Z" fill="#121620" stroke="#4A5568" stroke-width="1.8" />
        <path d="M-14,-16 C-22,-16 -22,-6 -14,-6" fill="none" stroke="#4A5568" stroke-width="1.6" />
        <path d="M14,-16 C22,-16 22,-6 14,-6" fill="none" stroke="#4A5568" stroke-width="1.6" />
        <rect x="-4" y="14" width="8" height="8" fill="#1C2330" />
        <rect x="-12" y="22" width="24" height="4" rx="1" fill="#4A5568" />
        <text x="0" y="-3" font-family="'Orbitron', sans-serif" font-size="12" font-weight="900" fill="#A8ADB7">?</text>
      </g>
      <text x="0" y="92" font-size="9" fill="#A8ADB7" font-weight="700">Reviewer</text>
      <text x="0" y="106" font-size="8.5" fill="#6A7280">0 pt</text>
      <line x1="-30" y1="114" x2="30" y2="114" stroke="#4A5568" stroke-width="2" />
    </g>

    <!-- Trophy 8: Experience -->
    <g transform="translate(756, 0)">
      <text x="0" y="12" font-size="9.5" fill="#6A7280" font-weight="700">Experience</text>
      <g transform="translate(0, 48)">
        <path d="M-14,-22 L14,-22 L10,6 C7,14 -7,14 -10,6 Z" fill="#121620" stroke="#4A5568" stroke-width="1.8" />
        <path d="M-14,-16 C-22,-16 -22,-6 -14,-6" fill="none" stroke="#4A5568" stroke-width="1.6" />
        <path d="M14,-16 C22,-16 22,-6 14,-6" fill="none" stroke="#4A5568" stroke-width="1.6" />
        <rect x="-4" y="14" width="8" height="8" fill="#1C2330" />
        <rect x="-12" y="22" width="24" height="4" rx="1" fill="#4A5568" />
        <text x="0" y="-3" font-family="'Orbitron', sans-serif" font-size="12" font-weight="900" fill="#A8ADB7">?</text>
      </g>
      <text x="0" y="92" font-size="9" fill="#A8ADB7" font-weight="700">Explorer</text>
      <text x="0" y="106" font-size="8.5" fill="#6A7280">1 pt</text>
      <line x1="-30" y1="114" x2="30" y2="114" stroke="#4A5568" stroke-width="2" />
    </g>
  </g>
</svg>
