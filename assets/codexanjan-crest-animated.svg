<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0D" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B4B" />
      <stop offset="50%" stop-color="#FF3038" />
      <stop offset="100%" stop-color="#8C111B" />
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F4F2" />
      <stop offset="50%" stop-color="#A8ADB7" />
      <stop offset="100%" stop-color="#4A505B" />
    </linearGradient>
    <linearGradient id="armorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2029" />
      <stop offset="100%" stop-color="#101318" />
    </linearGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3038" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FF3038" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#55E6FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#55E6FF" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      /* Katana Draw Animation */
      @keyframes drawPath {
        0% { stroke-dashoffset: 400; opacity: 0.2; }
        50% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 1; }
      }

      /* Energy Surge Animation */
      @keyframes energySurge {
        0%, 100% { stroke-dashoffset: 300; opacity: 0.3; }
        50% { stroke-dashoffset: 0; opacity: 1; }
      }

      /* Blade Slash Flare */
      @keyframes bladePulse {
        0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 2px #FF3038); }
        50% { opacity: 1; filter: drop-shadow(0 0 10px #FF4B4B); }
      }

      /* Core Ambient Glow Pulse */
      @keyframes ambientPulse {
        0%, 100% { transform: scale(0.95); opacity: 0.3; }
        50% { transform: scale(1.08); opacity: 0.65; }
      }

      /* Terminal Cursor Blink */
      @keyframes cursorBlink {
        0%, 45% { opacity: 1; }
        50%, 95% { opacity: 0; }
        100% { opacity: 1; }
      }

      /* Ring Slow Tick (Not continuous high-speed spin) */
      @keyframes ringBreath {
        0%, 100% { stroke-dashoffset: 0; }
        50% { stroke-dashoffset: 30; }
      }

      /* Telemetry Scan Line */
      @keyframes scanSweep {
        0% { transform: translateY(0); opacity: 0; }
        10% { opacity: 0.8; }
        90% { opacity: 0.8; }
        100% { transform: translateY(280px); opacity: 0; }
      }

      .bracket-draw {
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
        animation: drawPath 3.5s cubic-bezier(0.16, 1, 0.3, 1) forwards infinite alternate;
      }

      .blade-line {
        animation: bladePulse 4s ease-in-out infinite;
      }

      .energy-stream {
        stroke-dasharray: 60 120;
        animation: energySurge 4.5s linear infinite;
      }

      .cursor {
        animation: cursorBlink 1.2s infinite;
      }

      .ring-anim {
        animation: ringBreath 8s ease-in-out infinite;
      }

      .ambient {
        transform-origin: 200px 200px;
        animation: ambientPulse 6s ease-in-out infinite;
      }

      .scanner-line {
        animation: scanSweep 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="16" fill="url(#bgGrad)" />
  <rect width="396" height="396" x="2" y="2" rx="14" fill="none" stroke="#171B21" stroke-width="1.5" />

  <!-- Ambient Glow Center -->
  <circle cx="200" cy="200" r="130" fill="url(#redGlow)" class="ambient" />

  <!-- Scanner Line Clip Area -->
  <g clip-path="url(#crestClip)">
    <clipPath id="crestClip">
      <polygon points="200,64 300,105 336,200 300,295 200,336 100,295 64,200 100,105" />
    </clipPath>
    <line x1="80" y1="60" x2="320" y2="60" stroke="#FF3038" stroke-width="1.5" opacity="0.6" class="scanner-line" />
  </g>

  <!-- Outer Ring - Samurai Crest Geometric Border -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#222832" stroke-width="1.5" stroke-dasharray="12 8" class="ring-anim" />
  <circle cx="200" cy="200" r="162" fill="none" stroke="#171B21" stroke-width="1" />

  <!-- Corner Brackets (HUD Precision) -->
  <path d="M 50 70 L 50 50 L 70 50" fill="none" stroke="#FF3038" stroke-width="2" />
  <path d="M 330 50 L 350 50 L 350 70" fill="none" stroke="#FF3038" stroke-width="2" />
  <path d="M 50 330 L 50 350 L 70 350" fill="none" stroke="#FF3038" stroke-width="2" />
  <path d="M 330 350 L 350 350 L 350 330" fill="none" stroke="#FF3038" stroke-width="2" />

  <!-- Cardinal Coordinates & Marks -->
  <line x1="200" y1="28" x2="200" y2="40" stroke="#FF3038" stroke-width="2" />
  <line x1="200" y1="360" x2="200" y2="372" stroke="#FF3038" stroke-width="2" />
  <line x1="28" y1="200" x2="40" y2="200" stroke="#55E6FF" stroke-width="2" />
  <line x1="360" y1="200" x2="372" y2="200" stroke="#55E6FF" stroke-width="2" />

  <!-- Octagonal Diamond Crest Frame -->
  <polygon points="200,64 300,105 336,200 300,295 200,336 100,295 64,200 100,105" 
           fill="none" stroke="#262D38" stroke-width="2" />

  <!-- Inner Diamond Armor Frame -->
  <polygon points="200,82 284,118 316,200 284,282 200,318 116,282 84,200 116,118" 
           fill="url(#armorGrad)" stroke="#A8ADB7" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Code Bracket "<" and ">" with self-drawing animation -->
  <path d="M 160 120 L 115 195 L 160 270" fill="none" stroke="url(#steelGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" class="bracket-draw" />
  <path d="M 152 140 L 126 195 L 152 250" fill="none" stroke="#55E6FF" stroke-width="2" stroke-opacity="0.7" />

  <path d="M 240 120 L 285 195 L 240 270" fill="none" stroke="url(#steelGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" class="bracket-draw" />
  <path d="M 248 140 L 274 195 L 248 250" fill="none" stroke="#55E6FF" stroke-width="2" stroke-opacity="0.7" />

  <!-- The "A" Apex Chevron (Armor Kabuto Crown) -->
  <path d="M 150 140 L 200 88 L 250 140" fill="none" stroke="#F4F4F2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="200,75 208,95 200,90 192,95" fill="#FF3038" filter="url(#glow)" />

  <!-- The "S" Curve Flow (Stylized Dual Katana Guard) -->
  <path d="M 230 155 Q 160 145 175 190 Q 185 210 200 210" fill="none" stroke="#A8ADB7" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 200 210 Q 215 210 225 230 Q 240 275 170 265" fill="none" stroke="#A8ADB7" stroke-width="4.5" stroke-linecap="round" />

  <!-- Central Katana Slash Blade & Crimson Energy Beam -->
  <line x1="130" y1="290" x2="270" y2="110" stroke="#080A0D" stroke-width="10" stroke-linecap="round" />
  <line x1="130" y1="290" x2="270" y2="110" stroke="url(#bladeGrad)" stroke-width="5" stroke-linecap="round" class="blade-line" filter="url(#strongGlow)" />
  <!-- Traveling Energy Spark Line -->
  <line x1="130" y1="290" x2="270" y2="110" stroke="#FFF" stroke-width="2" stroke-linecap="round" class="energy-stream" />

  <!-- Terminal Cursor & AI Spark Core at Center Intersection -->
  <circle cx="200" cy="200" r="16" fill="url(#cyanCore)" />
  <rect x="194" y="192" width="12" height="16" rx="1.5" fill="#55E6FF" filter="url(#glow)" class="cursor" />

  <!-- Circuit Trace Micro-Nodes with Status Lights -->
  <circle cx="115" cy="195" r="4" fill="#FF3038" />
  <circle cx="285" cy="195" r="4" fill="#FF3038" />
  <circle cx="200" cy="88" r="3" fill="#55E6FF" />
  <line x1="115" y1="195" x2="84" y2="195" stroke="#FF3038" stroke-width="1.5" />
  <line x1="285" y1="195" x2="316" y2="195" stroke="#FF3038" stroke-width="1.5" />

  <!-- Typography Beneath Crest -->
  <text x="200" y="360" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="12" font-weight="700" fill="#A8ADB7" letter-spacing="4">CODEXANJAN</text>
  <text x="200" y="376" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="8" font-weight="600" fill="#FF3038" letter-spacing="3">SYSTEM ACTIVE // RONIN CREST</text>
</svg>
