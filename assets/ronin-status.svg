<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="statusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0D" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3038" stop-opacity="0" />
      <stop offset="50%" stop-color="#FF3038" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF3038" stop-opacity="0" />
    </linearGradient>
    <filter id="statusGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes sweep {
        0% { transform: translateX(-150px); }
        100% { transform: translateX(850px); }
      }
      @keyframes pulseLight {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      .scanner-bar { animation: sweep 4s linear infinite; }
      .status-pulse { animation: pulseLight 2s infinite; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="160" rx="8" fill="url(#statusBg)" stroke="#171B21" stroke-width="1.5" />
  
  <!-- Angular Chamfers -->
  <polygon points="0,0 20,0 0,20" fill="#FF3038" />
  <polygon points="800,160 780,160 800,140" fill="#FF3038" />

  <!-- Moving Red Scanner Bar -->
  <g clip-path="url(#statusClip)">
    <clipPath id="statusClip">
      <rect x="2" y="2" width="796" height="156" rx="6" />
    </clipPath>
    <line x1="0" y1="0" x2="0" y2="160" stroke="#FF3038" stroke-width="2" class="scanner-bar" filter="url(#statusGlow)" />
    <rect x="-40" y="0" width="80" height="160" fill="url(#scanGrad)" opacity="0.15" class="scanner-bar" />
  </g>

  <!-- Top Title & Telemetry -->
  <g transform="translate(30, 28)">
    <text x="0" y="0" font-family="'Courier New', Consolas, monospace" font-size="12" font-weight="700" fill="#FF3038" letter-spacing="3">TACTICAL STATUS HUD</text>
    <text x="600" y="0" font-family="'Courier New', Consolas, monospace" font-size="10" fill="#787F89" letter-spacing="1">CHIP: QUANTUM-09</text>
    <line x1="0" y1="12" x2="740" y2="12" stroke="#171B21" stroke-width="1" />
  </g>

  <!-- Status Fields (2 Rows x 3 Columns) -->
  <g transform="translate(40, 70)" font-family="'Courier New', Consolas, monospace">
    <!-- Col 1 -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" font-size="10" fill="#787F89" letter-spacing="2">OPERATIVE</text>
      <text x="0" y="20" font-size="14" font-weight="700" fill="#F4F4F2">ANJAN SHETTY</text>

      <text x="0" y="48" font-size="10" fill="#787F89" letter-spacing="2">ROLE</text>
      <text x="0" y="68" font-size="13" font-weight="700" fill="#A8ADB7">FULL-STACK DEVELOPER</text>
    </g>

    <!-- Col 2 -->
    <g transform="translate(260, 0)">
      <text x="0" y="0" font-size="10" fill="#787F89" letter-spacing="2">CODENAME</text>
      <text x="0" y="20" font-size="14" font-weight="700" fill="#FF3038">CODEXANJAN</text>

      <text x="0" y="48" font-size="10" fill="#787F89" letter-spacing="2">SPECIALIZATION</text>
      <text x="0" y="68" font-size="13" font-weight="700" fill="#55E6FF">AI / ML ENGINEERING</text>
    </g>

    <!-- Col 3 -->
    <g transform="translate(530, 0)">
      <text x="0" y="0" font-size="10" fill="#787F89" letter-spacing="2">STATUS</text>
      <g transform="translate(0, 20)">
        <circle cx="5" cy="-4" r="4" fill="#42FF9E" class="status-pulse" />
        <text x="16" y="0" font-size="13" font-weight="700" fill="#42FF9E">BUILDING</text>
      </g>

      <text x="0" y="48" font-size="10" fill="#787F89" letter-spacing="2">NETWORK</text>
      <text x="0" y="68" font-size="13" font-weight="700" fill="#F4F4F2">GITHUB // SYNCED</text>
    </g>
  </g>
</svg>
