<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="spider-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF1B2D" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#C8102E" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#020204" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="body-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1B2D"/>
      <stop offset="60%" stop-color="#E62429"/>
      <stop offset="100%" stop-color="#880e4f"/>
    </linearGradient>

    <linearGradient id="leg-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21D4FD"/>
      <stop offset="50%" stop-color="#00A8FF"/>
      <stop offset="100%" stop-color="#0055ff"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="core-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="10" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="blue-edge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes logo-pulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 6px #FF1B2D); }
        50% { transform: scale(1.02); filter: drop-shadow(0 0 16px #FF1B2D) drop-shadow(0 0 22px #00A8FF); }
      }
      @keyframes orbit-ring {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .spider-pulse { transform-origin: 120px 120px; animation: logo-pulse 3.5s ease-in-out infinite; }
      .ring-rotate { transform-origin: 120px 120px; animation: orbit-ring 24s linear infinite; }
      .mono-text { font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, 'Fira Code', monospace; }
    </style>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="120" cy="120" r="110" fill="url(#spider-glow)"/>

  <!-- Rotating Outer Web Reticle -->
  <g class="ring-rotate">
    <circle cx="120" cy="120" r="102" fill="none" stroke="#00A8FF" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="12 18 36 12"/>
    <circle cx="120" cy="120" r="90" fill="none" stroke="#FF1B2D" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="6 12"/>
    <polygon points="120,18 124,26 116,26" fill="#00A8FF"/>
    <polygon points="120,222 124,214 116,214" fill="#00A8FF"/>
    <polygon points="18,120 26,124 26,116" fill="#FF1B2D"/>
    <polygon points="222,120 214,124 214,116" fill="#FF1B2D"/>
  </g>

  <!-- Inner HUD Hexagon Web -->
  <polygon points="120,44 186,82 186,158 120,196 54,158 54,82" fill="none" stroke="#8B93A7" stroke-opacity="0.15" stroke-width="1"/>

  <!-- ======================================================= -->
  <!-- MAIN DEVELOPER SPIDER EMBLEM                            -->
  <!-- ======================================================= -->
  <g class="spider-pulse">
    <!-- EIGHT FUTURISTIC LEGS (Code Brackets & Circuit Traces) -->
    <!-- Top Left Leg 1 -->
    <path d="M 104 100 L 76 72 L 44 80 L 32 64" fill="none" stroke="url(#leg-blue)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#blue-edge-glow)"/>
    <circle cx="32" cy="64" r="2" fill="#21D4FD"/>

    <!-- Upper Left Leg 2 -->
    <path d="M 100 114 L 64 96 L 36 112 L 20 102" fill="none" stroke="url(#leg-blue)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#blue-edge-glow)"/>
    <circle cx="20" cy="102" r="2" fill="#21D4FD"/>

    <!-- Lower Left Leg 3 -->
    <path d="M 100 130 L 62 144 L 38 134 L 24 148" fill="none" stroke="url(#leg-blue)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#blue-edge-glow)"/>
    <circle cx="24" cy="148" r="2" fill="#21D4FD"/>

    <!-- Bottom Left Leg 4 -->
    <path d="M 106 142 L 72 168 L 52 162 L 40 184" fill="none" stroke="url(#leg-blue)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#blue-edge-glow)"/>
    <circle cx="40" cy="184" r="2" fill="#21D4FD"/>

    <!-- Top Right Leg 5 -->
    <path d="M 136 100 L 164 72 L 196 80 L 208 64" fill="none" stroke="url(#leg-blue)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#blue-edge-glow)"/>
    <circle cx="208" cy="64" r="2" fill="#21D4FD"/>

    <!-- Upper Right Leg 6 -->
    <path d="M 140 114 L 176 96 L 204 112 L 220 102" fill="none" stroke="url(#leg-blue)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#blue-edge-glow)"/>
    <circle cx="220" cy="102" r="2" fill="#21D4FD"/>

    <!-- Lower Right Leg 7 -->
    <path d="M 140 130 L 178 144 L 202 134 L 216 148" fill="none" stroke="url(#leg-blue)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#blue-edge-glow)"/>
    <circle cx="216" cy="148" r="2" fill="#21D4FD"/>

    <!-- Bottom Right Leg 8 -->
    <path d="M 134 142 L 168 168 L 188 162 L 200 184" fill="none" stroke="url(#leg-blue)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#blue-edge-glow)"/>
    <circle cx="200" cy="184" r="2" fill="#21D4FD"/>

    <!-- SPIDER HEAD / CEPHALOTHORAX (Diamond Tech Shield) -->
    <polygon points="120,70 136,88 120,98 104,88" fill="#050509" stroke="#FF1B2D" stroke-width="2" filter="url(#core-glow)"/>
    <!-- Glowing Eye Nodes -->
    <circle cx="114" cy="85" r="2.5" fill="#21D4FD"/>
    <circle cx="126" cy="85" r="2.5" fill="#21D4FD"/>
    <!-- Head Bracket Monogram -->
    <polygon points="120,74 126,82 120,86 114,82" fill="#FF1B2D"/>

    <!-- SPIDER ABDOMEN (Hexagonal Cyber Core) -->
    <polygon points="120,102 144,116 140,154 120,172 100,154 96,116" fill="#09090F" stroke="#FF1B2D" stroke-width="2" filter="url(#core-glow)"/>
    <polygon points="120,106 138,118 135,148 120,164 105,148 102,118" fill="#050509" stroke="#00A8FF" stroke-width="1"/>

    <!-- ABDOMEN EMBED: </> AND AS MONOGRAM -->
    <text x="120" y="132" text-anchor="middle" fill="#F5F7FA" font-size="13" font-weight="900" class="mono-text" letter-spacing="1">
      &lt;/&gt;
    </text>
    <text x="120" y="152" text-anchor="middle" fill="#21D4FD" font-size="9" font-weight="900" class="mono-text" letter-spacing="3">
      AS
    </text>

    <!-- Center Abdomen Energy Spines -->
    <line x1="120" y1="102" x2="120" y2="120" stroke="#FF1B2D" stroke-width="1.5"/>
    <line x1="120" y1="156" x2="120" y2="170" stroke="#FF1B2D" stroke-width="1.5"/>
  </g>
</svg>
